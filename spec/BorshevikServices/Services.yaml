description: "Borshevik's systemd units and the scripts they run, and how they are switched on in the image: boot-time units for kernel arguments and MOK enrollment, login-time user units for the App Manager's first run, newly shipped extensions and the GNOME Shell watchdog. Android's update timer is not among them: it is off until Android is installed, and is described with @WaydroidApp."
extends: "@Software"
platform: systemd / bash
src: build_files/root/usr/lib/systemd/
components:
  - id: kernel-args
    type: "@Singleton"
    description: Keeps the kernel arguments Borshevik needs set. Checked on every boot; in practice it acts once, on the first boot of an install or after a rebase between variants, and reboots when it had to set any.
    components:
      - id: script
        type: "@ShellScript"
        description: Ensures the required kernel arguments are present on first boot, rebooting once if it had to add any.
        src: build_files/root/usr/libexec/borshevik/setup-kargs.sh
        functions:
          - id: run
            description: Adds preempt=full, and on the NVIDIA image — detected by the nvidia-driver package — the arguments that give the proprietary driver kernel modesetting and keep the nouveau and nova_core drivers from loading. Does nothing when all of them are already set; otherwise sets the missing ones in a single rpm-ostree call, shows a message on the boot splash, and reboots, so a boot that had to set any reboots once.
      - id: service
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/system/setup-kargs.service
        unit_type: service
        scope: system
        triggers: every boot, before the display manager and after setup-ublue-mok; not in recovery mode
        executes: /usr/libexec/borshevik/setup-kargs.sh
        description: Oneshot service running the script on every boot.
  - id: mok-enrollment
    type: "@Singleton"
    description: Enrolls the uBlue MOK key for NVIDIA Secure Boot on first boot.
    components:
      - id: script
        type: "@ShellScript"
        description: Enrolls the uBlue Machine Owner Key so NVIDIA modules load under Secure Boot.
        src: build_files/root/usr/libexec/borshevik/setup-ublue-mok.sh
        functions:
          - id: run
            description: Exits immediately when `mokutil --sb-state` does not report Secure Boot as enabled, and again when `mokutil --test-key` shows /etc/pki/akmods/certs/akmods-ublue.der is already enrolled. Otherwise it prompts interactively via systemd-ask-password for a temporary PIN, looping until a non-empty one is given — this service blocks the boot on user input by design, since the same PIN must be typed into the UEFI MOK manager on the next start. Cancelling the prompt exits 130 and leaves the key unenrolled, so the prompt comes back on the next boot. With a PIN it clears any pending MOK timeout, sets the MOK password from the PIN's hash, imports the key with it, and reboots.
      - id: service
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/system/setup-ublue-mok.service
        unit_type: service
        scope: system
        triggers: boot
        executes: /usr/libexec/borshevik/setup-ublue-mok.sh
        description: "Oneshot service. Enrolls the uBlue MOK key for NVIDIA Secure Boot. Only active on borshevik-nvidia."
  - id: app-manager-first-run
    type: "@SystemdUnit"
    src: build_files/root/usr/lib/systemd/user/borshevik-app-manager-first-run.service
    unit_type: service
    scope: user
    triggers: login to a regular GNOME session — WantedBy, After and PartOf gnome-session@gnome.target; enabled globally via user-preset
    executes: borshevik-app-manager-first-run
    description: "Runs borshevik-app-manager-first-run on login. Gated twice on the same stamp file, ~/.local/state/borshevik/app-manager-first-run.done: the unit carries ConditionPathExists=! on it, and @AppManagerApp#first-run checks it again before launching. The stamp is written whenever the App Manager exits successfully — which includes the user simply closing its window — so it opens again at the next login only after a crash. Oneshot, active for as long as the App Manager's window is open. It used to want, follow and be wanted by graphical-session.target, against the rule for user units (@Services#guidelines): on a new account's first login — the login it exists for — it started with that target before GNOME did, the App Manager failed to open a display, and the 0.1 s that took held the target across gnome-session's check, which aborted the login; on 2026-10-14 a fresh install's first login took three attempts, the journal showing that sequence before each failed one. It also ran in the GDM greeter's session, whose user has no stamp, and kept an App Manager nobody could see running there until someone logged in. first-login-scenario is that first login."
  - id: first-login-scenario
    type: "@ShellScript"
    src:
      - tests/scenarios/first-login/prepare.sh
      - tests/scenarios/first-login/guest.sh
      - tests/scenarios/first-login/paths
    description: "The first-login scenario of @BorshevikWorkflow#scenarios: a new account's first login, which every fresh install begins with and the test machine's existing user never has — the App Manager's first run still to come, at a login more than a minute after boot. Run whenever a change touches a Borshevik user unit, the first run's launcher, or how user units are switched on."
    functions:
      - id: prepare
        description: "Before tester's login: removes tester's app-manager-first-run.done stamp, which @BorshevikWorkflow#test-image-in-vm wrote for it, so this login is the App Manager's first run."
      - id: run
        description: "After the login and the checks — which in this run already show one graphical session and no 'A graphical session is already running' (@BorshevikWorkflow#image-checks 4): app-manager-first-run started no earlier than tester's gnome-session@gnome.target became active, by their monotonic timestamps, and is still running; the App Manager owns its application id on tester's session bus, its window showing in the scenario's screenshot; and the stamp is not written yet, the window being still open."
  - id: gnome-watchdog
    type: "@Singleton"
    description: Detects and restarts a hung GNOME Shell process. Runs every minute via a user-level timer, in a user's GNOME session only; the greeter's GNOME Shell is not watched, the greeter's session not starting the timer (@Services#guidelines).
    components:
      - id: script
        type: "@ShellScript"
        description: Watchdog that probes GNOME Shell over D-Bus and kills it when it stops responding.
        src: build_files/root/usr/libexec/borshevik/borshevik-kill-gnome-if-hung.sh
        functions:
          - id: run
            description: Asks GNOME Shell over D-Bus for its version; if no answer comes within a minute, terminates the user's gnome-shell and kills it if it is still there two seconds later. A minute, not less, because what stalls the shell in practice is a GPU hang on Meteor Lake — i915's GuC stops answering TLB invalidations (https://gitlab.freedesktop.org/drm/i915/kernel/-/work_items/14469) — and the kernel resets the GPU only 20–40 seconds in, after which the shell usually carries on by itself; with 10 seconds the watchdog killed sessions before that reset could save them. gdbus is given the same timeout, since its own default of 25 seconds would end the wait early and count as no answer, and gnome-watchdog#service's start timeout stays above the wait plus the grace, or systemd stops the probe before it decides.
      - id: service
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/user/borshevik-kill-gnome-if-hung.service
        unit_type: service
        scope: user
        triggers: gnome-watchdog#timer
        executes: /usr/libexec/borshevik/borshevik-kill-gnome-if-hung.sh
        description: "Oneshot service. Runs the GNOME Shell watchdog script when triggered by the timer. Wants and follows nothing: it used to want graphical-session.target, and since the timer then counted from the machine's boot it ran at once at any login more than a minute after it, bringing that target up before GNOME (@Services#guidelines)."
      - id: timer
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/user/borshevik-kill-gnome-if-hung.timer
        unit_type: timer
        scope: user
        triggers: OnActiveSec=1min, OnUnitActiveSec=1min; WantedBy and PartOf gnome-session@gnome.target
        executes: ""
        description: Fires gnome-watchdog#service every minute, starting one minute after the GNOME session started the timer, and stops with the session.
  - id: enable-services
    type: "@ShellScript"
    description: Enables Borshevik's system and user units at image build time.
    src: build_files/scripts/enable-services.sh
    functions:
      - id: run
        description: "Enables setup-kargs.service system-wide, then applies `systemctl --global preset` to borshevik-app-manager-first-run.service, borshevik-enable-new-extensions.service and borshevik-kill-gnome-if-hung.timer — preset, not enable, so the decision comes from @Services#user-preset. The watchdog's .service is deliberately not preset; the timer pulls it in. Disables waydroid-container.service, which Fedora's presets enable with the waydroid package: Android is installed only by those who ask for it, and @WaydroidApp#control#install enables the service then. setup-ublue-mok.service is enabled only when IMAGE_NAME is borshevik-nvidia, which is what keeps MOK enrollment out of the standard variant. Run at image build time from @ImageBuild#build-addons."
  - id: user-preset
    type: "@ConfigFile"
    src: build_files/root/usr/lib/systemd/user-preset/90-borshevik.preset
    description: Preset file holding `enable` for app-manager-first-run, extension-autoenable#service, gnome-watchdog#timer and @WaydroidApp#theme-sync. @Services#enable-services applies it per unit with `systemctl --global preset <unit>` at build time, so these are on for every user account, including ones created later. theme-sync is enabled on every machine and keeps itself from starting where Android is not installed, by its own condition.
  - id: extension-autoenable
    type: "@Singleton"
    description: "Enables every GNOME Shell extension the image ships, once per extension per user. The image's default enabled-extensions (written by @ShellCustomizations' apply-dconf step) is only a system-db default: the first time a user toggles any extension, their own user-db list takes over and a system default is never read again, so an extension added to the image later stayed off for everyone who had ever touched their extensions. This offers each system extension to each user exactly once and remembers it, enabling it only if the user's lists have never named it, so a decision to switch one off is kept — whether made before this service existed or after. It also turns extensions back on as a whole when GNOME has switched them all off. GNOME does that through org.gnome.shell disable-user-extensions: GNOME Shell creates $XDG_RUNTIME_DIR/gnome-shell-disable-extensions when it starts and deletes it a minute later, or earlier in a shutdown handler of its own if the session ends cleanly before then; if org.gnome.Shell@.service fails while the file is there, its OnFailure= runs org.gnome.Shell-disable-extensions.service, which sets the key, taking the failure for an extension's fault. On Borshevik the shell fails at nearly every logout without any extension being at fault: under focus-follows-mouse (@ShellCustomizations' focus-mode default), mutter's pointer-rest focus timer fires during an earlier shutdown handler — the one in which the shell waits for its screen-time history to be written — after Xwayland is gone, and blocks in XIfEvent waiting for an answer from the dead X server, so the handler that would delete the file never runs (mutter issue https://gitlab.gnome.org/GNOME/mutter/-/work_items/4892, fix proposed in https://gitlab.gnome.org/GNOME/mutter/-/merge_requests/5376); systemd aborts it after TimeoutStopSec, and the unit fails. So a session ended within its first minute left the account with every extension off from then on (seen 2026-10-22, on accounts used for trying images). The key is reset at every login, and is not treated as a user's choice although the Extensions app's main switch writes it too: the author's decision (2026-10-22) — Borshevik is not meant to be used with its extensions off, and whoever wants that can disable this service. The cost is GNOME's own protection: an extension that really does crash the shell within its first minute is switched back on at every login instead of staying off."
    components:
      - id: script
        type: "@ShellScript"
        description: Bash script, run as the user, that turns on system extensions this user has not been offered before, and turns extensions back on when GNOME has switched them all off.
        src: build_files/root/usr/libexec/borshevik/borshevik-enable-new-extensions.sh
        functions:
          - id: run
            description: "Under `set -uo pipefail`. The state file is ${XDG_STATE_HOME:-$HOME/.local/state}/borshevik/offered-extensions, one uuid per line; creates its directory and the file if missing. It then waits 5 seconds, so the desktop comes up first and the extensions come on after it rather than in the middle of the login (the author's choice), and reads org.gnome.shell disable-user-extensions; when it is true, it sets it to false and logs `re-enabled user extensions` (@Services#extension-autoenable says why), and the shell enables every extension in the user's list. It then waits 10 seconds more before it looks for new extensions, whatever it found, so that a write to enabled-extensions never follows the one to disable-user-extensions closely. The shell handles a change notification by reading the settings as they are when it gets to it, not as they were written, and starts enabling what it finds newly enabled without waiting for a pass still under way, which updates its record of what is enabled only when it ends; two writes close together are each seen in full by both passes, which then initialise the same extensions twice — tried 2026-10-22, the two writes a few milliseconds apart: four of the VM's extensions failed with 'Extension point conflict' or 'already exported'. 10 seconds is time for the shell to enable them all; the VM's 19 take a few. For each directory under /usr/share/gnome-shell/extensions — its name is the extension uuid — skips it when the state file already holds that exact line (`grep -qxF`). An extension not yet offered is next checked against the user's own choices, read once per run with `gsettings get org.gnome.shell` for enabled-extensions and disabled-extensions: when enabled-extensions already names it — which for a user who never toggled anything is the image's dconf default, listing every system extension — it is on already, and is only recorded; when disabled-extensions names it, the user switched it off, and it is only recorded, not enabled. Only an extension named in neither list, one this user has never seen, is to be enabled. All of those are enabled together, by one write: `gsettings set org.gnome.shell enabled-extensions` with the list as read plus the new uuids appended (a list read as `@as []` becomes just the new ones). The running GNOME Shell watches that key and enables each newly listed extension once, exactly as it does at startup; the new ones are in neither list, so disabled-extensions has nothing to override. They are not enabled one by one with `gnome-extensions enable`: each such call reaches the shell twice — over D-Bus, and through the key the shell rewrites for it, whose change it handles asynchronously — and back-to-back calls had it enable the same extension twice, which on a new user's first login left clipboard-indicator and Twitch Live failing with \"Extension point conflict\" and GSConnect's daemon exiting, until the next login. Only when the write succeeds are the new uuids appended to the state file, so if it fails they are offered again at the next login. A failed write is reported on stderr and makes the script exit 1, so it shows in the unit's journal — new extensions not then recorded are offered again at the next login, and the key, still true, is cleared at the next login too; otherwise it exits 0; nothing is written when there is nothing new and the key is false. Each skip, record-only and enable is logged as one line (`already enabled <uuid>`, `kept disabled <uuid>`, `enabled <uuid>`). So the first run for an existing user changes nothing they chose — it records what is there and turns on only what their list has never named, such as an extension shipped after they first toggled one — and every later run touches only extensions the image has gained since. The check relies on GNOME Shell adding an extension to disabled-extensions when it is switched off, which it does; a uuid removed from enabled-extensions by hand, bypassing the shell, looks never seen and is enabled."
      - id: service
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/user/borshevik-enable-new-extensions.service
        unit_type: service
        scope: user
        triggers: login to a regular GNOME session — WantedBy, After and PartOf gnome-session@gnome.target; enabled globally via user-preset
        executes: /usr/libexec/borshevik/borshevik-enable-new-extensions.sh
        description: "Oneshot service, active for some 15 seconds of each login because of the script's waits — within the 30 seconds @BorshevikWorkflow#test-image-in-vm leaves a session to settle before its checks, which read what the service did. Runs on every login rather than once, because the image can gain an extension with any update; the state file, not the unit, is what makes each extension a one-time offer. Started by gnome-session@gnome.target, which gnome-session reaches only after org.gnome.Shell@user.service — a Type=notify unit — reports GNOME Shell ready, so the shell is there to pick up the change to enabled-extensions; the greeter (gnome-session@gnome-login.target) and initial setup never start it. It was the first unit to break a login by hanging off graphical-session.target, before the rule for user units (@Services#guidelines) was written: that target came up before GNOME — the watchdog's service wanted it then and ran at once at a login more than a minute after boot — and while any unit holding it is still running, gnome-session-init-worker finds a graphical session already active and aborts the login. Hooked there, this service did exactly that: GNOME Shell was not up yet, so each `gnome-extensions enable` D-Bus-activated the Extensions app, which failed to open a display, and the run took seconds instead of the watchdog's milliseconds."
      - id: vm-scenario
        type: "@ShellScript"
        src:
          - tests/scenarios/new-extensions/prepare.sh
          - tests/scenarios/new-extensions/guest.sh
          - tests/scenarios/new-extensions/paths
        description: "The new-extensions scenario of @BorshevikWorkflow#scenarios, for the case this service exists for at its hardest: a user to whom every extension the image ships is new, so the service has to enable all of them at once in the running shell — the case in which enabling them one by one had left some enabled twice — and whose extensions GNOME has, besides, switched off as a whole, so the service also has to turn them back on, with the two writes far enough apart that the shell's handling of them does not overlap. Run whenever a change touches the service, its unit or preset, how units are enabled, the image's default enabled-extensions, or which extensions the image ships and how they are installed."
        functions:
          - id: prepare
            description: "Before tester's login: sets tester's enabled-extensions and disabled-extensions to empty lists, through a private D-Bus session as tester, so the user-db overrides the image's default and every shipped extension is one this user has never been offered; and sets tester's disable-user-extensions to true, as GNOME leaves it after a shell that failed in its first minute, so the shell starts with every user extension off. tester has no offered-extensions state file at this point — it is created on a disk overlay that is new for every run, and the service writes the file only at the login — so nothing is recorded as offered either."
          - id: run
            description: "After the login and the checks — which in this run already show every extension ACTIVE, no extension error and the service's success (@BorshevikWorkflow#image-checks 7 to 9): every directory under /usr/share/gnome-shell/extensions is in tester's enabled-extensions, and none twice; disabled-extensions is still empty, so nothing the service did turned an extension off; the offered-extensions state file holds every shipped uuid exactly once; and the service's journal for this boot logs `enabled <uuid>` for each of them, showing that it was the service, in this login, that enabled them, rather than a default left over; and disable-user-extensions is false again, with the service's journal for this boot logging `re-enabled user extensions`. What shows the two writes did not race is image checks 7 and 8 having passed in the same run: every extension ACTIVE and no extension error, where an extension enabled twice had failed with 'Extension point conflict'."
tests:
  - id: in-vm
    description: The checks every test-machine run makes cover these units for an existing user (@BorshevikWorkflow#image-checks); extension-autoenable#vm-scenario adds the user to whom every extension is new, and first-login-scenario a new account's first login, each selected by itself whenever a change touches its paths.
    command: tests/test-image-in-vm.sh run --scenarios new-extensions
    expect: the checks pass, and the report's `== scenario new-extensions` section ends with 'all checks pass'
guidelines:
  - "Every user unit Borshevik ships hangs off the GNOME session the same way: `After=`, `PartOf=` and `WantedBy=gnome-session@gnome.target`, and no `Wants=`, `Requires=` or `BindsTo=` on graphical-session.target or any gnome-session target — a long-running one also sets `TimeoutStopSec=5`, so a logout is never held up by it (gnome-session(1)). The session pulls the unit in; the unit never pulls the session's targets. gnome-session reaches gnome-session@gnome.target only after GNOME Shell reports itself ready, so whatever the unit does finds the shell there, and the greeter's own session (gnome-session@gnome-login.target) never starts it. The other direction breaks logins: since GNOME 50, gnome-session aborts with 'A graphical session is already running!' when it finds graphical-session.target already active as it starts (gnome-session commit 3b7140d), and a unit that wants that target brings it up early — then every unit the target wants starts with it, before GNOME exists, and holds it. A fresh install from the 13.10.2026 ISO lost two logins to it (2026-10-14). Two exceptions, both forced: a timer takes `PartOf=` and `WantedBy=` but no `After=`, since a timer is ordered before timers.target, which gnome-session@gnome.target comes after, and the two orderings would form a cycle; and the service a timer starts takes none of the three, the timer deciding when it runs. A timer counts from its own start (`OnActiveSec=`), so it fires inside the session and never at the login itself. tests/validate.sh refuses a unit that breaks this (@BorshevikWorkflow#validate)."
