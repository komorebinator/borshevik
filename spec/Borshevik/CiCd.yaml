description: "GitHub Actions CI/CD pipeline that builds, signs, and publishes Borshevik's OCI images, builds bootable ISOs, and promotes images to the :stable channel. There is no push-triggered build anywhere in this pipeline — merging to main does not by itself rebuild anything; a change only ships once the next scheduled run (or a manual dispatch) picks it up."
extends: @Software
platform: GitHub Actions (YAML)
src: .github/
guidelines:
  - "Entry points (independent ways the pipeline starts): (1) the daily cron schedule `00 10 * * *` (10:00 UTC) on build-base — the only fully-automatic entry, and the start of the only fully-automatic chain through the pipeline; (2) manual workflow_dispatch, available independently on every one of the four workflows (build-base, build-borshevik, build-iso, promote-image-to-stable) — none of them require an upstream workflow to have run first when dispatched manually."
  - "Automatic chain (cron path only): build-base's build_and_push job builds, pushes, and cosign-signs @BorshevikBaseImage and @BorshevikBaseNvidiaImage in parallel (matrix). Only once that job succeeds does the build-base job named build-borshevik (needs: build_and_push) invoke build-borshevik.yml as a reusable workflow (workflow_call). That workflow's own build_and_push job then builds, pushes, and cosign-signs @BorshevikImage and @BorshevikNvidiaImage in parallel (matrix), each pulling FROM the base image that was just published in the same run (by tag, not by local stage)."
  - "Output of the automatic chain: four signed images on ghcr.io/komorebinator (borshevik-base, borshevik-base-nvidia, borshevik, borshevik-nvidia), each tagged latest and DD.MM.YYYY. The automatic chain never touches the :stable tag and never produces an ISO — both require a separate, manual step."
  - "promote-image-to-stable and build-iso are independent, manually-triggered downstream consumers — not part of the automatic chain, and not chained to each other automatically either. promote-image-to-stable moves the :stable tag to a chosen digest (manifest-only retag, no rebuild) — this is what makes a build 'releasable'. build-iso always builds from the :stable tag (hardcoded in the workflow, not parametrized) and produces ephemeral ISO artifacts (0-day retention, not published to any registry) — so a fresh image only becomes installable via ISO after someone manually promotes it to stable and then manually re-runs build-iso."
components:
  - id: build-base
    type: @Script
    description: Workflow that builds, pushes and cosign-signs both base images, then invokes the final-layer workflow.
    src: .github/workflows/build-base.yml
    functions:
      - id: run
        description: "Triggered by cron (daily 10:00 UTC) or workflow_dispatch. Runs a matrix build of borshevik-base and borshevik-base-nvidia targets in parallel (each cancels in-progress runs on the same ref). For each variant: creates /mnt/xdg-data for container storage (to avoid runner disk fill); builds the Containerfile target via redhat-actions/buildah-build with BUILD_DATE, IMAGE_TAG=latest, IMAGE_NAME args; logs into GHCR; normalizes registry/image names to lowercase; pushes with tags 'latest' and 'DD.MM.YYYY'; installs cosign; fetches the pushed image digest via skopeo inspect; signs the image by digest using SIGNING_SECRET as COSIGN_PRIVATE_KEY with cosign sign --key env://COSIGN_PRIVATE_KEY. On matrix completion, calls build-borshevik.yml as a reusable workflow (needs: build_and_push)."
  - id: build-borshevik
    type: @Script
    description: Reusable workflow that builds, pushes and cosign-signs both final images on top of the published base tags.
    src: .github/workflows/build-borshevik.yml
    functions:
      - id: run
        description: "Triggered by workflow_call (from build-base.yml after the base matrix succeeds) or workflow_dispatch. Matrix-builds the borshevik and borshevik-nvidia final targets in parallel, mirroring build-base's steps but against the final Containerfile stages, which pull FROM the published ghcr.io/komorebinator/borshevik-base tags. Signs each image by digest with cosign after push. Seven steps carry `if: github.event_name != 'pull_request'` inherited from the upstream uBlue template; since neither trigger can produce a pull_request event, those guards never fire as the workflow stands."
  - id: build-iso
    type: @Script
    description: Manually triggered workflow that builds bootable ISOs from the :stable images.
    src: .github/workflows/build-iso.yml
    functions:
      - id: run
        description: "Triggered manually (workflow_dispatch) or via workflow_call. Builds ISO installer images for borshevik:stable and borshevik-nvidia:stable using build-container-installer. Uploads resulting ISOs (borshevik-stable.iso, borshevik-nvidia-stable.iso) as GitHub Actions artifacts with 0-day retention."
  - id: promote-image-to-stable
    type: @Script
    description: Manually triggered workflow that moves the :stable tag onto a chosen digest and signs the result.
    src: .github/workflows/promote-image-to-stable.yml
    functions:
      - id: run
        description: "Triggered by workflow_dispatch with required inputs: variant (borshevik or borshevik-nvidia) and digest (sha256:... hex string). Validates digest format with regex ^sha256:[0-9a-f]{64}$. Logs into GHCR. Runs 'docker buildx imagetools create --tag ghcr.io/<owner>/<variant>:stable ghcr.io/<owner>/<variant>@<digest>' to create/update the :stable tag pointing to the given digest (no data copy, manifest-only). Fetches the resulting stable tag's manifest digest. Signs that manifest digest with cosign using SIGNING_SECRET. Triggered by borshevik-promote-to-stable CLI script."
  - id: dependabot
    type: @ConfigFile
    src: .github/dependabot.yml
    description: "Configures Dependabot to check the github-actions ecosystem weekly and open PRs for outdated action versions."
  - id: renovate
    type: @ConfigFile
    src: .github/renovate.json5
    description: "Configures Renovate bot using config:best-practices. Auto-merges pin/pinDigest updates. Disables digest/pin updates for container refs in workflow files (to avoid interfering with manually pinned base images). Never rebases open PRs."
