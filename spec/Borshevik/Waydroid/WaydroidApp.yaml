description: "Waydroid as integrated in Borshevik — LineageOS in an LXC container sharing the host kernel, its apps shown as windows of the GNOME session. Only the waydroid RPM ships in the image, layered in the base layer by @ImageBuild#components#install-rpm-packages; nothing else of Android exists on a machine until a user installs it — from the Image Manager's Android tab (@ImageManagerApp#components#main-window#components#android-page), or by checking Android applications support in the App Manager (@AppManagerApp#components#window#components#new-installation-tab#components#modules-group), or importing a configuration that names it there. Both run control#install and show its progress — the Image Manager directly, the App Manager through its module dispatcher (@AppManagerApp#components#modules); neither hands the user over to the other. Android apps themselves the user installs from Google Play; neither app installs any. Installing downloads Waydroid's GAPPS Android image, some 1.4 GB with its vendor image, into /var/lib/waydroid: LineageOS with Google Play Services and the Google Play Store, so apps install from Play and those relying on push, Google sign-in or Google's APIs work. Into it goes an ARM translation layer, because most apps on Google Play are built for ARM only. Neither is built into the Borshevik image: the GAPPS image comes from Waydroid's mirrors, and the translation layer is fetched on the user's machine by waydroid_script at install time — Google's libndk_translation from ChromeOS and Intel's libhoudini are proprietary and may not be redistributed. Google lets an Android build it has not certified into Play only once the user has registered the device's Google Services Framework ID under their own Google account — a step for each install, which no one can do for them (control#google). GAPPS rather than microG (decisions#gapps). Which Android images a machine runs is decided by the Borshevik image it booted, not by Waydroid: each release carries the system and vendor images it approves (config), and the images themselves — too large to build in — are downloaded from Waydroid's mirrors and installed by Android's own timer apart from the OS update, so a new pair arrives with a Borshevik update and a rollback of Borshevik brings back the pair the older release approved. Nothing inside Android updates it (config's `properties`). Whether Android is installed is decided everywhere — the Image Manager's tab, the App Manager, the update service — by control#stamp, not by /var/lib/waydroid existing, so a half-finished install or a Waydroid initialised by hand is never taken for a working one."
src: build_files/root/usr/libexec/borshevik/borshevik-waydroid
platform: bash / systemd
extends: "@Software"
components:
  - id: control
    type: "@Script"
    src: build_files/root/usr/libexec/borshevik/borshevik-waydroid
    description: "Everything that changes Android on the machine, as one script with a subcommand per action, which both apps and the update service call directly: one thing to authorise, and one place where installing, updating and removing are kept consistent with each other, so the Image Manager and the App Manager cannot install Android two different ways. Run under pkexec by @ImageManagerApp#components#waydroid, as root by @AppManagerApp#components#modules — the App Manager's single privileged entry point, which installs every module a run needs under one password — and by update#service. Every subcommand but `rendering` refuses to run unless root, and install, upgrade and remove run one at a time (control#busy). Prints what it is doing line by line, for whichever window shows its progress, and exits non-zero on any failure — but never with 126 or 127, the statuses pkexec returns when the password is refused, so a caller can tell a user who cancelled from an install that broke (@AppManagerApp#components#window#functions#_runModules acts on the difference, through @AppManagerApp#components#modules, which keeps to the same rule)."
    fields:
      - id: stamp
        type: file /var/lib/borshevik/waydroid-installed, holding the Android version (e.g. 13) the translation layer was installed for
        description: The one meaning of 'Android is installed'. Written by install as its very last step and deleted by remove as its first, so its presence always means a finished install; readable by every user, which is how the Image Manager and the App Manager see it without privileges. The version inside is what upgrade compares against, because the translation layer is built for one Android version.
      - id: channel
        type: directory /var/lib/borshevik/waydroid-ota, holding system/lineage/waydroid_x86_64/<romtype>.json and vendor/waydroid_x86_64/MAINLINE.json
        description: "An OTA channel of Waydroid's own format listing only config's approved images, one entry each, which control writes from config before every init and upgrade and hands Waydroid as file:///var/lib/borshevik/waydroid-ota/system and …/vendor. Waydroid reads it exactly as it reads ota.waydro.id — its downloader is urllib, which opens file URLs, and init builds the files' paths from the channel itself — so `waydroid init` and `waydroid upgrade` can fetch nothing but the approved pair, verify it and install it the way they always do, and the zips still come from Waydroid's own mirrors. Written, not shipped, so config stays the one file to edit. Where the two files go inside it is Waydroid's own layout, written down in one place in control — the two URLs control writes the files at, the same ones upgrade points waydroid.cfg at — so the configuration cannot name a file that was not written."
      - id: busy
        type: file /run/borshevik/waydroid-busy, holding `<operation> <pid>` (install, upgrade or remove) under an flock that process holds, and once it has ended `done <operation> <nanoseconds since the epoch>`; empty when none has run since boot
        description: "That an operation is changing Android right now, and which. install, upgrade and remove take the lock before doing anything and refuse at once, exiting 4 with a message, when another holds it — so an install the App Manager started and one the Image Manager's button would start, or an upgrade the timer fires during a removal, can never run over each other. When the operation ends, successful or not, the file is rewritten, not removed — removing it would let a process that had just opened the old file lock it beside one creating a new file — with which operation ended and when, so a reader that last looked before the operation began can tell that one ran even when it began and ended unseen; a refused operation, which never held the lock, writes nothing. A reader that finds an operation in it checks that the pid is alive, so one left behind by a crash is not taken for an operation still running. In /run, so a reboot clears it. Readable by every user: the Image Manager's Android tab shows by it that Android is being installed, updated or removed, which control#stamp alone cannot tell — install deletes the stamp first and writes it last — and by the record of the last one that something changed since it last looked."
      - id: first-boot
        type: files /var/lib/waydroid/overlay/system/etc/init/borshevik.rc and /var/lib/waydroid/overlay/system/etc/borshevik-defaults.sh
        description: "Applies config's `android_settings` inside Android once, the first time it finishes booting: Android's own settings live in its user data, which exists only after a first boot, so they cannot be set from the host the way properties are. install writes both into Waydroid's system overlay, which Android sees as part of /system: an init service, run as root once sys.boot_completed is 1, runs the script, which puts each setting with `settings put <namespace> <key> <value>` unless persist.borshevik.defaults is already 1, and then sets it to 1. So the settings are defaults — one the user changes afterwards stays changed — and a new install, whose data starts empty, gets them again."
      - id: theme
        type: files /var/lib/waydroid/overlay/system/etc/init/borshevik-theme.rc and /var/lib/waydroid/overlay/system/etc/borshevik-theme.sh
        description: "Android's half of theme-sync: applies the colours persist.borshevik.theme names — `<rrggbb> <dark|light>` — inside Android. An init service, run as root, starts the script once Android has booted and again whenever the property changes; the script exits at once while sys.boot_completed is not 1, since a persistent property is loaded early in boot, before Android's settings can be written, and the boot trigger applies it then. The colour becomes Android 13's Material You seed through the secure setting theme_customization_overlay_packages — system palette and accent both that colour, colour source `preset` so the wallpaper no longer decides, style VIBRANT — from which Android derives its whole palette, as from wallpaper. VIBRANT, because it keeps the colour about as saturated as GNOME shows it (decisions#vibrant); dark or light becomes `cmd uimode night yes|no`. The setting is written only when it differs, so a reboot does not make Android redo its overlays. Being a persistent property, the colours survive Android restarting, so an Android started while theme-sync is not running still comes up in the last colours it was given. Written by install and upgrade, so an install made before theme-sync gets it with its next upgrade."
        decisions:
          - id: vibrant
            description: "The VIBRANT style: tried, GNOME's red e62d42 became Android's accent ec0037 under it."
            rejected:
              - "TONAL_SPOT, Material You's default — mutes every seed so much that the author saw no accent at all: the same red became a dusty ac6161"
              - EXPRESSIVE — turns the hue round, red into blue
            date: 2026-10-05
      - id: keylayouts
        type: files /var/lib/waydroid/overlay/system/usr/keylayout/*.kl
        description: "Game controllers' key layouts, as Android would use them if it could see the kernel's configuration. A layout in Android's image may declare `requires_kernel_config CONFIG_…`: it is written for the codes one kernel driver sends, and Android loads it only when /proc/config.gz shows that driver built, falling back otherwise to a layout for the generic HID driver. In the container /proc/config.gz does not exist, so Android always falls back — and the host's driver sends other codes: a DualSense under hid-playstation came out with its face buttons shifted and its triggers and right stick swapped (decisions#dualsense-seen). For each such layout in the installed system image, control checks the required options in the running kernel's configuration (/usr/lib/modules/<release>/config), and when every one is built in or a module, writes a copy without the `requires_kernel_config` lines into the system overlay under the same name, where it takes the place of the image's. Read from the image without mounting it (debugfs). Every copy carries a first line saying control wrote it, and only files carrying it are deleted before the copies are written again, so a layout someone puts there by hand stays. Android 13's GAPPS image has one such layout, the DualSense's (Vendor_054c_Product_0ce6.kl, CONFIG_HID_PLAYSTATION)."
        decisions:
          - id: dualsense-seen
            description: "Seen with a DualSense: a released trigger read as the right stick held at its end, and in Genshin Impact the camera turned to the sky and stayed there."
            date: 2026-10-03
      - id: distrusted-cas
        type: overlayfs whiteouts in /var/lib/waydroid/overlay/system/etc/security/cacerts
        description: Takes the root certificates config's `distrusted_certificates` names out of Android's trust store, which Android's apps verify TLS against — all but Chrome, which keeps a root store of its own. Android 13, which the approved image is, keeps its roots in /system/etc/security/cacerts and changes them only with a new system image; nothing updates them on their own, as Android 14 and later do through Google Play system updates. So a root that must go, before Waydroid ships an image without it, goes here. For each file in that directory of the installed system image whose certificate's SHA-256 fingerprint config names, control puts a whiteout — a character device 0:0, overlayfs's own mark for a deleted file — under the same name into the system overlay, which Waydroid mounts as the topmost lower layer above the image, so Android sees the directory as if the image never held the file. Read from the image without mounting it (debugfs), the way control#keylayouts reads the layouts. Every whiteout there is control's — nothing else puts any in the overlay — so all are deleted before they are written again, and a root config no longer names comes back. One whose image no longer carries it gets no whiteout, so once Waydroid drops a root this does nothing for it. Applies to every user's Android at once, the trust store being part of /system, not of a user's data. Written by install and upgrade, so an Android installed before it loses the roots with its next upgrade.
      - id: google-watch
        type: files /var/lib/waydroid/overlay/system/etc/init/borshevik-google.rc and /var/lib/waydroid/overlay/system/etc/borshevik-google.sh, and the flag /data/borshevik/google-signed-in inside Android
        description: "Notes once, from inside Android, that it has signed in to a Google account — the one sign that the device's registration went through — so any host user can tell it later without a password and without Android running. Reading it from the host needs Android's accounts database, which belongs to Android's system user, uid 1000, and so only the machine's first user, uid 1000 too, can read it without root; the flag needs nothing of the kind. An init service, run as root once sys.boot_completed is 1, exits at once when the flag exists; otherwise it looks at `dumpsys account` then and once an hour after until an account of type com.google appears — a line `Account {name=…, type=com.google}`, not just the type, which `dumpsys account` also prints for Google's account authenticator on every Android with Google's services, signed in or not, and which the first version took for a sign-in (decisions#whole-line) — once an hour at most (decisions#hourly), so a sign-in shows within the hour, or at Android's next start — writes the flag — a file, mode 0644, in a directory of its own, mode 0755 — and ends: the looking stops for good once it has seen one sign-in, and costs nothing between, the container being frozen while Android sleeps. Android's /data is the asking user's ~/.local/share/waydroid/data, which anyone may pass through (mode 0771), so the flag is readable as ~/.local/share/waydroid/data/borshevik/google-signed-in by the user it belongs to, whatever their uid. It names no account and holds nothing but itself. It lives in the user's Android data, so a removal, which deletes that, takes it too; signing out of Google later leaves it, as registration does not end with a sign-out. Written by install and upgrade, so an Android signed in before the flag existed gets it on its first boot after the next upgrade."
        decisions:
          - id: whole-line
            description: "A sign-in is the whole `Account {name=…, type=com.google}` line, not the type alone: the first version took the authenticator's line for one, which vm-scenario caught."
            date: 2026-10-07
          - id: hourly
            description: It looks once an hour at most, so a sign-in shows within the hour, or at Android's next start.
            by: author
      - id: crash-watchdog
        type: files /var/lib/waydroid/overlay/system/etc/init/borshevik-crash-watchdog.rc and /var/lib/waydroid/overlay/system/etc/borshevik-crash-watchdog.sh, and the record /data/borshevik/crash-restarts inside Android
        description: Turns Android's own half-restart after a crash into a whole restart of the container. When system_server dies — on its own, by Android's watchdog, or because SurfaceFlinger did, whose restart restarts zygote — Android restarts zygote and with it system_server inside the running container, and in Waydroid that comes back broken — nothing drawn, no input, no network (decisions#half-restart-broken). An init service, run as root, starts the script whenever init.svc.zygote becomes `stopping` or `restarting` — every half-restart passes through one of them (decisions#both-states); a hwcomposer that restarts alone and an app that crashes set neither, nor does a normal boot. An orderly shutdown or reboot of Android stops zygote too, so the script does nothing while sys.powerctl is set; and since one crash can pass through both states, it does nothing either within a minute of its last restart. Otherwise the script asks Waydroid to restart the container (`service call waydroidhardware 4`, the reboot transaction of the host's hardware service, which runs lxc-stop and lxc-start while the session and its windows stay; decisions#whole-container). Android's apps close, as they do in the half-restart too. So that a crash at every boot cannot restart the container in a loop, the script keeps the times of its last restarts in /data/borshevik/crash-restarts — Android's /data persists across them — and does nothing, saying why in Android's log, once three have happened within ten minutes; Android is then left half-restarted, and `waydroid session stop` is the way out. Written by install and upgrade, so Android installed before it gets it with the next upgrade.
        decisions:
          - id: half-restart-broken
            description: "Android's half-restart comes back broken in Waydroid: Waydroid's hwcomposer, which carries Android's windows, input and clipboard, does not come back connected, so nothing is drawn and no input arrives, and the network stays down for good — netd survives with the old system_server's state, and the new one's Ethernet service waits forever for an IpClient that NetworkStack never starts (seen on the author's machine, 2026-10-10: EthernetServiceThread blocked in awaitIpClientStart, `Active default network: none`). The hwcomposer crashes that set this off are Waydroid's (waydroid/waydroid#1446, #2429, #2085), unfixed in the approved vendor image and in the code since."
            upstream: waydroid/waydroid#432, open since 2022
            date: 2026-10-10
          - id: whole-container
            description: "A fresh container rather than a repair of the half-restarted one: only a fresh container brings the network back. Tried on the author's machine, 2026-10-11: Android booted afresh with display, input and network in about a minute and a half."
            date: 2026-10-11
            rejected:
              - toggling eth0 — does not bring the network back, the Ethernet thread being stuck
          - id: both-states
            description: "Started on `stopping` as well as `restarting`: on the author's machine zygote was restarted, while in the test machine (vm-scenario) it stalled in `stopping` for good, init unable to kill zygote's process group in the container."
            date: 2026-10-11
    functions:
      - id: rendering
        description: "`borshevik-waydroid rendering`, run by any user. Prints `software` when no GPU render node in /dev/dri belongs to a driver Android can render on — every one is the NVIDIA driver's or virtio's — and `hardware` otherwise. Waydroid gets no hardware acceleration from the proprietary NVIDIA driver; and on a virtual machine's virtio GPU without 3D, Android's hardware rendering crashes SurfaceFlinger in a loop and Android never finishes booting (seen in the test machine, @WaydroidApp#components#vm-scenario). On either, Android can only render in software, and is slow. A hybrid laptop has another render node beside NVIDIA's, which Waydroid takes, so it gets `hardware`. Treating every virtio GPU as unable is the quick answer: a virtual machine with virgl 3D could render in hardware but gets software too, which is slower but works, while telling the two apart reliably is left for later. The one test for this: install acts on it, and the Image Manager's Android tab warns by it (@ImageManagerApp#components#main-window#components#android-page), so what the tab says and what install does cannot disagree. The App Manager does not warn — it is where a user picks apps, not where they look after the system."
      - id: install
        description: "`borshevik-waydroid install`. Deletes what a previous install left that `waydroid init -f` keeps — Waydroid's overlays (/var/lib/waydroid/overlay, overlay_rw, overlay_work), where the translation layer was put, and waydroid.cfg, whose [properties] init carries over — then initialises Waydroid afresh (`waydroid init -f`) with the system type of config's approved system image (GAPPS), so running it again over a broken or hand-made install starts clean. The channels passed are control#channel, written from config just before, so init downloads the approved pair and nothing newer; Fedora's waydroid package ships with no default channel, and without one init refuses. init exits 0 even when it fails, so install then requires the system and vendor images to exist and stops otherwise, rather than carry on over an image that is not there. Writes config's `properties` into waydroid.cfg — with its `software_rendering` ones too when control#rendering says `software`, without which Android shows nothing there — and regenerates Android's properties from it (`waydroid upgrade -o`). Puts waydroid0 into firewalld's trusted zone, permanently: Android takes its address and DNS from the dnsmasq Waydroid runs on that bridge, and the default zone blocks DHCP and DNS, which leaves Android without network. Enables and starts waydroid-container.service, which the image disables (@Services#components#enable-services): Fedora's presets enable it, and it would otherwise run its daemon on every machine, Android or not. Through waydroid-script, for the Android version of the image just installed, installs the ARM translation chosen by the CPU's vendor in /proc/cpuinfo — read in one place, for both the choice and the line that reports it — with no question to the user — libhoudini, Intel's own, on GenuineIntel; libndk_translation, Google's from ChromeOS, on AuthenticAMD, where it is the one that works well, and on any other vendor — printing which it chose and why. Writes control#first-boot, control#theme, control#keylayouts, control#distrusted-cas, control#google-watch and control#crash-watchdog into the overlay. Enables and starts update#timer (`enable --now`) — updates are on by default, from the moment of install, not only after the next boot, which is when a timer that is only enabled would start. Puts launcher#android-entry and launcher#apps-entry into /usr/local/share/applications, so Android appears in the app grid only once it is there to open, and launcher#apk-entry and launcher#market-entry beside them, setting the associations that make them what opens an APK and a market:// link (launcher#associations). An install that fails at any step after taking control#busy, or is ended by a signal — the App Manager's window closed under it, a logout — undoes what it had done to the system before exiting, keeping its exit status, silently, so the error that ended it stays the last line printed — the App Manager reports a failed module by its last line — the same as remove's system part: entries and associations, update#timer and waydroid-container.service disabled and stopped, waydroid0 out of the trusted zone, /var/lib/waydroid and control#channel deleted — so a failed install leaves neither a container service starting at every boot nor a trusted bridge behind a machine that, without control#stamp, every app shows as having no Android and offers no Remove for; the user's own Android data is left, install having made none of it. Writes control#stamp last, then starts theme-sync in the user manager of the user who asked (PKEXEC_UID), if they have one running — their session began before the stamp existed, so its condition kept it from starting; a failure there fails nothing."
      - id: upgrade
        description: "`borshevik-waydroid upgrade`. Brings the installed images to config's approved pair with `waydroid upgrade`, which keeps Android's data and installed apps. First writes control#channel from config and points waydroid.cfg's system_ota and vendor_ota at it — an install made from another channel, ota.waydro.id's included, is moved onto it here — and, for each image whose recorded datetime differs from the approved entry's, resets that datetime to 0: `waydroid upgrade` only ever fetches a build newer than the installed one, and an approved build can be older, when a broken one is withdrawn. Writes config's `properties` into waydroid.cfg again, the `software_rendering` ones as control#rendering decides, so a default changed in a Borshevik update reaches machines installed before it; `waydroid upgrade` regenerates Android's properties from them. Puts launcher#android-entry, launcher#apps-entry, launcher#apk-entry and launcher#market-entry in place again, so a machine installed before an entry existed gets it with its next upgrade, and writes control#first-boot, control#theme, control#google-watch and control#crash-watchdog again for the same reason. Writes control#keylayouts again after it, from the image now installed and for the kernel now running, since either may have changed since the last time, and control#distrusted-cas from that image and the booted release's config. When the image's Android version then differs from control#stamp's, installs the translation layer again for the new version and rewrites the stamp — the old one would not load. Any change — the translation layer, the layouts or the distrusted roots — is followed by `waydroid upgrade -o`, which restarts a running Android once more: `waydroid upgrade` already restarted it, before the change, so without that a running Android would only see it at its next start. Does nothing, successfully, when control#stamp is absent."
      - id: remove
        description: "`borshevik-waydroid remove`. Its system part, which a failed install also runs: deletes control#stamp first, so a removal that stops half-way is never taken for an install. Removes launcher#android-entry, launcher#apps-entry, launcher#apk-entry and launcher#market-entry from /usr/local/share/applications and unsets launcher#associations, so an APK opens in the archive manager again and nothing takes market:// links. Disables update#timer and waydroid-container.service, stopping both, takes waydroid0 out of the trusted zone, and deletes /var/lib/waydroid — the images and everything installed into them — and control#channel. Then, for the user who asked (PKEXEC_UID), deletes their Android data, ~/.local/share/waydroid, and the app launchers Waydroid wrote for them, ~/.local/share/applications/waydroid.*.desktop; other users' homes are left alone. A theme-sync already running in someone's session keeps running until it ends, waiting for a Waydroid session that never comes; the next session does not start it, the stamp being gone."
      - id: google
        description: "`borshevik-waydroid google`, root, run under pkexec by the Image Manager. Where the asking user's Android (PKEXEC_UID) stands with Google, as two lines: `android_id=<decimal>`, the Google Services Framework ID that Google's registration page for uncertified devices (https://www.google.com/android/uncertified) asks for — the `android_id` row of the `main` table in ~/.local/share/waydroid/data/data/com.google.android.gsf/databases/gservices.db; and `google_account=yes|no`, whether Android holds a Google account — a row of type com.google in the `accounts` table of ~/.local/share/waydroid/data/system_ce/0/accounts_ce.db. Nothing says directly that a device is registered: Google answers no one but the account owner on its own page, and Play Store keeps calling the device uncertified after it, since registering lets it sign in without certifying it. A Google account in Android is the reliable sign — before registration Google refuses the sign-in. Both databases are read on the host through accounts: root because Android's app data belongs to Android's app UIDs, which no host user owns; on the host so Android need not be running or be woken. The ID exists only once Android has started at least once with network and checked in with Google; until then — no database or no row — prints why and exits 3, so the caller can tell 'start Android first' from a failure. The ID changes with every install, which is why registration is per install."
  - id: accounts
    type: "@Script"
    interpreter: python3
    src: build_files/root/usr/libexec/borshevik/borshevik-waydroid-accounts
    description: "Reads Android's Google state from Android's own databases on the host, for control#google, as root. Each database is read from a copy, with its -wal and -journal files but not -shm — the WAL's index, which SQLite rebuilds from the copied WAL when it is missing, while a copied one taken a moment apart from the WAL could hide its newest frames — so one Android is writing to is read whole, and Android need not be running; a copy taken in the middle of a write can come out torn, or a journal vanish while it is copied, so a copy that cannot be read is taken again, up to three times, before the tool says it cannot read the database and exits 1. `android-id <gservices.db>` prints the Google Services Framework ID (the `android_id` row of the `main` table), or exits 3 when there is no database or no row yet. `google-account <accounts_ce.db>` prints `yes` or `no`, whether the `accounts` table holds a row of type com.google, or exits 2 when the file cannot be read. A database Android has created but not yet put its table in counts as holding nothing: no ID yet, no account. control#google takes exit 2 for no account — as root the file is unreadable only while it does not exist yet — and any other failure as its own, never as a `no`. Python, which the image has, using its sqlite3."
  - id: config
    type: "@ConfigFile"
    src: build_files/root/usr/share/borshevik/waydroid/config.json
    description: "Everything Borshevik decides about Android that does not depend on the machine, in one file, so changing it is an edit to data, not to control. `images`: the system and vendor images this release approves, tested together, each an entry copied verbatim from Waydroid's official OTA channel — datetime, filename, id (the zip's SHA-256, which Waydroid checks the download against), romtype, size, url, version; the system entry's romtype (GAPPS) is the system type control passes to init. Why not the official channel: it always serves the newest build, and a new build can be broken — vendor 20260927 brought a display hotplug loop that crashed SurfaceFlinger, in full-UI mode too (waydroid/waydroid#2436), while 20260428 does not. System and vendor are approved separately, since Waydroid ships them as separate images and either can break alone; a new pair reaches users with a Borshevik update, and the next control#upgrade installs it (the approve-images recipe). `properties`: Android properties control writes into the [properties] section of /var/lib/waydroid/waydroid.cfg, from which Waydroid builds waydroid.prop — `waydroid.updater.disabled=true`, which turns off the updater app inside Android (org.lineageos.waydroidupdater): it compares the official channel with the images actually running and would offer its newest builds behind the approved pair's back, ignoring a metered connection that update#service respects; Waydroid sets the same property itself when a distribution ships the images. `persist.waydroid.multi_windows=true`: each Android app in a window of its own in the GNOME session. `persist.waydroid.uevent=true` and `persist.waydroid.udev=true`: Android hears the kernel's device events and is given the host's input devices, without which a game controller never reaches it — Android sees only the keyboard, pointer and touch Waydroid forwards over Wayland. Off in Waydroid by default to keep Android sandboxed from the host's devices; on here, as in Bazzite, because games are among what Android is for. A controller is then read by Android directly, so it reaches Android even while no Android window has focus, and needs the right key layout (control#keylayouts). A controller connected before Android starts may go unseen; one connected after is. A persist property set this way is a default — a value the user sets with `waydroid prop set` is kept in Android's data and wins. `android_settings`: Android settings by namespace (secure, system, global), applied once on Android's first boot by control#first-boot — `secure show_ime_with_hard_keyboard=0`, so a physical keyboard is used without the on-screen one popping up over every text field, the setting Waydroid's own documentation advises (Settings › System › Languages & input › Physical keyboard › Use on-screen keyboard); turning the keyboard itself off instead would lose the spell checker (waydroid/waydroid#789). `distrusted_certificates`: root certificates taken out of Android's trust store by control#distrusted-cas, each by its SHA-256 fingerprint with its name beside it for the reader — which roots, and why: decisions#distrust-emudhra. An entry can go once every approved image lacks its root. `software_rendering`: the properties control#rendering's `software` answer adds — `ro.hardware.gralloc=default`, `ro.hardware.egl=swiftshader`. Left at Waydroid's defaults on purpose, so absent here: the container freezing when Android sleeps (suspend_action, persist.waydroid.suspend), which saves battery at the cost of a sleeping Android not receiving messages; auto_adb, off."
    decisions:
      - id: distrust-emudhra
        description: "emSign ECC Root CA - G3 and Comodo's AAA Certificate Services are distrusted: the roots the eight compromised eMudhra intermediates chain to (https://emudhra.we-have-a-problem.com/, the same roots Fedora's ca-certificates dropped from the host's in 2026.2.92). Checked against the advisory's chains.zip, each of its twelve chains verifies against exactly one of the two in the approved image, and Android, unlike Fedora, trusts AAA Certificate Services for TLS too."
        date: 2026-10-21
  - id: waydroid-script
    type: "@Script"
    src: build_files/scripts/install-waydroid-script.sh
    description: Puts casualsnek/waydroid_script into the image, which is what control#install and control#upgrade install the ARM translation layer with — nothing else of what it offers is used. It downloads each layer's archive into $XDG_CACHE_HOME, or /home/$USER/.cache when that is unset — /home/root/.cache under pkexec and the update service, a home root does not have, where it kept archives no one needed once they were unpacked into the overlay (decisions#tmp-cache) — so control gives it a fresh directory in /tmp (mktemp -d) instead, which the next boot clears; nothing is deleted by hand. What earlier runs left in /home/root stays for its owner to delete.
    functions:
      - id: run
        description: Fetches waydroid_script at the commit pinned in the script into /usr/lib/borshevik/waydroid_script, with its Python requirements in a virtual environment beside it, so nothing is cloned or pip-installed on a user's machine and the version users run is the one that was tested. Pinned rather than following its main branch because it patches files into the Android image as root. The script holds no Android binaries itself; what it installs it downloads when run. Run at image build time from @ImageBuild#components#build-addons.
    decisions:
      - id: tmp-cache
        description: "Its downloads go to a fresh directory in /tmp: in /home/root/.cache it kept archives no one needed — two, 149 MB, on the author's machine."
        date: 2026-10-07
  - id: update
    type: "feature made of the components below"
    description: Keeps the installed Android images on the pair the booted Borshevik approves (config) without anyone asking, as rpm-ostreed-automatic does for the OS image. Off in the image and switched on by control#install, since there is nothing to update before Android is installed; the Image Manager's Android tab turns it off and on again.
    components:
      - id: service
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/system/borshevik-waydroid-update.service
        unit_type: service
        scope: system
        triggers: update#timer
        executes: /usr/libexec/borshevik/borshevik-waydroid upgrade
        description: "Oneshot service, conditioned on control#stamp existing, so a timer left enabled without Android does nothing. Two ExecCondition checks keep it from running when it should not, so a skipped run is a condition, not a failure. The first is the one rpm-ostreed-automatic.service carries, word for word: NetworkManager's Metered property must be 2 or 4 (no, guessed no), so a metered or unknown connection never downloads images of some 1.4 GB. The second skips while any user has a Waydroid session running, since upgrading restarts the container under them; the next firing tries again. Exit status 4, control refusing because another operation holds control#busy, counts as success (SuccessExitStatus), for the same reason."
      - id: timer
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/system/borshevik-waydroid-update.timer
        unit_type: timer
        scope: system
        triggers: daily with a randomised delay; Persistent, so a day missed while the machine was off is made up at the next boot
        executes: ''
        description: Fires update#service. Not enabled by the image (see control#install).
  - id: launcher
    type: "feature made of the components below"
    description: "Android's place in the app grid. The waydroid package brings entries of its own that show from the moment the image is installed, and its main one, opened before Waydroid is set up, offers Waydroid's own setup — which would install no translation layer, write no control#stamp and enable no updates. So that entry is hidden, and Borshevik's Android entry exists only while Android is installed: a desktop entry cannot be shown conditionally, so control#install copies it into /usr/local/share/applications (/var/usrlocal on rpm-ostree, writable and on the default XDG data path) and control#remove deletes it. With no entry before installing, nothing in the grid leads anywhere but the two apps that install Android. The same holds for APK files: what opens them is apk-installer only while Android is installed, and the archive manager otherwise, as Fedora sets it."
    components:
      - id: android-entry
        type: "@ConfigFile"
        src: build_files/root/usr/share/borshevik/waydroid/borshevik-android.desktop
        description: The Android entry — named Android, opening Android's full interface with `waydroid show-full-ui`, which starts a session when none runs, with a Stop Android action (`waydroid session stop`) taken over from the package's hidden entry. Kept in the image only as the file control#install copies. Its categories are System and Emulator, and the System folder excludes it by file name, so it shows in the Android folder alone (@ShellCustomizations#components#defaults).
      - id: apps-entry
        type: "@ConfigFile"
        src:
          - build_files/root/usr/share/borshevik/waydroid/borshevik-android-apps.desktop
          - build_files/root/usr/share/borshevik/waydroid/android-settings.png
        description: "Android Apps — Android's own list of its apps (`waydroid app intent android.settings.MANAGE_APPLICATIONS_SETTINGS`, with the empty URI the command requires), where an app is opened, stopped, updated or uninstalled; the way to uninstall an Android app without a menu of Borshevik's own, since Waydroid writes its apps' launchers itself and they offer only App Settings. Starts a session when none runs. The first time Settings opens after Android starts, Android 13's two-pane Settings on a wide screen gives it two windows, its home beside the list; later ones open one, and the two-pane mode is left on. Its icon is Android's own Settings icon, as Waydroid renders it for its launchers (LineageOS, Apache 2.0), kept in the image and named by its absolute path, as Waydroid names its launchers' icons, so no icon theme is involved; it is in the image for good, the entry only while Android is installed. Category Settings, so the System folder excludes it by file name and the Android folder names it (@ShellCustomizations#components#defaults)."
      - id: apk-entry
        type: "@ConfigFile"
        src:
          - build_files/root/usr/share/borshevik/waydroid/borshevik-apk-install.desktop
        description: "'Install in Android', the entry that opens an APK with apk-installer — hidden from the grid, offered in Open With. Kept in the image only as the file control#install copies into /usr/local/share/applications."
      - id: market-entry
        type: "@ConfigFile"
        src: build_files/root/usr/share/borshevik/waydroid/borshevik-android-market.desktop
        description: "What opens a market:// link — Google Play's own links to an app, `market://details?id=…`, which some sites use instead of play.google.com — while Android is installed: hands it to Android (`waydroid app intent android.intent.action.VIEW <link>`), where it opens in the Play Store. Hidden from the grid. Kept in the image only as the file control#install copies into /usr/local/share/applications and control#remove deletes; the package's own handler has no MimeType here (hidden-package-entries), so without Android nothing takes market:// links, and with it this entry takes them through its line in launcher#associations."
      - id: associations
        type: "lines `application/vnd.android.package-archive=borshevik-apk-install.desktop` and `x-scheme-handler/market=borshevik-android-market.desktop` under [Default Applications] in /usr/local/share/applications/mimeapps.list"
        description: "What makes apk-entry the default for APKs and market-entry the default for market:// links while Android is installed. /usr/local/share/applications comes before /usr/share on the XDG data path, so its mimeapps.list wins over the one in /usr/share/applications that gives APKs to the archive manager; and GNOME's GIO takes an entry as a type's default only through a directory's mimeinfo.cache or a mimeapps.list — /usr/local/share/applications has no cache, and an entry there with the right MimeType and no line is no one's default (decisions#lines-not-file) — so market-entry needs its line as well. control sets and unsets only these lines — its own also when written with the `;` that may end a list of entries — and leaves everything else in the file as it found it — an administrator's own system-wide defaults included, and a default of their own for either type under [Default Applications], which set then leaves in place — an APK line under [Added Associations] or [Removed Associations] only offers or hides an application and changes nothing here — so APKs or market:// links keep opening the way the administrator chose; the file is created when missing, deleted when unsetting the lines leaves nothing in it but its section header, a [Default Applications] section left empty by unsetting is taken out with its header, rewritten only when its content changes and then through a new file put in its place, so an interrupted write never leaves it half written, and read and written byte for byte whatever its encoding, the lines it adds ending the way the file's lines end (CRLF included) and the file ending with or without a newline as it did, so setting and then unsetting the lines gives back the file as it was. Failing to change it is reported and stops nothing: install and remove carry on, since a file someone else may have broken must not leave Android half installed or half removed."
        decisions:
          - id: lines-not-file
            description: "control sets and unsets its own lines in the mimeapps.list, and gives market-entry a line too: tried, an entry in /usr/local/share/applications with the right MimeType and no line is no one's default."
            rejected:
              - copying a whole mimeapps.list there and deleting it on remove, as control did until 2026-10-07 — it would take anyone else's defaults with it
            date: 2026-10-07
      - id: hidden-package-entries
        type: "@ConfigFile"
        src:
          - build_files/root/usr/share/applications/Waydroid.desktop
          - build_files/root/usr/share/applications/waydroid.app.install.desktop
          - build_files/root/usr/share/applications/waydroid.market.desktop
        description: "The package's entries, replaced under the same names. Its one visible entry, Waydroid.desktop, gets NoDisplay, keeping it out of the grid. Its market protocol handler, NoDisplay in the package already, loses its MimeType: it claimed every market:// link on every machine, Android or not, and without Android a click on one ran a `waydroid app intent` that failed and showed nothing; market-entry takes them while Android is installed. Its APK installer, 'Install in Waydroid', loses its MimeType, so Open With offers no installer before Android is installed and only apk-installer after: the package's runs `waydroid app install` at once, with no question, and does nothing at all when no session runs or Android is still starting. Copied over the package's files by the final layer's COPY, which runs after the base layer installed them."
  - id: apk-installer
    type: "@View"
    src:
      - build_files/root/usr/share/borshevik/waydroid/apk-installer/main.js
      - build_files/root/usr/share/borshevik/waydroid/apk-installer/install.js
      - build_files/root/usr/bin/borshevik-apk-install
    description: "What opens an APK once Android is installed (launcher#apk-entry): a small window of its own, one per file (GApplication NON_UNIQUE), that asks before anything happens. It reads the APK first and asks 'Install <package> in Android?' — or 'Update', when Android already has that package — with the file's name, size and version, Cancel and Install. Once confirmed it shows what it is doing — starting Android, waiting for it, installing — and then the outcome: installed, with the app's own icon — the one Waydroid writes for its launcher — and Open, which launches the app (`waydroid app launch`) and closes the window; or what went wrong. A session it started stays running, since the next thing a user does is open the app. Run as the user, without privileges, like the rest of Android's apps; refuses, saying so, when control#stamp is absent — a file opened from elsewhere — or the file is not an APK. Strings in en, ru, uk, ka, hy and be, held in main.js."
    functions:
      - id: readApk
        description: "The package name and version an APK declares, read from its AndroidManifest.xml — Android's binary XML, inside the zip — by a short Python program, Python being in the image and nothing that reads APKs being there. Throws when the file is not a zip or holds no manifest with a package, which is how a file that is not an APK is told apart."
      - id: installApk
        description: "Installs an APK into Android, reporting each stage to a callback. Starts a session when none runs and waits for it to report itself running, then — whether it started one or found one — for Android to finish booting (`sys.boot_completed` reading 1, up to three minutes): a session reports itself running while Android is still starting, and `waydroid app install` then does nothing and says nothing. Wakes Android when it sleeps — its container frozen — through the container service's Unfreeze, which any user may call: `waydroid app install` wakes a frozen Android only for its own call and freezes it again at once, while Android installs the package after the call returns, so on a sleeping Android the install never finished (decisions#unfreeze). Then `waydroid app install`, which returns at once and does not fail when Android refuses a package, so for a package Android did not have it waits up to three minutes for it to appear in `waydroid app list`, waking Android again should it fall asleep meanwhile, and fails, with that reason, when it does not — a wrong architecture or a signature clash. Three, because Google Play Protect may stop an app built for an old Android and ask in Android's own window whether to go on, and the user needs the time to answer; the waiting stage says Android may ask. For a new package the command's own result is not trusted either way: Android may take a package the command reported failing, so it waits for the list all the same, and fails with what the command said. An update cannot be seen in that list, so it counts as done when the command succeeded and fails at once, with what it said, when it did not. Android refusing an update — an older version, another signature — is not seen, since the command does not fail for it."
        decisions:
          - id: unfreeze
            description: "Android is woken through Unfreeze before installing: on a sleeping Android the install never finished, seen once."
            date: 2026-10-04
  - id: theme-sync
    type: "@Script"
    src:
      - build_files/root/usr/libexec/borshevik/borshevik-android-theme
      - build_files/root/usr/lib/systemd/user/borshevik-android-theme.service
    description: "Keeps Android's colours those of GNOME: its accent colour (org.gnome.desktop.interface accent-color) as Android's Material You colour, and its style (color-scheme, prefer-dark or not) as Android's dark theme. A small GJS program, run as a user service in every GNOME session of a machine where Android is installed (the unit's condition is control#stamp), and also started by control#install for the user who installed it, whose session began before the stamp existed. It follows both settings and Waydroid's session — the session bus name id.waydro.Session, which `waydroid session start` owns — and whenever either changes while a session is there, hands Android `<rrggbb> <dark|light>` as persist.borshevik.theme with `waydroid prop set`, which any user may run and which waits by itself for Android to finish starting; control#theme applies it inside Android. Everything is by signal: nothing runs while neither changes. A newer value replaces a hand-over still waiting, so only the latest reaches Android. The colours are libadwaita's accent colours as GNOME shows them, kept in the program. Android's colours follow GNOME's and are not merged with a choice made inside Android: one made there lasts until the next change in GNOME or Android's next start. Needs no password: neither the property nor the init service asks the host for anything."
  - id: vm-scenario
    type: "@Script"
    src:
      - tests/scenarios/android/guest.sh
      - tests/scenarios/android/paths
    description: "The android scenario of @BorshevikWorkflow#components#scenarios: everything about Android a machine with no one at it can show, run in the test machine whenever a change touches a file in its `paths` — this term's files, and the files of the two apps' Android parts. It exercises control as both apps call it, the App Manager's way (@AppManagerApp#components#modules) and the Image Manager's (control directly), through a whole install, remove, install cycle — with an install cut short before it — and runs the apps' own Android modules rather than copies of their logic. What it cannot show is how Android looks and responds on real graphics, and the apps' windows are not clicked through. The machine's GPU is virtio without 3D, on which Android's hardware rendering — what control#rendering picks for it, the GPU not being NVIDIA's — crashes SurfaceFlinger in a loop, so Android never finishes booting (decisions#software-in-the-vm). That is why control#rendering counts a virtio GPU as unable to render: install itself switches Android to software rendering in this machine, as it would for a user running Borshevik in a virtual machine, so the scenario exercises the software path as it ships, and checks that install set it."
    functions:
      - id: run
        description: "In order, each a check of its own, opening with the scenarios of behaviour it acts out: (1) behaviour#nothing-until-installed#fresh-machine — a machine without Android — no control#stamp, update#timer and waydroid-container.service disabled and inactive, no Android entry in /usr/local/share/applications, the package's Waydroid entry hidden, nothing taking market:// links, waydroid-script's venv importing its requirements, control#rendering answering — after which the scenario puts a default of someone else's into /usr/local/share/applications/mimeapps.list, which every later step must leave there; (2) behaviour#installs-from-either-app#unknown-module — @AppManagerApp#components#modules#functions#run refusing an unknown module with nothing done; (3) behaviour#interrupted-install#cut-short — control#install cut short — SIGTERM sent to its whole process group, as a logout or a shutdown sends it, five seconds after `waydroid init` started downloading — exiting 143, the signal's status, with everything (10) checks remove's system part takes away already gone, the other default in mimeapps.list kept, and control#busy holding the record of an ended install, so the install that follows runs; (4) behaviour#installs-from-either-app#from-app-manager — `borshevik-modules prepare android`, as the App Manager runs it after the password, printing `::module android` and `::result android ok` and exiting 0; (5) behaviour#installs-from-either-app#installed, behaviour#others-defaults-kept#foreign-default — what install leaves — the stamp holding 11 or 13, the container service enabled and active, the timer enabled and active, waydroid0 in the trusted zone, the Android entry and launcher#apps-entry in place, launcher#apk-entry beside it and launcher#associations set, with apk-installer what tester's session opens an APK with and the other default in mimeapps.list kept, market-entry what it opens market:// links with, the translation layer the CPU's vendor calls for registered as Android's native bridge, nothing of microG in the overlay, waydroid.cfg's channels pointing at control#channel with both recorded datetimes equal to config's approved entries', config's `properties` in waydroid.cfg's [properties] — and, since control#rendering answers `software` on the machine's virtio GPU, its `software_rendering` ones too — control#first-boot, control#google-watch and control#crash-watchdog in the overlay, control#keylayouts holding the DualSense's layout with no `requires_kernel_config` line, the test machine's Fedora kernel building hid-playstation, control#distrusted-cas holding one whiteout for each root config distrusts, and control#busy holding the record of an ended operation rather than one running; (6) behaviour#images-follow-release#nothing-after-install, behaviour#google-registration#not-signed-in-yet — the Image Manager's waydroid.js under gjs — isInstalled, readImage and checkForUpdate answering without error, checkForUpdate finding nothing to update right after install, and signedInLocally answering false before Android has ever started, with accounts answering for no database as it is meant to — 3 from `android-id`, 2 from `google-account`; (7) behaviour#apk-opens-in-android#install-apk, behaviour#apk-opens-in-android#not-an-apk — apk-installer's install.js under gjs as tester, with an APK the scenario downloads itself — F-Droid's client at a pinned version, checked against its SHA-256: readApk naming its package, installApk installing it, which starts the session itself, and the package then in `waydroid app list`, and refusing a file that is not an APK; the session stopped afterwards; (8) behaviour#updates-stay-out-of-the-way#session-running, behaviour#updates-stay-out-of-the-way#metered, behaviour#installs-from-either-app#first-start, behaviour#theme-follows-gnome#on-start, behaviour#theme-follows-gnome#while-running, behaviour#google-registration#id-shown, behaviour#google-registration#watching, behaviour#crash-restarts-whole#surfaceflinger-abort — update#service skipped by its exec-condition while tester has a session running — and, in that session once Android has booted — the session restarted once, and the report saying so, when Android has not booted within three minutes: Waydroid's hwcomposer sometimes aborts at start ('Binder threadpool cannot be shrunk after starting', waydroid/waydroid#2085, in every recent vendor image) and, on the test machine, came back without registering, leaving SurfaceFlinger waiting for good (decisions#one-retry); a second failure is a FAIL — config's `properties` among Android's running properties, its `android_settings` applied by control#first-boot, no file a whiteout of control#distrusted-cas names left in the trust store Android itself sees, theme-sync — started by hand, tester's session having begun before Android was installed — making Android blue and dark for GNOME's blue and prefer-dark, then teal and light when the two change while Android runs (the Material You setting and `cmd uimode night`, read inside Android; tester's own two values put back after), Google Play Services and the Play Store among Android's packages, the GAPPS image's, and control#google printing a decimal ID and `google_account=no` or, Android not having checked in with Google within two minutes, exiting 3, and control#google-watch running inside Android with no flag written, the test machine having no Google account, and last control#crash-watchdog at work: SurfaceFlinger aborted (SIGABRT, as in Waydroid's crashes) and, within three minutes, the container started afresh rather than half-restarted — a new lxc-start, the session still running — Android booted again with its network back (the gateway answering a ping from inside), and one entry in /data/borshevik/crash-restarts — and run or skipped by the metered condition, as the machine's connection decides, once none runs; (9) behaviour#one-operation-at-a-time#upgrade-while-busy, behaviour#images-follow-release#approved-in-place, behaviour#images-follow-release#from-another-build — control#upgrade exiting 4, having changed nothing, while the scenario itself holds control#busy's lock; then exiting 0 with the stamp still valid — run once as it is, and once after the vendor datetime in waydroid.cfg is set to a build other than the approved one, as on a machine installed from another channel, after which it is the approved one again; (10) behaviour#remove-leaves-nothing#remove-from-image-manager — control#remove, as the Image Manager runs it for tester (PKEXEC_UID), leaving no stamp, no /var/lib/waydroid, no control#channel, no Android entry, no launcher#apps-entry, no launcher#apk-entry and launcher#associations unset, with the other default still in mimeapps.list and APKs back with the archive manager, nothing taking market:// links, the timer and container disabled, waydroid0 out of the trusted zone, and no ~/.local/share/waydroid for tester; (11) behaviour#installs-from-either-app#from-image-manager — control#install run directly, as the Image Manager runs it, bringing everything in (5) back; (12) no failed system unit after all of it. Finally opens Android's full interface for tester, so the screenshot taken after the scenario shows what the virtual GPU made of it, which it can because @BorshevikWorkflow#components#test-image-in-vm keeps tester's screen on."
        decisions:
          - id: one-retry
            description: "The session is restarted once when Android has not booted within three minutes: seen with three sessions started within a minute."
            upstream: waydroid/waydroid#2085 — hwcomposer sometimes aborts at start, 'Binder threadpool cannot be shrunk after starting', in every recent vendor image
            date: 2026-10-02
    decisions:
      - id: software-in-the-vm
        description: "Found in the test machine: surfaceflinger `restarting`, system_server restarting every 30 seconds; switched to software rendering, Android booted in 12 seconds."
        date: 2026-10-02
tests:
  - id: static-checks
    description: The scripts parse and the units and desktop entries are well-formed — what @BorshevikWorkflow#components#validate checks for the whole repository.
    command: bash tests/validate.sh
    expect: exits 0 and prints 'all checks pass'
  - id: in-vm
    description: vm-scenario, run in the test machine on an image that carries the change — selected by itself whenever the change touches its paths. It acts out the scenarios of behaviour vm-scenario#run names at each step.
    command: tests/test-image-in-vm.sh run --scenarios android
    expect: the report's `== scenario android` section ends with 'all checks pass'
  - id: tried-by-the-author
    description: "Manual, on the author's own machine running an image that carries the change, for what in-vm cannot show: the Android tab clicked through — Install, the password prompt, the registration ID shown and the device registered with Google through it, Remove — Android drawing on real graphics, signing in to Google Play, an ARM-only app from Play opening, a push notification arriving while Android is awake, and a game controller connected after Android started working in a game that supports one. These are the scenarios of behaviour that only a real machine shows: behaviour#installs-from-either-app#from-image-manager clicked through, behaviour#installs-from-either-app#real-graphics, behaviour#google-registration#registered, behaviour#apps-from-play#arm-only-app, behaviour#apps-from-play#push-arrives and behaviour#game-controllers#controller-after-start."
    command: the author on their own machine (the `testing` step)
    expect: the author confirms Android installs, Play accepts the registered device, an ARM app runs, push arrives, a controller works in a game, and Android upgrades and removes cleanly; no failed units on a machine where Android is not installed
goals:
  - Let a user who wants Android apps get them from a window, with the ARM translation and Google service replacement most apps need already in place
  - Cost nothing to anyone who does not — no download, no running service, no failed unit
  - Keep the Android image updated without the user thinking about it, and never over a metered connection
recipes:
  - id: approve-images
    description: Moves config's approved images to another system or vendor build — a newer one, or an older one when the approved build turns out broken.
    instructions:
      - Fetch Waydroid's official channel for the image in question — https://ota.waydro.id/system/lineage/waydroid_x86_64/GAPPS.json or https://ota.waydro.id/vendor/waydroid_x86_64/MAINLINE.json — and pick the build; check Waydroid's open issues for reports against it first
      - Replace that image's entry under config's `images` with the build's entry, copied verbatim, so its `id` stays the checksum Waydroid verifies the download against
      - "Carry it through @BorshevikWorkflow like any change: the files are in the android scenario's paths, so @WaydroidApp#tests#in-vm runs by itself, and the author tries it on their own machine (@WaydroidApp#tests#tried-by-the-author), where the next control#upgrade moves Android onto the new pair"
decisions:
  - id: gapps
    description: "GAPPS rather than microG on a VANILLA image: Waydroid builds and ships GAPPS itself and its Google services keep themselves current, while microG reaches Waydroid only through third-party scripts and, with no signature spoofing in Waydroid's images, apps refuse it."
    rejected:
      - "microG on a VANILLA image — tried: push never registered, WhatsApp rejected the Play Store's signature"
    date: 2026-10-02
behaviour:
  - id: nothing-until-installed
    description: "Until a user installs Android it costs nothing and shows nothing: no download, no service or timer running, no failed unit, no Android in the app grid — the waydroid package's own entry, which would offer Waydroid's own setup, hidden (launcher) — and nothing of Android opening files or links: an APK opens in the archive manager, as Fedora sets it, and a market:// link in nothing. Only the waydroid RPM is in the image, so someone who never wants Android pays for it with nothing else."
    scenarios:
      - id: fresh-machine
        given: an image whose Android was never installed
        when: the user looks at the app grid, the running services, and what opens an APK or a market:// link
        then: no Android entry and no Waydroid entry in the grid, Android's container and its update timer neither enabled nor running, an APK opening in the archive manager, and nothing taking market:// links
  - id: installs-from-either-app
    description: "Android is installed one way, by control#install, whether from the Image Manager's Android tab or from the App Manager's modules, and once installed everything that makes it usable is in place: Android in the app grid, Google Play, the ARM translation layer the CPU calls for, APKs and Play links opening in it, its updates switched on, a game controller's key layout, Borshevik's settings and trust store applied at its first start, and software rendering on a GPU it cannot render on (control#rendering)."
    scenarios:
      - id: from-app-manager
        given: no Android, the App Manager open
        when: Android applications support is checked and the password entered
        then: the App Manager reports the Android module installed, and Android is installed as `installed` says
      - id: from-image-manager
        given: no Android — or Android removed again — and the Image Manager on its Android tab
        when: Install is clicked and the password entered
        then: the tab shows the install's progress and then the registration ID, and everything `installed` names is in place
      - id: unknown-module
        given: the App Manager's privileged entry point (@AppManagerApp#components#modules)
        when: it is asked to install a module it does not know
        then: it refuses, and nothing is done
      - id: installed
        given: Android just installed
        when: the user looks at the machine
        then: Android and its apps in the app grid; APKs opening with apk-installer and market:// links with Android's Play Store; Android's container and its update timer enabled and running; Google Play Services and the Play Store in Android, and no microG; the ARM translation layer for the CPU's vendor in place; a DualSense's key layout; software rendering on a GPU Android cannot render on
      - id: first-start
        given: Android installed
        when: it starts for the first time and has booted
        then: Borshevik's Android properties are in effect, its Android settings applied, and the roots config distrusts are absent from the trust store Android uses
      - id: real-graphics
        given: a machine with a GPU Android renders on
        when: Android is opened
        then: it draws on the real GPU and responds as an app should
  - id: interrupted-install
    description: "An install cut short — by a logout or a shutdown, which send SIGTERM to its whole process group — leaves nothing half installed and does not stop the next one: Android is installed whole or not at all, which control#stamp tells apart."
    scenarios:
      - id: cut-short
        given: an install downloading Android's images
        when: its process group is sent SIGTERM
        then: it exits with the signal's status, 143, nothing it had put in place is left, and the next install runs
  - id: others-defaults-kept
    description: "Installing and removing Android change only Android's own lines among the system's defaults for opening files: a default someone else set — an administrator's own — stays as it was, so APKs and market:// links keep opening the way they chose (launcher#associations)."
    scenarios:
      - id: foreign-default
        given: a default of someone else's in /usr/local/share/applications/mimeapps.list
        when: Android is installed, has an install cut short, is removed and is installed again
        then: that default is still there after every one of them
  - id: remove-leaves-nothing
    description: Removing Android takes all of it away — its images and data, its entries and file associations, its services, its place in the firewall, and the user's own Waydroid data — so the machine is again as nothing-until-installed describes.
    scenarios:
      - id: remove-from-image-manager
        given: Android installed
        when: Remove is clicked on the Image Manager's Android tab
        then: no Android in the app grid, APKs back with the archive manager, nothing taking market:// links, Android's container and timer disabled, its network out of the trusted zone, and nothing of it left in /var/lib/waydroid or the user's home
  - id: one-operation-at-a-time
    description: "Install, upgrade and remove never run at once (control#busy): one asked for while another runs refuses with exit 4 and changes nothing, so the two apps and the update service cannot together leave Android in a state none of them meant."
    scenarios:
      - id: upgrade-while-busy
        given: an operation on Android running
        when: an upgrade is asked for
        then: it exits 4 and changes nothing
  - id: images-follow-release
    description: "The Android images a machine runs are the pair its booted Borshevik release approves (config): right after an install there is nothing to update, an upgrade with the approved pair in place changes nothing and leaves Android working, and one on another build brings the approved pair back."
    scenarios:
      - id: nothing-after-install
        given: Android just installed
        when: the Image Manager checks for an Android update
        then: it finds none
      - id: approved-in-place
        given: Android on the approved pair
        when: an upgrade runs
        then: it succeeds and Android is still installed and working
      - id: from-another-build
        given: Android on a vendor build other than the approved one, as on a machine installed from another channel
        when: an upgrade runs
        then: the approved build is installed
  - id: updates-stay-out-of-the-way
    description: Android's images update by themselves (update), but never while someone's Android session is running and never over a metered connection, so keeping Android current neither interrupts its user nor costs them data.
    scenarios:
      - id: session-running
        given: a user's Android session running
        when: the update service is due
        then: it is skipped by its condition
      - id: metered
        given: no Android session running
        when: the update service is due
        then: it runs on an unmetered connection and is skipped on a metered one
  - id: apk-opens-in-android
    description: Once Android is installed, opening an APK installs it into Android after asking, starting Android when it is not running (apk-installer); a file that is not an APK is refused.
    scenarios:
      - id: install-apk
        given: Android installed, an APK downloaded
        when: it is opened and the install confirmed
        then: the window names its package, Android is started if needed, and the app is installed in Android
      - id: not-an-apk
        given: Android installed
        when: a file that is not an APK is opened with apk-installer
        then: it is refused, saying so
  - id: theme-follows-gnome
    description: Android's accent colour and its dark or light style follow GNOME's, also when they change while Android runs (theme-sync, control#theme).
    scenarios:
      - id: on-start
        given: GNOME's accent blue and its style dark
        when: Android runs with the theme sync started
        then: Android's Material You colour is blue and its style dark
      - id: while-running
        given: Android running, following GNOME
        when: GNOME's accent becomes teal and its style light
        then: Android turns teal and light
  - id: google-registration
    description: Google lets an Android build it has not certified into Play only once the user registers its Google Services Framework ID under their own account, so the Image Manager shows that ID and notices when the user has signed in (control#google, control#google-watch).
    scenarios:
      - id: not-signed-in-yet
        given: Android installed and never started
        when: the Image Manager asks whether the user is signed in
        then: it is told no, without an error
      - id: id-shown
        given: Android booted, no Google account on it
        when: the ID is asked for
        then: a decimal ID and no account — or, before Android has checked in with Google, no ID yet
      - id: watching
        given: Android running with no Google account
        when: the user has not signed in
        then: the watch runs and records no sign-in
      - id: registered
        given: the registration ID shown
        when: the user registers the device with Google through it and signs in to Google Play
        then: Google Play works
  - id: apps-from-play
    description: Android apps come from Google Play and work as on a phone — ARM-only ones through the translation layer, and with Google's push messages (see the description on GAPPS).
    scenarios:
      - id: arm-only-app
        given: Android signed in to Google Play
        when: an app Google Play offers for ARM only is installed and opened
        then: it opens and works
      - id: push-arrives
        given: an app that receives push messages, Android awake
        when: a message is sent to it
        then: its notification arrives
  - id: crash-restarts-whole
    description: When Android's system crashes, the container is restarted whole rather than left in Android's own half-restart, which in Waydroid comes back with nothing drawn, no input and no network (control#crash-watchdog).
    scenarios:
      - id: surfaceflinger-abort
        given: Android running
        when: SurfaceFlinger aborts
        then: within three minutes the container is started afresh with the session still running, Android boots again with its network back, and the restart is recorded once
  - id: game-controllers
    description: A game controller reaches Android with the right key layout, read by Android directly, so it works in games even while no Android window has focus (config's `properties`, control#keylayouts); one connected before Android starts may go unseen.
    scenarios:
      - id: controller-after-start
        given: Android running a game that supports a controller
        when: a controller is connected
        then: it works in the game
