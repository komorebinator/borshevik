description: System-wide GNOME defaults set at image build time, so every account — and the login screen — starts from Borshevik's setup with nothing to configure. They are defaults only; a user's own changes take precedence.
extends: "@Software"
platform: bash + dconf + GSettings
src: build_files/scripts/
components:
  - id: apply-schemas
    type: "@Script"
    description: Installs GSettings schema overrides and recompiles the schema cache.
    src: build_files/scripts/apply-schemas.sh
    functions:
      - id: run
        description: Installs the GSettings overrides among the defaults and recompiles the schema cache.
  - id: apply-dconf
    type: "@Script"
    description: Installs dconf profiles and system defaults, then runs dconf update.
    src: build_files/scripts/apply-dconf.sh
    functions:
      - id: run
        description: Installs the login screen's dconf profile and gdm-dconf, and the dconf files among the defaults, then runs `dconf update`. It also writes the default list of enabled extensions from whatever @GnomeExtensions installed moments earlier, leaving out those named in /usr/share/borshevik/extensions-off-by-default — what switches extensions on for a fresh account; @Services#components#extension-autoenable covers accounts that already have a list of their own.
  - id: gdm-dconf
    type: "@ConfigFile"
    format: dconf
    src: build_files/scripts/dconf/gdm.d/gdm
    description: "The login screen: Borshevik's logo, and the same accent colour and touchpad behaviour as user sessions."
  - id: gnome-initial-setup
    type: "@ConfigFile"
    src: build_files/root/etc/gnome-initial-setup/vendor.conf
    description: "GNOME Initial Setup vendor config: `skip=software` drops the 'Software' welcome page, so new users are not prompted to install apps via GNOME Software on first login (the App Manager replaces this flow), and `existing_user_only=language;keyboard` shows the language and keyboard pages only in the per-user run, not in the system-level one. On an install from Borshevik's media the system-level run is the one that creates the first account (@IsoInstaller#components#keyboard), so it asks for neither: both come from the language chosen in the installer, and the password is typed in the system's first layout, the one the login screen reads."
  - id: defaults
    type: "@ConfigFile"
    src:
      - build_files/scripts/schemas/
      - build_files/scripts/dconf/local.d/
    description: "What a fresh account starts with: a dark style, extended to GTK3 apps through the adw-gtk3 theme; pink accent; hot corners off; minimize and maximize buttons; focus following the mouse (focus-mode `sloppy`: the window under the pointer takes the focus and keeps it while the pointer is over the desktop), the author's own setting and the one Borshevik's Workspace Manager extension (@GnomeExtensions) is tried under, since which window GNOME focuses after a workspace switch depends on it; tap-to-click on the touchpad; a preset dock; app folders, the author's own arrangement — downloaders in Downloads, system monitors in System, settings in Settings, video and audio players together in Players — rather than the freedesktop categories (decisions#own-folders). So each folder names its apps by launcher file name — those of the App Manager and the image, and others the author keeps with them, ready for when a user installs them — no app is in two, and only folders that hold something after the App Manager's default selection (the categories applications.json marks default, @AppManagerApp) are there — a folder that would sit empty, or hold only an app pinned to the dock, which GNOME leaves out of the grid, is left out rather than kept for apps a user may add, so browsers, games, video and image editors, AI tools stay loose. An app no folder names stays loose in the grid, as on the author's machine, and so does a few the author wants at hand rather than a folder away: the messengers, the VPN client (@HiddifyApp), Remmina and the terminal. Two folders are exceptions, there for what a user adds: Studio, holding exactly what the App Manager's Studio category installs, so that choice arrives as one folder; and Android's, for when Android is installed. The Studio folder's list is the one to change with that category in applications.json. The folders' names are translated by desktop-directory files of their own (folder-names); the Borshevik folder holds the two Borshevik apps, and the Android one @WaydroidApp#components#launcher#components#android-entry and #apps-entry by file name and every Android app's launcher by the category Waydroid gives each one it writes (X-WayDroid-App), the one folder gathering by category, so apps installed in Android later land there too; and workspace-first shortcuts — Super+number switches to that workspace and Shift+Super+number moves the window there (GNOME's Super+number app shortcuts are cleared to free the keys), and Super+Space switches keyboard layout. Split between GSettings overrides (apply-schemas) and dconf defaults (apply-dconf) as it happens to be; either works for a default. The folder list (folder-children) is a single key, so the image's reaches only accounts without one of their own: arranging icons into folders by hand writes the account's own list, which then hides every folder the image adds later — as it hid the Android folder on the author's machine — and GNOME Shell writes its own list (Utilities, YaST, Pardus) at a login that finds the key empty, as it did for accounts made before the image set any folders. Nothing merges the image's folders into such a list; whether it should is the author's call, not yet made."
    components:
      - id: vm-scenario
        type: "@Script"
        src:
          - tests/scenarios/app-folders/guest.sh
          - tests/scenarios/app-folders/paths
        description: "The app-folders scenario of @BorshevikWorkflow#components#scenarios: whether the image's folders reach an account that has never had folders of its own — tester, whose first login the run is — the only kind of account they can reach (defaults). Run whenever a change touches the folders, their names (folder-names) or how dconf defaults are installed."
        functions:
          - id: run
            description: "After the login and the checks: tester's folder-children is the image's, not replaced by GNOME Shell's own list at that first login; every folder it names has a definition; and for each, how many of the launchers installed in the VM fall into it, by file name or category, which says which folders GNOME shows there — it leaves an empty one out of the grid, and a fresh VM has no Flatpaks; that no launcher is in two folders at once, which is what the folders' lists by file name are for; and, as information, which launchers are left loose. Then it opens the app grid — Escape first, since at a first login GNOME Shell's welcome dialog sits over the overview and takes the keys, then Super+A — pressed on a virtual keyboard made through uinput, since GNOME Shell takes no such request over D-Bus from an ordinary client, so the scenario's screenshot shows the folders as tester sees them."
    decisions:
      - id: own-folders
        description: App folders are the author's own arrangement.
        rejected:
          - the freedesktop categories — tried, they put messengers, torrent clients and LocalSend together under Network, swelled System Tools and Utilities, and put an app with several categories in several folders at once
        by: author
        date: 2026-10-05
  - id: wallpaper
    type: "@ConfigFile"
    src:
      - build_files/root/usr/share/backgrounds/borshevik/
      - build_files/root/usr/share/gnome-background-properties/borshevik.xml
      - build_files/scripts/schemas/90-wallpaper.gschema.override
    description: "Borshevik's own wallpaper, the author's, as the default of every account that has not chosen one: one picture for the light and the dark style alike, being dark itself, and for the lock screen. It is added to the wallpapers the image already has, not put in their place: Fedora's and GNOME's stay installed, and its gnome-background-properties entry lists it beside them in Settings' Appearance page. Fedora sets its release's wallpaper by GSettings overrides of its own, named 10_…; Borshevik's 90-wallpaper sorts after them and so wins. On an update, an account that never chose a wallpaper gets Borshevik's; one that did keeps its own."
    decisions:
      - id: own-wallpaper
        description: Borshevik ships a wallpaper of its own as the default instead of Fedora's, which changes with every release and so changed Borshevik's look with it; Fedora 45's is not one the author wants Borshevik to have. Fedora's wallpapers stay available to choose.
        by: author
        date: 2026-11-26
        rejected:
          - Fedora's release wallpaper as the default — it changes every six months, and 45's does not suit Borshevik
          - replacing Fedora's wallpapers — the author wants them kept to choose from
  - id: folder-names
    type: "@ConfigFile"
    src: build_files/root/usr/share/desktop-directories/
    description: The app folders' names (defaults), one desktop-directory file per folder, in the six languages of @AppManagerApp. GNOME Shell translates a folder's name only through such a file — a folder with translate=true names the file, which it looks up under desktop-directories in the system data directories — and the stock ones carry GNOME's names, not the author's.
tests:
  - id: app-folders-in-vm
    description: "defaults#vm-scenario: the image's app folders for an account that has none of its own, selected by itself whenever a change touches its paths."
    command: tests/test-image-in-vm.sh run --scenarios app-folders
    expect: the checks pass, the report's `== scenario app-folders` section ends with 'all checks pass', and screen-app-folders.png shows the app grid with the folders that have apps in the VM
goals:
  - Make the desktop look and behave the intended way on first login, with no per-user setup step
  - Apply appearance and behaviour system-wide at image build time, so the settings survive a rebase and apply to every account including GDM
