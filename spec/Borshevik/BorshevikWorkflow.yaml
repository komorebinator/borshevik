description: "How work is done on Borshevik, from a request to an image users rebase onto. A change is tried on `experimental` first — pushed there, built into `:latest` by hand, run on a real machine — and goes to `main` by pull request only once it works. `main` is what the daily build reads; what it produces is still under test, and reaches users only when a chosen build is promoted to `:stable`, which is also what installers switch to and ISOs are cut from. Nothing is triggered by a push or a merge: builds run on a schedule or by hand."
extends: "@DuckWorkflow"
main_branch: main
versioning:
  type: "@CalVer"
  format: DD.MM.YYYY
src: .github/
branches:
  - id: main
    description: "What ships. The default branch on GitHub, so the scheduled build checks it out and promote-image-to-stable runs from it. Changes arrive by pull request — from experimental once tested, from short-lived feature branches, and from dependabot."
  - id: experimental
    description: Where a change is tried on real hardware before it goes to main. Built into `:latest` by hand when there is something to test, never by the schedule.
  - id: stable
    description: "Abandoned. Untouched since 2025-09 and hundreds of commits behind, read by no workflow, and unrelated to the `:stable` image tag despite the name — pushing to it ships nothing."
channels:
  - id: latest
    from: main, experimental
    description: "The testing channel. Every build lands here, from whichever branch it was run on — daily from main, by hand from experimental — so anything on it is still under test, including what came from main. Each build is also tagged with its date, DD.MM.YYYY, which is what a digest is recognised by when choosing one to promote."
  - id: stable
    from: latest
    description: "What users run. Installers switch to it and ISOs are cut from it. Moved by hand onto a chosen `:latest` digest — a manifest retag, no rebuild — and signed again; nothing reaches it on a schedule. Installed machines then pick the move up by themselves: the image ships rpm-ostreed-automatic.timer enabled with AutomaticUpdatePolicy=stage, both from the base image rather than set by Borshevik, so each machine downloads and stages the new build of its channel about once a day and boots into it at its next reboot. Users can switch that off with the Image Manager's automatic-updates switch (@ImageManagerApp#auto-updates-row), and the Update Indicator extension shows while a staged build waits (@ImageManagerApp#rpm-ostree#needsReboot)."
steps:
  - id: requested
    description: Someone wants a change, in an issue or in the conversation. It is clarified until nothing is left to guess, then written into the terms.
    when: a request exists that the project's terms do not yet reflect
  - id: specified
    description: The change is in the spec, which is consistent, but the sources do not implement it yet.
    when: the change is present in the terms, verify_project is clean, and the sources do not yet implement it
    operation: "@Software#build"
  - id: implemented
    description: "The sources carry the change and the project validates — the spec through @DuckspecProject#validate, the repository through @BorshevikWorkflow#validate — but nobody has seen it run and nothing is recorded. A change to one of the GJS applications (@ImageManagerApp, @AppManagerApp) is tried now, by running the new version straight from the working tree on this machine (@ImageManagerApp#recipes#run), which takes seconds where an image build takes the better part of an hour; the author looks at it and either confirms it or asks for more changes, which send it back to `requested`. A change that only exists once an image is built — packages, services, build scripts, dconf, the Containerfile — cannot be run this way and goes straight to commit, which the reading of the steps reports as this step skipped; it is first seen running at `testing`."
    when: the working tree carries the change, @DuckspecProject#validate passes, tests/validate.sh exits 0, it is not committed, and the author has not yet confirmed it running from the working tree
    operation: "@Software#run"
  - id: tried_locally
    description: The author has run the new version from the working tree and confirmed it works, but nothing is recorded yet.
    when: the working tree carries the change, validates, and is not committed, and the author has confirmed it works running from the working tree
    operation: "@Git#commit"
  - id: committed
    description: The change is recorded locally and has reached no one.
    when: local commits carry the change and are not on the remote
    operation: "@Git#push(branch=experimental)"
  - id: on_experimental
    description: The change is on experimental but no image has been built from it.
    when: experimental carries the change and no image built from experimental does
    operation: "@GitHub#run_workflow(workflow=<build-base.yml or build-borshevik.yml, by the layer the change touches>, ref=experimental)"
  - id: testing
    description: "An image carrying the change is on `:latest`, and the author runs it on a real machine — rebasing with the Image Manager — to see that it works. Only the author can say it does; nothing here checks it. Once it does, the change goes to main."
    when: an image built from experimental carrying the change is on `:latest`, and the author has not yet confirmed it works on a machine running it
    operation: "@GitHub#open_pull_request(head=experimental, base=main)"
  - id: in_review
    description: A pull request from experimental to main carries the tested change.
    when: an open pull request into main carries the change
    operation: "@GitHub#merge_pull_request(strategy=merge)"
  - id: on_main
    description: "The change is on main and waits for a build. The schedule does it daily at 10:00 UTC; running it by hand does not have to wait."
    when: main carries the change and no image built from main does
    operation: "@GitHub#run_workflow(workflow=<build-base.yml or build-borshevik.yml, by the layer the change touches>)"
  - id: built_from_main
    description: "A build from main carrying the change is on `:latest` — still the testing channel — and waits to be chosen for users. On a machine running that build, the Image Manager's Promote to stable menu item starts the same workflow for the booted digest and variant."
    when: an image built from main carrying the change is on `:latest`, and `:stable` does not carry the change
    operation: "@GitHub#run_workflow(workflow=promote-image-to-stable.yml, ref=main, inputs=variant=<variant> digest=<digest>)"
  - id: on_stable
    description: The change reaches users through `:stable`. What follows only concerns fresh installs.
    when: "`:stable` resolves to a digest that carries the change, and no ISO carrying it is downloadable"
    operation: "@GitHub#run_workflow(workflow=build-iso.yml, ref=main)"
  - id: iso_built
    description: "Installer media carrying the change exist as the artifacts of one build-iso run, under file names no other run shares. They are not tried here, where they are: GitHub serves artifacts to the author's machine at a few hundred KiB/s, hours per image, while borshevik.org serves the same files about twenty times faster. So they go to the server first, where nothing links to them yet, and are tried from there."
    when: a build-iso run produced media carrying the change, and publish-iso.yml has not yet succeeded for it
    operation: "@GitHub#run_workflow(workflow=publish-iso.yml, ref=main, inputs=run_id=<run>)"
  - id: iso_uploaded
    description: "Both ISOs of the run and their checksums sit in the site's iso/ folder under their own names, verified there, and nothing a visitor sees has changed: the site still offers the previous pair, and no page links to the new names. Now they are tried, from the server, so what the author installs is byte for byte what users will download. If either fails, the site is never switched to them, and the two ISOs and their checksums are deleted from the server by hand."
    when: publish-iso.yml succeeded for the run, and the author has not yet confirmed both of its variants in a virtual machine
    operation: "@BorshevikWorkflow#try_iso(run_id=<run>)"
  - id: iso_tried
    description: "The author has installed both ISOs of the run in a virtual machine and confirmed each: the installer finishes, the installed system boots to GNOME and gets through first login, and `rpm-ostree status` shows it following ghcr.io/komorebinator/<variant>:stable. The NVIDIA variant can only be checked this far — no virtual machine has the GPU its drivers are for. Which pair the site offers is part of the website, so switching is a change to the website's repository, deployed the way any change to it is."
    when: the author has confirmed both variants of the run in a virtual machine, and the site does not yet offer the run's media
    operation: "@BorshevikWorkflow#switch_iso(run_id=<run>)"
  - id: iso_published
    description: "Fresh installs get the change. The site's download buttons lead to the run's media, and so do the permanent links https://borshevik.org/iso/borshevik-stable.iso and https://borshevik.org/iso/borshevik-nvidia-stable.iso that the repository's README uses — the website redirects them to whatever it currently offers. The previous media stay on the server until someone removes them."
    when: the site's download buttons lead to the run's media
components:
  - id: build-base
    type: "@Pipeline"
    platform: GitHub Actions
    description: Builds, pushes and signs both base images, then runs build-borshevik for the final layer on top. Daily at 10:00 UTC, or by hand. Both variants build in parallel, each tagged `latest` and with the build date, DD.MM.YYYY, and each signed by digest with the SIGNING_SECRET key (@SystemConfig#cosign-key is its public half). Container storage is moved to /mnt, where the runner has the disk space an image build needs.
    src: .github/workflows/build-base.yml
  - id: build-borshevik
    type: "@Pipeline"
    platform: GitHub Actions
    description: "Builds, pushes and signs both final images the same way, on the published base tags. Run by build-base, or by hand when only the final layer changed. Seven of its steps carry `if: github.event_name != 'pull_request'` guards inherited from the uBlue template; neither of its triggers produces that event, so they never take effect."
    src: .github/workflows/build-borshevik.yml
  - id: build-iso
    type: "@Pipeline"
    platform: GitHub Actions
    description: Builds the installer media of both variants from their :stable images, by hand — the tag is fixed in the workflow, so media follow a promotion only when this is run again; nothing chains the two. File names are unique per run (`<variant>-<YYYYMMDD>-<run number>.iso`, with a -CHECKSUM beside it), so published media are never overwritten in place. The media stay as the run's artifacts for the repository's default retention (90 days unless changed), which is how long a run stays publishable.
    src: .github/workflows/build-iso.yml
  - id: publish-iso
    type: "@Pipeline"
    platform: GitHub Actions
    src: .github/workflows/publish-iso.yml
    description: "Uploads the ISOs of one build-iso run to borshevik.org's iso/ folder, without changing what the site offers: nothing links to the new names until the website is switched to them, which happens only after the author has tried them (@BorshevikWorkflow#try_iso) — from the server, since that is far faster than from GitHub. Runs with ref=main."
    triggers:
      - "workflow_dispatch, with one required input: run_id, the database id of the build-iso run whose artifacts to publish"
    jobs:
      - "publish — one job, in a concurrency group of its own that never cancels a run in progress. Downloads the run's artifacts to /mnt, since the runner's root has too little space for both ISOs; refuses unless there is exactly one uniquely named ISO per variant, each with its checksum — a run from before unique names, or one missing a variant, is refused rather than published in half or under a name the site could already be serving; checks both checksums; uploads the four files with rsync into the site's iso/ folder over SSH, set up as the website's deploy sets it up; checks the checksums again on the server, so a truncated upload fails the run; and writes the two names to the job summary, where @BorshevikWorkflow#try_iso and @BorshevikWorkflow#switch_iso read them. rsync writes under a temporary name and renames when complete, and no page links to the new names yet, so a slow or interrupted upload is invisible to visitors; skipping files that already arrived makes a re-run safe, which holds only because no two runs share a name. Secrets reach the shell only through `env:`."
    outputs:
      - the run's two ISOs and their checksums in the site's iso/ folder, verified on the server; the site itself unchanged
    components:
      - id: DEPLOY_HOST
        type: "@Secret"
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH and rsync steps
        description: "The website's server, borshevik.org. This and the other DEPLOY_* secrets hold the same values as the secrets of the same names in the borshevik-landing repository, which deploys the website to the same place with the same key; change them in both together."
      - id: DEPLOY_PORT
        type: "@Secret"
        storage: GitHub Actions repository secret; optional
        used_by: publish-iso's SSH and rsync steps
        description: The server's SSH port. Empty or unset means 22.
      - id: DEPLOY_USER
        type: "@Secret"
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH and rsync steps
        description: The hosting account the website's files belong to.
      - id: DEPLOY_PATH
        type: "@Secret"
        storage: GitHub Actions repository secret
        used_by: publish-iso's rsync and verification steps
        description: Absolute path of the website's root on the server; the ISOs go into its iso/ folder.
      - id: DEPLOY_SSH_KEY
        type: "@Secret"
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH setup step
        description: Private half of the ed25519 key made for deploying the website, and nothing else.
      - id: DEPLOY_KNOWN_HOSTS
        type: "@Secret"
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH setup step
        description: The server's host key lines, recorded once and checked with StrictHostKeyChecking=yes, so the runner refuses any other host.
  - id: try-iso
    type: "@ShellScript"
    src: tests/try-iso.sh
    description: "Installs one ISO of a build-iso run, as borshevik.org serves it, into a fresh virtual machine on this machine, for the author to try (@BorshevikWorkflow#try_iso). Downloads from the site, not from GitHub: the run must have gone through publish-iso first, and what gets tried is the very file users will download. Runs on the host, not in a sandbox. Needs gh, logged in, curl, and the GNOME Boxes flatpak (org.gnome.Boxes), whose bundled qemu-system-x86_64, qemu-img and UEFI firmware it borrows — nothing is installed for it. Keeps everything under ${XDG_CACHE_HOME:-~/.cache}/borshevik-iso/<run id>/<variant>/, so a second try of the same run downloads nothing."
    functions:
      - id: run
        description: "Arguments: `[--boot] <run id | latest> <borshevik | borshevik-nvidia>`, `latest` being the newest successful build-iso run. The ISO's name is read from that run's log — exactly one `<variant>-<8 digits>-<digits>.iso`, or it stops (a run from before unique names has none). Unless it is already cached, downloads the ISO and its -CHECKSUM from borshevik.org, resuming an interrupted download; a checksum missing from the site means publish-iso has not run for this build, and it says so. Stops unless the checksum matches. Without --boot it boots the ISO on a fresh disk and fresh UEFI variables, replacing any from an earlier try, and the installed system comes up from the disk after the installer reboots; with --boot it boots the existing disk alone. The machine runs on the GNOME Boxes flatpak's own qemu and UEFI firmware, shown through that flatpak's SPICE client rather than qemu's own window, which misplaces the guest pointer under GNOME's fractional scaling on Wayland. The script blocks until that window is closed, then powers the machine off, as it also does when interrupted. Before starting it prints what to check."
  - id: promote-image-to-stable
    type: "@Pipeline"
    platform: GitHub Actions
    description: Moves `:stable` of one variant onto a chosen digest and signs it again. Run by hand with the variant and a sha256 digest; the move is a manifest retag, no rebuild. The Image Manager's Promote to stable starts it for the booted build (@ImageManagerApp#promote-to-stable).
    src: .github/workflows/promote-image-to-stable.yml
  - id: dependabot
    type: "@ConfigFile"
    src: .github/dependabot.yml
    description: "Configures Dependabot to check the github-actions ecosystem weekly and open PRs for outdated action versions."
  - id: renovate
    type: "@ConfigFile"
    src: .github/renovate.json5
    description: "Configures Renovate bot using config:best-practices. Auto-merges pin/pinDigest updates. Disables digest/pin updates for container refs in workflow files (to avoid interfering with manually pinned base images). Never rebases open PRs."
  - id: validate
    type: "@ShellScript"
    src: tests/validate.sh
    description: "Static checks over the repository, run on a Borshevik machine before a change is committed. Not tests — nothing is built or booted; it catches what breaks silently before any build runs. Needs bash, python3 with PyYAML, jq, gjs and desktop-file-validate, all present on Borshevik."
    functions:
      - id: run
        description: "Checks, each reported as ok or FAIL, exiting 1 on any failure: the syntax of every shell script, the JSON files, the GitHub YAML, the TOML configs, the desktop entries, an import of every app module but main.js (which would start the app), and the translations — every language of each app must have exactly the keys of English, and every key the code asks for must exist. Both apps fall back quietly on a missing key — the Image Manager to English for the whole file when a dictionary does not parse, the App Manager to the key itself — so without this check a broken dictionary shows only to the user who hits it. Needs gjs, so from a sandboxed shell it runs on the host."
  - id: SIGNING_SECRET
    type: "@Secret"
    storage: GitHub Actions repository secret
    used_by: build-base, build-borshevik and promote-image-to-stable, which sign every pushed image and every move of `:stable` with it
    description: Private half of @SystemConfig#cosign-key, in cosign's format. Installed systems accept only images signed with it, so losing it means no Borshevik image can be updated to again until every machine gets a new public key by hand.
recipes:
  - id: try_iso
    description: Has the author install both ISOs of one build-iso run in a virtual machine and say whether they work
    arguments:
      - id: run_id
        description: the build-iso run to try; the newest successful one when not given
    instructions:
      - "Run @BorshevikWorkflow#try-iso for `borshevik` with <run_id>, on the host (through `flatpak-spawn --host` when the shell is sandboxed) and in the background, since it blocks until the author closes the window. It downloads the ISO, about 6 GB, from borshevik.org, which takes some twenty minutes; tell the author when the window opens"
      - Tell the author what to check, as the script prints it, and wait for them; ask whether the standard variant works
      - Do the same for `borshevik-nvidia`, saying that without an NVIDIA GPU only installing, booting and following :stable can be judged
      - "Report the verdict per variant. Only both confirmed moves the run on to switch_iso. A failure is a defect to look into: the site is not switched to the run, and its two ISOs and checksums are deleted from the server's iso/ folder once the author agrees"
  - id: switch_iso
    description: Makes borshevik.org offer the ISOs publish-iso uploaded for one run
    arguments:
      - id: run_id
        description: the build-iso run whose media publish-iso uploaded
    instructions:
      - Read the two ISO names from the job summary of the latest successful publish-iso.yml run for <run_id>, and make sure the author confirmed both in @BorshevikWorkflow#try_iso
      - "Load the project registered for https://github.com/komorebinator/borshevik-landing and, following that project's own workflow, change which ISOs it offers to these two. Its deploy refuses to switch to files that are not on the server, so a switch made before the upload finished fails there instead of breaking the download buttons"
guidelines:
  - "Build only the layer the change touches. A change to the base layer — the borshevik-base and borshevik-base-nvidia stages of the Containerfile, cosign.pub, or the scripts they run (build-base.sh, build-base-nvidia.sh, install-kernel.sh, install-rpm-packages.sh, install-google-chrome.sh, install-steam.sh, cleanup.sh) — needs build-base.yml, which then builds the final layer on top by itself. Anything else — build_files/root/, build-addons.sh and the scripts it runs, the GNOME extensions, dconf, schemas, the final stages, or a new commit in an extension repository installed from its branch — needs build-borshevik.yml alone: the final stages build FROM the published borshevik-base tags, so rebuilding the base would only spend most of an hour producing what is already published. When a change touches both, build-base.yml."
  - "Installer media are built from main, never from experimental — build-iso.yml and publish-iso.yml, like promote-image-to-stable.yml, run with ref=main. What an ISO installs comes from :stable either way, but the workflow file and installer/ templates it builds with come from the branch it runs on, and media that reach users must be built by what main holds, not by something still being tried. A change to how ISOs are built or published therefore reaches main before it is used: by pull request, and on its own branch cut from main when experimental carries other changes not yet tried."
