description: "How work is done on Borshevik, from a request to an image users rebase onto. A change is tried on `experimental` first — pushed there, built into `:latest` by hand, run on a real machine — and goes to `main` by pull request only once it works. `main` is what the daily build reads; what it produces is still under test, and reaches users only when a chosen build is promoted to `:stable`, which is also what installers switch to and ISOs are cut from. Nothing is triggered by a push or a merge: builds run on a schedule or by hand."
extends: @DuckWorkflow
main_branch: main
versioning:
  type: @CalVer
  format: DD.MM.YYYY
src: .github/
branches:
  - id: main
    description: "What ships. The default branch on GitHub, so the scheduled build checks it out and promote-image-to-stable runs from it. Changes arrive by pull request — from experimental once tested, from short-lived feature branches, and from dependabot."
  - id: experimental
    description: Where a change is tried on real hardware before it goes to main. Built into `:latest` by hand when there is something to test, never by the schedule.
  - id: stable
    description: "Abandoned. Untouched since 2025-09 and hundreds of commits behind, read by no workflow, and unrelated to the `:stable` image tag despite the name — pushing to it ships nothing."
channels:
  - id: latest
    from: main, experimental
    description: "The testing channel. Every build lands here, from whichever branch it was run on — daily from main, by hand from experimental — so anything on it is still under test, including what came from main. Each build is also tagged with its date, DD.MM.YYYY, which is what a digest is recognised by when choosing one to promote."
  - id: stable
    from: latest
    description: "What users run. Installers switch to it and ISOs are cut from it. Moved by hand onto a chosen `:latest` digest — a manifest retag, no rebuild — and signed again; nothing reaches it on a schedule."
steps:
  - id: requested
    description: Someone wants a change, in an issue or in the conversation. It is clarified until nothing is left to guess, then written into the terms.
    when: a request exists that the project's terms do not yet reflect
  - id: specified
    description: The change is in the spec, which is consistent, but the sources do not implement it yet.
    when: the change is present in the terms, verify_project is clean, and the sources do not yet implement it
    operation: "@Software#build"
  - id: implemented
    description: "The sources carry the change and the project validates — the spec through @DuckspecProject#validate, the repository through @BorshevikWorkflow#validate — but nobody has seen it run and nothing is recorded. A change to one of the GJS applications (@ImageManagerApp, @AppManagerApp) is tried now, by running the new version straight from the working tree on this machine (@ImageManagerApp#recipes#run), which takes seconds where an image build takes the better part of an hour; the author looks at it and either confirms it or asks for more changes, which send it back to `requested`. A change that only exists once an image is built — packages, services, build scripts, dconf, the Containerfile — cannot be run this way and goes straight to commit, which the reading of the steps reports as this step skipped; it is first seen running at `testing`."
    when: the working tree carries the change, @DuckspecProject#validate passes, tests/validate.sh exits 0, it is not committed, and the author has not yet confirmed it running from the working tree
    operation: "@Software#run"
  - id: tried_locally
    description: The author has run the new version from the working tree and confirmed it works, but nothing is recorded yet.
    when: the working tree carries the change, validates, and is not committed, and the author has confirmed it works running from the working tree
    operation: "@Git#commit"
  - id: committed
    description: The change is recorded locally and has reached no one.
    when: local commits carry the change and are not on the remote
    operation: "@Git#push(branch=experimental)"
  - id: on_experimental
    description: The change is on experimental but no image has been built from it.
    when: experimental carries the change and no image built from experimental does
    operation: "@GitHub#run_workflow(workflow=build-base.yml, ref=experimental)"
  - id: testing
    description: "An image carrying the change is on `:latest`, and the author runs it on a real machine — rebasing with the Image Manager — to see that it works. Only the author can say it does; nothing here checks it. Once it does, the change goes to main."
    when: an image built from experimental carrying the change is on `:latest`, and the author has not yet confirmed it works on a machine running it
    operation: "@GitHub#open_pull_request(head=experimental, base=main)"
  - id: in_review
    description: A pull request from experimental to main carries the tested change.
    when: an open pull request into main carries the change
    operation: "@GitHub#merge_pull_request(strategy=merge)"
  - id: on_main
    description: "The change is on main and waits for a build. The schedule does it daily at 10:00 UTC; running it by hand does not have to wait."
    when: main carries the change and no image built from main does
    operation: "@GitHub#run_workflow(workflow=build-base.yml)"
  - id: built_from_main
    description: "A build from main carrying the change is on `:latest` — still the testing channel — and waits to be chosen for users. On a machine running that build, the Image Manager's Promote to stable menu item starts the same workflow for the booted digest and variant."
    when: an image built from main carrying the change is on `:latest`, and `:stable` does not carry the change
    operation: "@GitHub#run_workflow(workflow=promote-image-to-stable.yml, ref=main, inputs=variant=<variant> digest=<digest>)"
  - id: on_stable
    description: The change reaches users through `:stable`. What follows only concerns fresh installs.
    when: "`:stable` resolves to a digest that carries the change, and no ISO carrying it is downloadable"
    operation: "@GitHub#run_workflow(workflow=build-iso.yml, ref=main)"
  - id: iso_built
    description: "Installer media carrying the change exist as the artifacts of one build-iso run, under file names no other run shares, and nobody has installed from them yet. Nothing reaches borshevik.org before a person has: an ISO that fails to install is worse than an old one that works."
    when: a build-iso run produced media carrying the change, and the author has not yet confirmed both of its variants in a virtual machine
    operation: "@BorshevikWorkflow#try_iso(run_id=<run>)"
  - id: iso_tried
    description: "The author has installed both ISOs of the run in a virtual machine and confirmed each: the installer finishes, the installed system boots to GNOME and gets through first login, and `rpm-ostree status` shows it following ghcr.io/komorebinator/<variant>:stable. The NVIDIA variant can only be checked this far — no virtual machine has the GPU its drivers are for."
    when: the author has confirmed both variants of the run in a virtual machine, and the run's media are not on borshevik.org
    operation: "@GitHub#run_workflow(workflow=publish-iso.yml, inputs=run_id=<run>)"
  - id: iso_uploaded
    description: "Both ISOs of the run and their checksums sit in the site's iso/ folder under their own names, verified there, and nothing a visitor sees has changed: the site still offers the previous pair, and a download of it that was already running goes on undisturbed. Which pair the site offers is part of the website, so switching is a change to the website's repository, deployed the way any change to it is."
    when: publish-iso.yml succeeded for the run, and the site does not yet offer the run's media
    operation: "@BorshevikWorkflow#switch_iso(run_id=<run>)"
  - id: iso_published
    description: "Fresh installs get the change. The site's download buttons lead to the run's media, and so do the permanent links https://borshevik.org/iso/borshevik-stable.iso and https://borshevik.org/iso/borshevik-nvidia-stable.iso that this README uses — the website redirects them to whatever it currently offers. The previous media stay on the server until someone removes them."
    when: the site's download buttons lead to the run's media
components:
  - id: build-base
    type: @Pipeline
    platform: GitHub Actions
    description: "Workflow that builds, pushes and cosign-signs both base images, then invokes the final-layer workflow. Triggered by cron (daily 10:00 UTC) or workflow_dispatch. Runs a matrix build of borshevik-base and borshevik-base-nvidia targets in parallel (each cancels in-progress runs on the same ref). For each variant: creates /mnt/xdg-data for container storage (to avoid runner disk fill); builds the Containerfile target via redhat-actions/buildah-build with BUILD_DATE, IMAGE_TAG=latest, IMAGE_NAME args; logs into GHCR; normalizes registry/image names to lowercase; pushes with tags 'latest' and 'DD.MM.YYYY'; installs cosign; fetches the pushed image digest via skopeo inspect; signs the image by digest using SIGNING_SECRET as COSIGN_PRIVATE_KEY with cosign sign --key env://COSIGN_PRIVATE_KEY. On matrix completion, calls build-borshevik.yml as a reusable workflow (needs: build_and_push)."
    src: .github/workflows/build-base.yml
  - id: build-borshevik
    type: @Pipeline
    platform: GitHub Actions
    description: "Reusable workflow that builds, pushes and cosign-signs both final images on top of the published base tags. Triggered by workflow_call (from build-base.yml after the base matrix succeeds) or workflow_dispatch. Matrix-builds the borshevik and borshevik-nvidia final targets in parallel, mirroring build-base's steps but against the final Containerfile stages, which pull FROM the published ghcr.io/komorebinator/borshevik-base tags. Signs each image by digest with cosign after push. Seven steps carry `if: github.event_name != 'pull_request'` inherited from the upstream uBlue template; since neither trigger can produce a pull_request event, those guards never fire as the workflow stands."
    src: .github/workflows/build-borshevik.yml
  - id: build-iso
    type: @Pipeline
    platform: GitHub Actions
    description: "Manually triggered workflow that builds bootable ISOs from the :stable images. Triggered manually (workflow_dispatch) or via workflow_call. Builds ISO installer images for borshevik:stable and borshevik-nvidia:stable using build-container-installer. A step before the build sets the ISO name to `<image_name>-<UTC build date as YYYYMMDD>-<github.run_number>.iso` (e.g. borshevik-nvidia-20260927-58.iso), so no two runs ever produce the same file name and published media never have to be overwritten in place; the installer writes `<iso name>-CHECKSUM` beside it, holding `<sha256>  <iso name>`. Uploads each variant's ISO and checksum as one artifact named `<image_name>-stable-<major_version>`; `retention-days: 0` means the repository's default retention (90 days unless changed), which is how long a run stays publishable. The tag is hardcoded to `stable` in the workflow rather than taken as an input, so a build becomes installable from an ISO only after it has been promoted and this workflow is run again; nothing chains the two."
    src: .github/workflows/build-iso.yml
  - id: publish-iso
    type: @Pipeline
    platform: GitHub Actions
    src: .github/workflows/publish-iso.yml
    description: "Uploads the ISOs of one build-iso run, already tried by the author, to borshevik.org's iso/ folder, without changing what the site offers. Never run for media nobody has installed from."
    triggers:
      - "workflow_dispatch, with one required input: run_id, the database id of the build-iso run whose artifacts to publish"
    jobs:
      - "publish — one job on ubuntu-latest, `permissions: actions: read, contents: read`, concurrency group `publish-iso` with cancel-in-progress false. Steps: (1) make /mnt/iso owned by the runner user — /mnt, because the runner's root filesystem has too little free space for both ISOs. (2) `gh run download <run_id>` of this repository into /mnt/iso-download with the job's token, then move every *.iso and *.iso-CHECKSUM into /mnt/iso. (3) refuse to go on unless /mnt/iso holds exactly one ISO named `borshevik-<8 digits>-<digits>.iso` and one named `borshevik-nvidia-<8 digits>-<digits>.iso`, each with its -CHECKSUM — a run from before unique names, or a run missing a variant, is refused rather than published half or under a name the site could already be serving. (4) `sha256sum -c` of both checksum files, so what goes up is what the build produced. (5) SSH set up exactly as the website's deploy does it, from the DEPLOY_* secrets below. (6) `rsync -tv --ignore-existing --chmod=F644` of the four files into `<DEPLOY_PATH>/iso/`. rsync writes each file under a temporary name and renames it when complete, and no page links to these names yet, so a slow or interrupted upload is invisible to visitors; --ignore-existing makes a re-run skip whatever already arrived, which is safe only because no two runs share a name. (7) `sha256sum -c` of both checksum files on the server over SSH, so a truncated or corrupted upload fails the run. (8) write the two ISO names to the job summary, as what the switch step (@BorshevikWorkflow#switch_iso) needs. Every secret reaches the shell through `env:`."
    outputs:
      - the run's two ISOs and their checksums in the site's iso/ folder, verified on the server; the site itself unchanged
    components:
      - id: DEPLOY_HOST
        type: @Secret
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH and rsync steps
        description: "The website's server, borshevik.org. This and the other DEPLOY_* secrets hold the same values as the secrets of the same names in the borshevik-landing repository, which deploys the website to the same place with the same key; change them in both together."
      - id: DEPLOY_PORT
        type: @Secret
        storage: GitHub Actions repository secret; optional
        used_by: publish-iso's SSH and rsync steps
        description: The server's SSH port. Empty or unset means 22.
      - id: DEPLOY_USER
        type: @Secret
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH and rsync steps
        description: The hosting account the website's files belong to.
      - id: DEPLOY_PATH
        type: @Secret
        storage: GitHub Actions repository secret
        used_by: publish-iso's rsync and verification steps
        description: Absolute path of the website's root on the server; the ISOs go into its iso/ folder.
      - id: DEPLOY_SSH_KEY
        type: @Secret
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH setup step
        description: Private half of the ed25519 key made for deploying the website, and nothing else.
      - id: DEPLOY_KNOWN_HOSTS
        type: @Secret
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH setup step
        description: The server's host key lines, recorded once and checked with StrictHostKeyChecking=yes, so the runner refuses any other host.
  - id: try-iso
    type: @ShellScript
    src: tests/try-iso.sh
    description: "Installs one ISO of a build-iso run into a fresh virtual machine on this machine, for the author to try (@BorshevikWorkflow#try_iso). Runs on the host, not in a sandbox. Needs gh, logged in, and the GNOME Boxes flatpak (org.gnome.Boxes), whose bundled qemu-system-x86_64, qemu-img and UEFI firmware it borrows — nothing is installed for it. Keeps everything under ${XDG_CACHE_HOME:-~/.cache}/borshevik-iso/<run id>/<variant>/, so a second try of the same run downloads nothing."
    functions:
      - id: run
        description: "Arguments: `[--boot] <run id | latest> <borshevik | borshevik-nvidia>`. `latest` resolves, with gh, to the newest successful build-iso.yml run of komorebinator/borshevik. Unless the variant's directory already holds an ISO, downloads the run's artifact whose name starts with `<variant>-stable-` into it with `gh run download --pattern`. Runs `sha256sum -c` on the ISO's -CHECKSUM file and stops if it fails. Without --boot: creates a fresh 40G qcow2 disk and a fresh copy of the UEFI variable store, replacing any from an earlier try, and boots the ISO — the installer's reboot then comes up from the disk by itself, since the installer registers its boot entry first. With --boot: boots the existing disk alone, no ISO, and stops if there is none. The machine is started through `flatpak run --filesystem=<variant dir> --command=qemu-system-x86_64 org.gnome.Boxes`: KVM, q35, host CPU, 4 cores, 6 GiB, non-secure edk2-x86_64 firmware from the flatpak with the variable store as the second pflash, the disk on virtio, the ISO as a CD, virtio-vga in a GTK window, a USB tablet, user-mode networking on virtio-net. Blocks until the window is closed. Prints, before starting, what to check: that the installer finishes, the system boots to GNOME and gets through first login, and `rpm-ostree status` shows ghcr.io/komorebinator/<variant>:stable."
  - id: promote-image-to-stable
    type: @Pipeline
    platform: GitHub Actions
    description: "Manually triggered workflow that moves the :stable tag onto a chosen digest and signs the result. Triggered by workflow_dispatch with required inputs: variant (borshevik or borshevik-nvidia) and digest (sha256:... hex string). Validates digest format with regex ^sha256:[0-9a-f]{64}$. Logs into GHCR. Runs 'docker buildx imagetools create --tag ghcr.io/<owner>/<variant>:stable ghcr.io/<owner>/<variant>@<digest>' to create/update the :stable tag pointing to the given digest (no data copy, manifest-only). Fetches the resulting stable tag's manifest digest. Signs that manifest digest with cosign using SIGNING_SECRET. Triggered by borshevik-promote-to-stable CLI script."
    src: .github/workflows/promote-image-to-stable.yml
  - id: dependabot
    type: @ConfigFile
    src: .github/dependabot.yml
    description: "Configures Dependabot to check the github-actions ecosystem weekly and open PRs for outdated action versions."
  - id: renovate
    type: @ConfigFile
    src: .github/renovate.json5
    description: "Configures Renovate bot using config:best-practices. Auto-merges pin/pinDigest updates. Disables digest/pin updates for container refs in workflow files (to avoid interfering with manually pinned base images). Never rebases open PRs."
  - id: validate
    type: @ShellScript
    src: tests/validate.sh
    description: "Static checks over the repository, run on a Borshevik machine before a change is committed. Not tests — nothing is built or booted; it catches what breaks silently before any build runs. Needs bash, python3 with PyYAML, jq, gjs and desktop-file-validate, all present on Borshevik."
    functions:
      - id: run
        description: "Runs every check and reports each file or group as ok or FAIL, exiting 1 if anything failed: `bash -n` on every shell script under build_files/, installer/ and tests/ (by .sh suffix or an executable bit with a sh/bash shebang); `jq empty` on every JSON file under build_files/; PyYAML on the GitHub workflows and dependabot config; tomllib on the image-builder TOML files; desktop-file-validate on the desktop entries, any output counting as a failure; a gjs import of every module of both apps except their main.js, which would start the application — that parses each module and resolves its imports. Finally the translations: every language of @AppManagerApp's TRANSLATIONS and every JSON dictionary of @ImageManagerApp must carry exactly the keys of en, and every key the code passes to t() must exist in en. Both apps fall back quietly on a missing key — the Image Manager to English for the whole file when it does not parse, the App Manager to the key itself — so without this check a broken dictionary is visible only to the user who hits it."
recipes:
  - id: try_iso
    description: Has the author install both ISOs of one build-iso run in a virtual machine and say whether they work
    arguments:
      - id: run_id
        description: the build-iso run to try; the newest successful one when not given
    instructions:
      - "Run @BorshevikWorkflow#try-iso for `borshevik` with <run_id>, on the host (through `flatpak-spawn --host` when the shell is sandboxed) and in the background, since it blocks until the author closes the window. The first run of a variant downloads its ISO, about 6 GB"
      - Tell the author what to check, as the script prints it, and wait for them; ask whether the standard variant works
      - Do the same for `borshevik-nvidia`, saying that without an NVIDIA GPU only installing, booting and following :stable can be judged
      - "Report the verdict per variant. Only both confirmed moves the run on to publish-iso; a failure is a defect to look into, and the run is not published"
  - id: switch_iso
    description: Makes borshevik.org offer the ISOs publish-iso uploaded for one run
    arguments:
      - id: run_id
        description: the build-iso run whose media publish-iso uploaded
    instructions:
      - Read the two ISO names from the job summary of the latest successful publish-iso.yml run for <run_id>
      - "Load the project registered for https://github.com/komorebinator/borshevik-landing and, following that project's own workflow, change which ISOs it offers to these two. Its deploy refuses to switch to files that are not on the server, so a switch made before the upload finished fails there instead of breaking the download buttons"
guidelines:
  - "Installer media are built from main, never from experimental — build-iso.yml, like promote-image-to-stable.yml, runs with ref=main. What an ISO installs comes from :stable either way, but the workflow file and installer/ templates it builds with come from the branch it runs on, and media that reach users must be built by what main holds, not by something still being tried. A change to how ISOs are built or published therefore reaches main before it is used: by pull request, and on its own branch cut from main when experimental carries other changes not yet tried."
