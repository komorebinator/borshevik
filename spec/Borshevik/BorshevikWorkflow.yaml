description: "How work is done on Borshevik, from a request to an image users rebase onto. A change is tried on `experimental` first — pushed there, built into `:latest` by hand, run on a real machine — and goes to `main` by pull request only once it works. `main` is what the daily build reads; what it produces is still under test, and reaches users only when a chosen build is promoted to `:stable`, which is also what installers switch to and ISOs are cut from. Nothing is triggered by a push or a merge: builds run on a schedule or by hand."
extends: "@DuckWorkflow"
main_branch: main
versioning:
  type: "@CalVer"
  format: DD.MM.YYYY
src: .github/
branches:
  - id: main
    description: "What ships. The default branch on GitHub, so the scheduled build checks it out and promote-image-to-stable runs from it. Changes arrive by pull request — from experimental once tried, from a short-lived branch carrying commits cherry-picked from experimental when one change must go ahead of the rest, and from Dependabot. Nothing is committed here that is not on experimental first."
  - id: experimental
    description: Where a change is tried on real hardware before it goes to main. Built into `:latest` by hand when there is something to test, never by the schedule.
  - id: stable
    description: "Abandoned. Untouched since 2025-09 and hundreds of commits behind, read by no workflow, and unrelated to the `:stable` image tag despite the name — pushing to it ships nothing."
channels:
  - id: latest
    from: main, experimental
    description: "The testing channel. Every build lands here, from whichever branch it was run on — daily from main, by hand from experimental — so anything on it is still under test, including what came from main. Each build is also tagged with its date, DD.MM.YYYY, which is what a digest is recognised by when choosing one to promote."
  - id: stable
    from: latest
    description: "What users run. Installers switch to it and ISOs are cut from it. Moved by hand onto a chosen `:latest` digest — a manifest retag, no rebuild — and signed again; nothing reaches it on a schedule. Installed machines then pick the move up by themselves: the image ships rpm-ostreed-automatic.timer enabled with AutomaticUpdatePolicy=stage, both from the base image rather than set by Borshevik, so each machine downloads and stages the new build of its channel about once a day and boots into it at its next reboot. Users can switch that off with the Image Manager's automatic-updates switch (@ImageManagerApp#auto-updates-row), and the Update Indicator extension shows while a staged build waits (@ImageManagerApp#rpm-ostree#needsReboot)."
steps:
  - id: requested
    description: Someone wants a change, in an issue or in the conversation. It is clarified until nothing is left to guess, then written into the terms.
    when: a request exists that the project's terms do not yet reflect
  - id: specified
    description: The change is in the spec, which is consistent, but the sources do not implement it yet.
    when: the change is present in the terms, verify_project is clean, and the sources do not yet implement it
    operation: "@Software#build"
  - id: implemented
    description: "The sources carry the change and the project validates — the spec through @DuckspecProject#validate, the repository through @BorshevikWorkflow#validate — but nobody has reviewed it, seen it run, or recorded it. It is reviewed first (@BorshevikWorkflow#review_changes), while it is still small and nothing has been built from it, so what the review finds costs an edit rather than an image build and another round of testing."
    when: the working tree carries the change, @DuckspecProject#validate passes, tests/validate.sh exits 0, it is not committed, and it has not been reviewed since it was last edited
    operation: "@BorshevikWorkflow#review_changes(diff=the working tree against HEAD)"
  - id: reviewed
    description: "The uncommitted change has been reviewed and nothing the review found is left open, but nobody has seen it run. A change to one of the GJS applications (@ImageManagerApp, @AppManagerApp) is tried now, by running the new version straight from the working tree on this machine (@ImageManagerApp#recipes#run), which takes seconds where an image build takes the better part of an hour; the author looks at it and either confirms it or asks for more changes, which send it back to `requested`. A change that only exists once an image is built — packages, services, build scripts, dconf, the Containerfile — cannot be run this way and goes straight to commit, which the reading of the steps reports as this step skipped; it is first seen running at `testing`."
    when: the working tree carries the change, validates, is not committed, has been reviewed since it was last edited with no finding left open, and the author has not yet confirmed it running from the working tree
    operation: "@Software#run"
  - id: tried_locally
    description: The author has run the new version from the working tree and confirmed it works, but nothing is recorded yet.
    when: the working tree carries the change, validates, and is not committed, and the author has confirmed it works running from the working tree
    operation: "@Git#commit"
  - id: committed
    description: The change is recorded locally and has reached no one.
    when: local commits carry the change and are not on the remote
    operation: "@Git#push(branch=experimental)"
  - id: on_experimental
    description: The change is on experimental but no image has been built from it. The build takes from a few minutes to most of an hour; when it ends, @BorshevikWorkflow#notify_contributor with its result.
    when: experimental carries the change and no image built from experimental does
    operation: "@GitHub#run_workflow(workflow=<build-base.yml or build-borshevik.yml, by the layer the change touches>, ref=experimental)"
  - id: in_vm
    description: "An image carrying the change is on `:latest`, and nobody has run it yet. Before the author spends a reboot of their own machine on it, it is run in a throwaway virtual machine (@BorshevikWorkflow#test-image-in-vm), which catches what breaks a session for anyone: a login that fails, an extension that does not load, a unit that fails, errors in the journal. A virtual machine has no NVIDIA GPU, battery, suspend, Bluetooth or real graphics, so it cannot stand in for the author's machine; it only means that when the author tries the image, what they find is about the hardware. A failure sends the change back to `requested`."
    when: an image built from experimental carrying the change is on `:latest`, and @BorshevikWorkflow#test-image-in-vm has not passed on that image
    operation: "@BorshevikWorkflow#try_in_vm"
  - id: testing
    description: "An image carrying the change is on `:latest`, has passed in the virtual machine, and the author runs it on a real machine — rebasing with the Image Manager — to see that it works. Only the author can say it does; nothing here checks it. Once it does, everything experimental carries for main is reviewed together (@BorshevikWorkflow#review_changes): each change was reviewed on its own before it was committed, so this is the last look, at how the changes sit together and at whatever reached the branch unreviewed."
    when: an image built from experimental carrying the change is on `:latest`, @BorshevikWorkflow#test-image-in-vm has passed on it, and the author has not yet confirmed it works on a machine running it
    operation: "@BorshevikWorkflow#review_changes(diff=origin/main...experimental)"
  - id: ready_for_main
    description: "The author has confirmed the change on a real machine, and the whole of experimental against main has been reviewed with no finding left open. A finding fixed at this point is a new change, which goes through the steps from `requested` — a new image, the virtual machine and the author's machine again — before experimental is ready; one the author chose to keep is named in the pull request's description with the reason."
    when: the author has confirmed the change works on a machine running it, and experimental against main has been reviewed since experimental last changed, with no finding left open
    operation: "@GitHub#open_pull_request(head=experimental, base=main)"
  - id: in_review
    description: A pull request from experimental to main carries the tested change.
    when: an open pull request into main carries the change
    operation: "@GitHub#merge_pull_request(strategy=merge)"
  - id: on_main
    description: The change is on main and waits for a build. The schedule does it daily at 10:00 UTC; running it by hand does not have to wait. When a build run by hand ends, @BorshevikWorkflow#notify_contributor with its result.
    when: main carries the change and no image built from main does
    operation: "@GitHub#run_workflow(workflow=<build-base.yml or build-borshevik.yml, by the layer the change touches>)"
  - id: built_from_main
    description: "A build from main carrying the change is on `:latest` — still the testing channel — and waits to be chosen for users. On a machine running that build, the Image Manager's Promote to stable menu item starts the same workflow for the booted digest and variant."
    when: an image built from main carrying the change is on `:latest`, and `:stable` does not carry the change
    operation: "@GitHub#run_workflow(workflow=promote-image-to-stable.yml, ref=main, inputs=variant=<variant> digest=<digest>)"
  - id: on_stable
    description: The change reaches users through `:stable`. What follows only concerns fresh installs. When the ISO build ends, @BorshevikWorkflow#notify_contributor with its result.
    when: "`:stable` resolves to a digest that carries the change, and no ISO carrying it is downloadable"
    operation: "@GitHub#run_workflow(workflow=build-iso.yml, ref=main)"
  - id: iso_built
    description: "Installer media carrying the change exist as the artifacts of one build-iso run, under file names no other run shares. They are not tried here, where they are: GitHub serves artifacts to the author's machine at a few hundred KiB/s, hours per image, while borshevik.org serves the same files about twenty times faster. So they go to the server first, where nothing links to them yet, and are tried from there. When the upload ends, @BorshevikWorkflow#notify_contributor with its result."
    when: a build-iso run produced media carrying the change, and publish-iso.yml has not yet succeeded for it
    operation: "@GitHub#run_workflow(workflow=publish-iso.yml, ref=main, inputs=run_id=<run>)"
  - id: iso_uploaded
    description: "Both ISOs of the run and their checksums sit in the site's iso/ folder under their own names, verified there, and nothing a visitor sees has changed: the site still offers the previous pair, and no page links to the new names. Now they are tried, from the server, so what the author installs is byte for byte what users will download. If either fails, the site is never switched to them, and the two ISOs and their checksums are deleted from the server by hand."
    when: publish-iso.yml succeeded for the run, and the author has not yet confirmed both of its variants in a virtual machine
    operation: "@BorshevikWorkflow#try_iso(run_id=<run>)"
  - id: iso_tried
    description: "The author has installed both ISOs of the run in a virtual machine and confirmed each: the installer finishes, the installed system boots to GNOME and gets through first login, and `rpm-ostree status` shows it following ghcr.io/komorebinator/<variant>:stable. The NVIDIA variant can only be checked this far — no virtual machine has the GPU its drivers are for. Which pair the site offers is part of the website, so switching is a change to the website's repository, deployed the way any change to it is."
    when: the author has confirmed both variants of the run in a virtual machine, and the site does not yet offer the run's media
    operation: "@BorshevikWorkflow#switch_iso(run_id=<run>)"
  - id: iso_published
    description: "Fresh installs get the change. The site's download buttons lead to the run's media, and so do the permanent links https://borshevik.org/iso/borshevik-stable.iso and https://borshevik.org/iso/borshevik-nvidia-stable.iso that the repository's README uses — the website redirects them to whatever it currently offers. The previous media stay on the server until someone removes them."
    when: the site's download buttons lead to the run's media
components:
  - id: build-base
    type: "@Pipeline"
    platform: GitHub Actions
    description: Builds, pushes and signs both base images, then runs build-borshevik for the final layer on top. Daily at 10:00 UTC, or by hand. Both variants build in parallel, each tagged `latest` and with the build date, DD.MM.YYYY, and each signed by digest with the SIGNING_SECRET key (@SystemConfig#cosign-key is its public half). Container storage is moved to /mnt, where the runner has the disk space an image build needs.
    src: .github/workflows/build-base.yml
  - id: build-borshevik
    type: "@Pipeline"
    platform: GitHub Actions
    description: "Builds, pushes and signs both final images the same way, on the published base tags. Run by build-base, or by hand when only the final layer changed. Seven of its steps carry `if: github.event_name != 'pull_request'` guards inherited from the uBlue template; neither of its triggers produces that event, so they never take effect."
    src: .github/workflows/build-borshevik.yml
  - id: build-iso
    type: "@Pipeline"
    platform: GitHub Actions
    description: Builds the installer media of both variants from their :stable images, by hand — the tag is fixed in the workflow, so media follow a promotion only when this is run again; nothing chains the two. File names are unique per run (`<variant>-<YYYYMMDD>-<run number>.iso`, with a -CHECKSUM beside it), so published media are never overwritten in place. The media stay as the run's artifacts for the repository's default retention (90 days unless changed), which is how long a run stays publishable.
    src: .github/workflows/build-iso.yml
  - id: publish-iso
    type: "@Pipeline"
    platform: GitHub Actions
    src: .github/workflows/publish-iso.yml
    description: "Uploads the ISOs of one build-iso run to borshevik.org's iso/ folder, without changing what the site offers: nothing links to the new names until the website is switched to them, which happens only after the author has tried them (@BorshevikWorkflow#try_iso) — from the server, since that is far faster than from GitHub. Runs with ref=main."
    triggers:
      - "workflow_dispatch, with one required input: run_id, the database id of the build-iso run whose artifacts to publish"
    jobs:
      - "publish — one job, in a concurrency group of its own that never cancels a run in progress. Downloads the run's artifacts to /mnt, since the runner's root has too little space for both ISOs; refuses unless there is exactly one uniquely named ISO per variant, each with its checksum — a run from before unique names, or one missing a variant, is refused rather than published in half or under a name the site could already be serving; checks both checksums; uploads the four files with rsync into the site's iso/ folder over SSH, set up as the website's deploy sets it up; checks the checksums again on the server, so a truncated upload fails the run; and writes the two names to the job summary, where @BorshevikWorkflow#try_iso and @BorshevikWorkflow#switch_iso read them. rsync writes under a temporary name and renames when complete, and no page links to the new names yet, so a slow or interrupted upload is invisible to visitors; skipping files that already arrived makes a re-run safe, which holds only because no two runs share a name. Secrets reach the shell only through `env:`."
    outputs:
      - the run's two ISOs and their checksums in the site's iso/ folder, verified on the server; the site itself unchanged
    components:
      - id: DEPLOY_HOST
        type: "@Secret"
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH and rsync steps
        description: "The website's server, borshevik.org. This and the other DEPLOY_* secrets hold the same values as the secrets of the same names in the borshevik-landing repository, which deploys the website to the same place with the same key; change them in both together."
      - id: DEPLOY_PORT
        type: "@Secret"
        storage: GitHub Actions repository secret; optional
        used_by: publish-iso's SSH and rsync steps
        description: The server's SSH port. Empty or unset means 22.
      - id: DEPLOY_USER
        type: "@Secret"
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH and rsync steps
        description: The hosting account the website's files belong to.
      - id: DEPLOY_PATH
        type: "@Secret"
        storage: GitHub Actions repository secret
        used_by: publish-iso's rsync and verification steps
        description: Absolute path of the website's root on the server; the ISOs go into its iso/ folder.
      - id: DEPLOY_SSH_KEY
        type: "@Secret"
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH setup step
        description: Private half of the ed25519 key made for deploying the website, and nothing else.
      - id: DEPLOY_KNOWN_HOSTS
        type: "@Secret"
        storage: GitHub Actions repository secret
        used_by: publish-iso's SSH setup step
        description: The server's host key lines, recorded once and checked with StrictHostKeyChecking=yes, so the runner refuses any other host.
  - id: try-iso
    type: "@ShellScript"
    src: tests/try-iso.sh
    description: "Installs one ISO of a build-iso run, as borshevik.org serves it, into a fresh virtual machine on this machine, for the author to try (@BorshevikWorkflow#try_iso). Downloads from the site, not from GitHub: the run must have gone through publish-iso first, and what gets tried is the very file users will download. Runs on the host, not in a sandbox. Needs gh, logged in, curl, and the GNOME Boxes flatpak (org.gnome.Boxes), whose bundled qemu-system-x86_64, qemu-img and UEFI firmware it borrows — nothing is installed for it. Keeps everything under ${XDG_CACHE_HOME:-~/.cache}/borshevik-iso/<run id>/<variant>/, so a second try of the same run downloads nothing."
    functions:
      - id: run
        description: "Arguments: `[--boot] <run id | latest> <borshevik | borshevik-nvidia>`, `latest` being the newest successful build-iso run. The ISO's name is read from that run's log — exactly one `<variant>-<8 digits>-<digits>.iso`, or it stops (a run from before unique names has none). Unless it is already cached, downloads the ISO and its -CHECKSUM from borshevik.org, resuming an interrupted download; a checksum missing from the site means publish-iso has not run for this build, and it says so. Stops unless the checksum matches. Without --boot it boots the ISO on a fresh disk and fresh UEFI variables, replacing any from an earlier try, and the installed system comes up from the disk after the installer reboots; with --boot it boots the existing disk alone. The machine runs on the GNOME Boxes flatpak's own qemu and UEFI firmware, shown through that flatpak's SPICE client rather than qemu's own window, which misplaces the guest pointer under GNOME's fractional scaling on Wayland. The script blocks until that window is closed, then powers the machine off, as it also does when interrupted. Before starting it prints what to check."
  - id: promote-image-to-stable
    type: "@Pipeline"
    platform: GitHub Actions
    description: Moves `:stable` of one variant onto a chosen digest and signs it again. Run by hand with the variant and a sha256 digest; the move is a manifest retag, no rebuild. The Image Manager's Promote to stable starts it for the booted build (@ImageManagerApp#promote-to-stable).
    src: .github/workflows/promote-image-to-stable.yml
  - id: dependabot
    type: "@ConfigFile"
    src: .github/dependabot.yml
    description: "Configures Dependabot to check the github-actions ecosystem weekly and open PRs for outdated action versions."
  - id: renovate
    type: "@ConfigFile"
    src: .github/renovate.json5
    description: "Configures Renovate bot using config:best-practices. Auto-merges pin/pinDigest updates. Disables digest/pin updates for container refs in workflow files (to avoid interfering with manually pinned base images). Never rebases open PRs."
  - id: validate
    type: "@ShellScript"
    src: tests/validate.sh
    description: "Static checks over the repository, run on a Borshevik machine before a change is committed. Not tests — nothing is built or booted; it catches what breaks silently before any build runs. Needs bash, python3 with PyYAML, jq, gjs and desktop-file-validate, all present on Borshevik."
    functions:
      - id: run
        description: "Checks, each reported as ok or FAIL, exiting 1 on any failure: the syntax of every shell script and every Python file or script, the JSON files, the GitHub YAML, the TOML configs, the desktop entries, an import of every app module but main.js (which would start the app), and the translations — every language of each app must have exactly the keys of English, and every key the code asks for must exist. Both apps fall back quietly on a missing key — the Image Manager to English for the whole file when a dictionary does not parse, the App Manager to the key itself — so without this check a broken dictionary shows only to the user who hits it. Needs gjs, so from a sandboxed shell it runs on the host."
  - id: SIGNING_SECRET
    type: "@Secret"
    storage: GitHub Actions repository secret
    used_by: build-base, build-borshevik and promote-image-to-stable, which sign every pushed image and every move of `:stable` with it
    description: Private half of @SystemConfig#cosign-key, in cosign's format. Installed systems accept only images signed with it, so losing it means no Borshevik image can be updated to again until every machine gets a new public key by hand.
  - id: test-image-in-vm
    type: "@ShellScript"
    src: tests/test-image-in-vm.sh
    description: "Runs a Borshevik image in a throwaway virtual machine on this machine and checks it without anyone at the screen (@BorshevikWorkflow#try_in_vm). Runs on the host, not in a sandbox. Needs ssh, ssh-keygen, skopeo, python3, podman (rootful, for `base` alone, through run0) and the GNOME Boxes flatpak, whose qemu-system-x86_64, qemu-img and UEFI firmware it borrows. Everything lives under ${XDG_CACHE_HOME:-~/.cache}/borshevik-vm/: the base disk, an ed25519 key made for these machines and nothing else, and one directory per run."
    functions:
      - id: setup
        description: "`test-image-in-vm.sh setup [image]` — makes the base disk every run starts from, once: an installed system of <image>, default ghcr.io/komorebinator/borshevik:latest. It is only a starting point: every run rebases to the image under test first, and an image replaces the whole system, so what the base was made from does not matter beyond saving that first rebase. Creates the key if missing. Writes a bootc-image-builder config granting root that key and appending `systemd.wants=sshd.service` to the kernel command line, so the machine answers SSH from its first boot without the image having to enable sshd. Then, in one `run0` call — one password prompt — as root: pulls <image> (checked against the host's policy, the image being signed), pulls quay.io/centos-bootc/bootc-image-builder:latest with `--signature-policy` set to this repository's build_files/root/etc/containers/policy.json, the policy Borshevik ships (the host's may predate the fix that lets quay.io images through), runs the builder privileged with that config, the output directory, a store directory beside it and root's container storage mounted, for a 40 GiB btrfs qcow2. The store holds the builder's working trees and the raw disk it converts; it is mounted from the invoking user's cache because inside the container it would sit on root's /var, which on this machine has too little room for it next to the pulled image. On the way out, whether the build succeeded or not, both images are removed from root's container storage again (some 6 GB nobody could clear later without another password) and everything built is handed to the invoking user. This is the only step that needs root: bootc-image-builder installs the image the way an installer would — partitions, file systems, bootloader on a loop-mounted disk — and `run` needs nothing of the kind. Replaces an existing base only after the new one is built. Takes some twenty minutes."
      - id: run
        description: "`test-image-in-vm.sh run [--keep] [--scenarios auto|all|none|<name>[,<name>...]] [image]` — tries <image>, default ghcr.io/komorebinator/borshevik:latest, and exits 0 only if every check passed. Stops if there is no base. In a fresh run directory named by date and time: a qcow2 overlay on the base, so the base is never written, and a copy of the UEFI variable store. Boots it in the background through the Boxes flatpak — KVM, q35, host CPU, 4 cores, 6 GiB, virtio disk and GPU, no window, a SPICE socket for looking at it by hand, a QMP socket, user-mode networking forwarding a free local port to the guest's 22 — and waits for SSH as root with the key (up to five minutes), then for the boot to finish: `systemctl is-system-running --wait` in the guest, bounded at five minutes, repeated after any reboot that happens meanwhile. SSH answers before boot is over, and on a base's first boot setup-kargs (@Services) is still adding its kernel arguments and then reboots — a rebase started in between fails with 'Transaction in progress'. Every later reboot is waited for the same way. `ssh` is run with IdentitiesOnly, because an agent offering its own keys first gets the connection closed for too many authentication failures before the test key is tried. The forwarded port also resets a connection now and then right after boot, so a command whose ssh fails to connect (exit 255) is tried up to five times — but only one that is safe to repeat: the reboot, the rebase and the checks, which read their script from standard input, are sent once. Resolves <image>'s digest with skopeo on the host and, unless the booted deployment already has that digest from a signed reference, runs `rpm-ostree rebase ostree-image-signed:docker://<image>` in the guest and reboots into it; a base straight from bootc-image-builder boots `ostree-unverified-registry:`, so the first run always rebases once, if only to the signed reference. Prepares the scenario that has broken logins before: creates a user `tester` with a known password and, like the accounts the author tries images with, the App Manager's first run already done (its ~/.local/state/borshevik/app-manager-first-run.done stamp), and its screen set never to blank or lock (idle-delay 0, lock-enabled false, through a private D-Bus session) — a scenario runs far longer than the idle delay, and a screenshot taken after it otherwise shows a dark display — so the login is an existing user's and not a brand-new account's first one — which the test machine does not cover; runs the `prepare.sh` of every selected scenario that has one, as root, keeping its output as prepare-<name>.log in the run directory and stopping the run if it fails; sets GDM's AutomaticLogin for it — logged in by the GDM daemon itself, with no greeter involved (GDM's TimedLogin needs the greeter to start it, and it never did) — and adds a drop-in to the guest's gdm.service that sleeps 70 seconds before GDM starts, raising its TimeoutStartSec from 45 to 150 seconds so the wait does not fail the start, so tester's first login comes more than a minute after boot, when the user manager's boot-relative timers fire at once. Reboots, waits for SSH, then waits (up to five minutes) until tester has an active graphical session and GNOME Shell reports itself up, and 30 seconds more for the session to settle. Copies @BorshevikWorkflow#image-checks in and runs it as root with the digest it expects, printing its report. Takes a screenshot through QMP `screendump` and writes it as screen.png in the run directory, for whoever reads the report to look at. Then runs the selected @BorshevikWorkflow#scenarios, after the checks above so that what a scenario installs or changes can never affect them: each one's guest.sh is run as root in the guest, its report appended to report.txt under a `== scenario <name>` heading, and a screenshot taken after it as screen-<name>.png. With `auto`, the default, the selection is the scenarios whose `paths` match a file the checked-out branch changes against origin/main (`git diff --name-only origin/main...HEAD`, after fetching origin), and each selected one is printed with the first such file; `all` runs every scenario, `none` none, and a list exactly those named, an unknown name stopping the run before the machine starts. The run passes only if the checks and every scenario run passed. Unless --keep, powers the machine off over QMP and deletes its disk, UEFI variables and sockets, keeping report.txt, screen.png and the small logs (serial.log, the guest's console; rebase.log; qemu.log) for looking into a failure; with --keep it leaves the machine running and prints how to reach it by SSH and by spicy."
  - id: image-checks
    type: "@ShellScript"
    src: tests/image-checks.sh
    description: "The checks @BorshevikWorkflow#test-image-in-vm runs inside the guest, as root, after tester's login. Each prints `ok <name>` or `FAIL <name>: <what was found>`; all run even after a failure; the script exits 1 if any failed and prints `all checks pass` otherwise. Everything is read from the running system and its journal for the current boot; nothing is changed."
    functions:
      - id: run
        description: "Argument: the image digest expected. (1) image: `rpm-ostree status --json` has a booted deployment whose image digest is the expected one and whose origin is a signed image (ostree-image-signed). (2) system-units: `systemctl --failed` lists nothing. (3) coredumps: `coredumpctl list` for this boot is empty. (4) login: tester got exactly one graphical session of class user this boot, and no process logged 'A graphical session is already running' — a login that fails and is retried shows as two. (5) shell: a gnome-shell process runs as tester. (6) user-units: tester's user manager, reached over its bus at /run/user/<uid>/bus, lists no failed units. (7) extensions: every directory under /usr/share/gnome-shell/extensions is an extension `gnome-extensions info` reports in state ACTIVE for tester. (8) extension-errors: tester's journal for this boot has no line from gnome-shell reporting an error from an extension (`Extension <uuid>: Error` and the like, 'Extension point conflict', 'JS ERROR'). (9) enable-new-extensions: tester's borshevik-enable-new-extensions.service ended with Result=success and started no earlier than tester's gnome-session@gnome.target became active, by their monotonic timestamps. (10) blur-popups: org.gnome.shell.extensions.blur-my-shell.popup blur is false for tester — the image's patched default."
  - id: scenarios
    type: "@ConfigFile"
    src: tests/scenarios/
    description: "Tests of one piece of functionality each, run in the test machine by @BorshevikWorkflow#test-image-in-vm only when a change touches that functionality — unlike @BorshevikWorkflow#image-checks, which every run makes. One directory per scenario, its name the scenario's: `paths`, the repository paths the scenario covers, one git pathspec glob per line (blank lines and # comments ignored) — the single statement of which files make it needed; `guest.sh`, run as root in the guest after tester's login and the checks, printing `ok <name>` or `FAIL <name>: <what was found>` per check and `all checks pass` when none failed, exiting non-zero otherwise, in the manner of image-checks; and, optionally, `prepare.sh`, run as root in the guest before the reboot that logs tester in, for a scenario whose case is a state the login must start from rather than something done afterwards. A scenario may change the system as far as it needs — install, remove, download — since the machine is thrown away after it. A prepare.sh changes the conditions the checks run under, which is its point: in such a run the checks test the scenario's case, and no longer that of an existing user whose setup is untouched, so that case is covered by the runs in which the scenario is not selected. Selection is by path because what a change must be tested for follows from what it touches: a scenario that ran for every image would cost its time and downloads on changes it cannot be about, and one run by memory gets forgotten. Each scenario is described with the part it tests, and the part's own term names it."
recipes:
  - id: try_in_vm
    description: Runs the newest `:latest` in a throwaway virtual machine and reports whether it passed
    instructions:
      - "If @BorshevikWorkflow#test-image-in-vm has no base disk yet, tell the author that making one asks once for their admin password and takes some twenty minutes, then run `tests/test-image-in-vm.sh setup` on the host (through `flatpak-spawn --host` when the shell is sandboxed)"
      - "Run `tests/test-image-in-vm.sh run` on the host from the branch the image was built from, as a transient user service of its own — `systemd-run --user --collect --unit=borshevik-vm-test -p WorkingDirectory=<repository root> bash -c 'bash tests/test-image-in-vm.sh run > ~/.cache/borshevik-vm/last-run.log 2>&1; echo \"vm-run exit $?\" >> ~/.cache/borshevik-vm/last-run.log'` (through `flatpak-spawn --host` when the shell is sandboxed) — rather than as a background command of the session that starts it: a run takes around ten minutes, and an hour or more, with downloads inside the machine, when scenarios are selected, which outlasts the time a session's background command is allowed, and one stopped half-way leaves the machine's disk behind. The service gets the session's SSH agent from the user manager, so `auto` selection can fetch origin from it. Leave scenario selection on `auto`, so the scenarios run are the ones this change touches; say which ran and why, as the run prints it"
      - "Follow last-run.log while the run goes, not only once it ends: report each scenario as it starts and each FAIL as it appears, so a broken step is known within minutes rather than after the hour the rest of the run takes; the run is over when the log's last line reads `vm-run exit <status>`"
      - "Look at the run's screen.png, and each scenario's screen-<name>.png: the report checks what can be read from the system, the pictures show whether the desktop looks right"
      - Report each check, each scenario's checks, and what the screenshots show. All passing moves the change on to `testing`; anything failing is a defect to look into before the author is asked to try the image, and sends the change back to `requested`
      - Invoke @BorshevikWorkflow#notify_contributor with the run's result — the run can take an hour — naming the first failing check, or, when all passed, that the image is ready for the author to try
  - id: try_iso
    description: Has the author install both ISOs of one build-iso run in a virtual machine and say whether they work
    arguments:
      - id: run_id
        description: the build-iso run to try; the newest successful one when not given
    instructions:
      - "Run @BorshevikWorkflow#try-iso for `borshevik` with <run_id>, on the host (through `flatpak-spawn --host` when the shell is sandboxed) and in the background, since it blocks until the author closes the window. It downloads the ISO, about 6 GB, from borshevik.org, which takes some twenty minutes; tell the author when the window opens"
      - Tell the author what to check, as the script prints it, and wait for them; ask whether the standard variant works
      - Do the same for `borshevik-nvidia`, saying that without an NVIDIA GPU only installing, booting and following :stable can be judged
      - "Report the verdict per variant. Only both confirmed moves the run on to switch_iso. A failure is a defect to look into: the site is not switched to the run, and its two ISOs and checksums are deleted from the server's iso/ folder once the author agrees"
  - id: switch_iso
    description: Makes borshevik.org offer the ISOs publish-iso uploaded for one run
    arguments:
      - id: run_id
        description: the build-iso run whose media publish-iso uploaded
    instructions:
      - Read the two ISO names from the job summary of the latest successful publish-iso.yml run for <run_id>, and make sure the author confirmed both in @BorshevikWorkflow#try_iso
      - "Load the project registered for https://github.com/komorebinator/borshevik-landing and, following that project's own workflow, change which ISOs it offers to these two. Its deploy refuses to switch to files that are not on the server, so a switch made before the upload finished fails there instead of breaking the download buttons"
      - "Once the website's deploy has succeeded and borshevik.org offers the two new names, clean up everything the trial left on this machine, without being asked: power off any virtual machine @BorshevikWorkflow#try-iso still has running (a qemu-system-x86_64 whose -name is one of the run's ISOs, and its spicy viewer); delete ${XDG_CACHE_HOME:-~/.cache}/borshevik-iso entirely — the ISOs and the virtual machines' disks, tens of GB; stop the website's local preview container, borshevik-landing-preview, if it is running; and remove every git worktree made for the change whose branch has been merged. Report what was removed. Nothing on the server is cleaned here: images the site no longer offers are removed from it separately"
  - id: review_changes
    description: "Reviews a change — and only the change: what its diff adds, removes or alters. Code it does not touch is out of scope, however it looks; reviewing a change is not auditing the project, and findings in untouched code are not reported. The means are the agent's choice — its own reading, a review tool, another model, or several of them — and none is named here, so that whatever reviews best at the time can be used."
    arguments:
      - id: diff
        description: "what to review: the working tree against HEAD before a commit, or `origin/main...experimental` before a pull request"
    instructions:
      - "Take <diff>, fetching origin first when it names a remote branch. Read enough of the surrounding code and of the terms to judge the change, but judge only the change."
      - "Look for what the change gets wrong: a bug in the lines it adds or alters, behaviour it breaks elsewhere through what it changed (a caller, a setting, a unit it depends on), a contradiction with the project's terms and guidelines, a case it was meant to handle and does not. A problem that was there before the change and that the change neither causes nor makes worse is not a finding."
      - "Confirm each finding against the code before reporting it — the lines it is about, and how they are reached — and drop what does not hold up."
      - "Report the findings, each with the file and line, what goes wrong and when, or say that there are none. Fix the ones the author agrees with as part of the change; one the author chooses to keep is closed by that choice, with its reason."
  - id: notify_contributor
    description: Tells the contributor whose change it is, with a desktop notification, that an operation they are waiting on has ended — for the steps whose operation runs for minutes to hours, when they are rarely watching the conversation
    arguments:
      - id: operation
        description: what ended, e.g. `build-borshevik on experimental` or `VM run`
      - id: passed
        description: whether it succeeded
      - id: detail
        description: "the one thing to know: the failing check or step, or what comes next"
    instructions:
      - "Run `notify-send --app-name=\"Claude · Borshevik\" --icon=<dialog-information when passed, dialog-error otherwise> \"<operation>: <passed or failed>\" \"<detail>\"` on the host (through `flatpak-spawn --host` when the shell is sandboxed)"
      - Say the same in the conversation; the notification is a pointer to it, not a replacement
guidelines:
  - "Build only the layer the change touches. A change to the base layer — the borshevik-base and borshevik-base-nvidia stages of the Containerfile, cosign.pub, or the scripts they run (build-base.sh, build-base-nvidia.sh, install-kernel.sh, install-rpm-packages.sh, install-google-chrome.sh, install-steam.sh, cleanup.sh) — needs build-base.yml, which then builds the final layer on top by itself. Anything else — build_files/root/, build-addons.sh and the scripts it runs, the GNOME extensions, dconf, schemas, the final stages, or a new commit in an extension repository installed from its branch — needs build-borshevik.yml alone: the final stages build FROM the published borshevik-base tags, so rebuilding the base would only spend most of an hour producing what is already published. When a change touches both, build-base.yml."
  - "Installer media are built from main, never from experimental — build-iso.yml and publish-iso.yml, like promote-image-to-stable.yml, run with ref=main. What an ISO installs comes from :stable either way, but the workflow file and installer/ templates it builds with come from the branch it runs on, and media that reach users must be built by what main holds, not by something still being tried. A change to how ISOs are built or published is committed to experimental first like any other, and reaches main by pull request before it is used."
  - Every change is committed to experimental first — never to a branch cut from main, never straight to main — so experimental always holds everything main holds, plus what is still being tried. A change normally reaches main with the rest of experimental, by the pull request from experimental. When one change has to reach main before other changes on experimental have been tried — a fix to the ISO pipeline, say — its commits are cherry-picked from experimental onto a short-lived branch cut from main and merged by pull request, and main is merged back into experimental right after, so the two do not drift apart. The same merge-back brings in what reaches main first by nature, such as Dependabot's pull requests.
  - Functionality a virtual machine can exercise but @BorshevikWorkflow#image-checks does not reach — something a user installs, enables or runs on demand — gets a scenario in @BorshevikWorkflow#scenarios, written with the change that adds the functionality. Whoever adds, moves or renames a file of a part that has a scenario updates that scenario's `paths` in the same change, so the scenario keeps running whenever the part changes; a `paths` that misses a file is a scenario silently skipped for exactly the change that file carries.
