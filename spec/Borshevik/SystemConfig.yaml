description: Configuration and data files copied into the image filesystem at build time (via COPY build_files/root/ /). Covers container signature policy, audio config, desktop entries, icons, branding assets, and OS release metadata.
extends: @Software
platform: Podman / WirePlumber / GNOME
src: build_files/root/
components:
  - id: container-policy
    type: @ConfigFile
    src: build_files/root/etc/containers/policy.json
    description: "Container image signature verification policy for Podman/bootc. The global default rejects everything; within the docker transport the default is insecureAcceptAnything, and signatures are required only per registry: ghcr.io/komorebinator must be sigstore-signed by /etc/pki/containers/cosign.pub (matchRepository), ghcr.io/ublue-os by uBlue's key or its backup, quay.io/toolbx-images by its own key, and the two Red Hat registries by the Red Hat GPG key; registry.fedoraproject.org is accepted unsigned. So every `rpm-ostree rebase` or `bootc switch` to a Borshevik image must carry the Borshevik cosign signature, while images from registries not listed are pulled without any check."
  - id: container-registry-sigstore
    type: @ConfigFile
    src: build_files/root/etc/containers/registries.d/borshevik.yaml
    description: "Per-registry Sigstore verification config for ghcr.io/komorebinator. Points to the lookaside bundle location for signature storage."
  - id: wireplumber-no-autoswitch
    type: @ConfigFile
    src: build_files/root/etc/wireplumber/wireplumber.conf.d/50-disable-autoswitch.conf
    description: "WirePlumber setting `bluetooth.autoswitch-to-headset-profile = false`: a Bluetooth headset stays on its high-quality playback profile when an application opens a microphone, instead of being switched to the low-quality headset (HSP/HFP) profile. The file's own comment cites problems with Sony headsets."
  - id: os-release
    type: @ConfigFile
    src: build_files/root/usr/lib/os-release
    description: "Branding half of /usr/lib/os-release, COPYed into the image: NAME and PRETTY_NAME 'Borshevik', ID=borshevik, ID_LIKE=fedora, VARIANT='Universal Blue Custom Image', LOGO=borshevik, and HOME_URL / SUPPORT_URL / BUG_REPORT_URL all pointing at the GitHub repository. @ImageBuild#os-info later appends the per-build fields to this file rather than replacing it, so these values are what reaches the installed system."
  - id: app-manager-desktop
    type: @ConfigFile
    src: build_files/root/usr/share/applications/org.borshevik.AppManager.desktop
    description: "XDG desktop entry for the App Manager. Name='Borshevik App Manager' with a Russian translation, Exec=borshevik-app-manager, Icon=org.borshevik.AppManager, and search keywords. It sets no Categories — the app reaches the launcher's 'borshevik' folder because @ShellCustomizations#app-folders-dconf lists it there by file name, not by category."
  - id: image-manager-desktop
    type: @ConfigFile
    src: build_files/root/usr/share/applications/org.borshevik.ImageManager.desktop
    description: "XDG desktop entry for the Image Manager. Name='Borshevik Image Manager', Exec=borshevik-image-manager, Icon=org.borshevik.ImageManager, DBusActivatable=false, and search keywords. Like the App Manager entry it sets no Categories; @ShellCustomizations#app-folders-dconf places it in the 'borshevik' folder by file name."
  - id: app-manager-icon
    type: @Graphic
    src: build_files/root/usr/share/icons/hicolor/scalable/apps/org.borshevik.AppManager.svg
    format: SVG
    role: app-icon
    description: App icon for the App Manager shown in GNOME launcher and taskbar.
  - id: image-manager-icon
    type: @Graphic
    src: build_files/root/usr/share/icons/hicolor/scalable/apps/org.borshevik.ImageManager.svg
    format: SVG
    role: app-icon
    description: App icon for the Image Manager shown in GNOME launcher and taskbar.
  - id: borshevik-logo
    type: @Graphic
    src: build_files/root/usr/share/pixmaps/borshevik_logo.svg
    format: SVG
    role: logo
    description: Primary distro logo shown in the Image Manager header and GDM login screen.
  - id: borshevik-logo-dark
    type: @Graphic
    src: build_files/root/usr/share/pixmaps/borshevik_logo_dark.svg
    format: SVG
    role: logo
    description: Dark-background variant of the distro logo; reserved for future use.
  - id: fedora-logo
    type: @Graphic
    src: build_files/root/usr/share/pixmaps/fedora_logo_med.png
    format: PNG
    role: placeholder
    description: Fedora logo fallback shown by the Image Manager when no Borshevik logo is found.
  - id: fedora-logo-white
    type: @Graphic
    src: build_files/root/usr/share/pixmaps/fedora_whitelogo_med.png
    format: PNG
    role: placeholder
    description: White Fedora logo fallback for dark backgrounds.
  - id: plymouth-watermark
    type: @Graphic
    src: build_files/root/usr/share/plymouth/themes/spinner/watermark.png
    format: PNG
    role: splash
    description: Watermark shown by Plymouth during boot splash.
  - id: cosign-key
    type: @PublicKey
    src: cosign.pub
    path: /etc/pki/containers/cosign.pub
    description: "Cosign public key used to verify Sigstore signatures on Borshevik OCI images. Copied into the image by the Containerfile; referenced by container-policy and container-registry-sigstore to enforce that all rpm-ostree rebase and bootc switch operations to ghcr.io/komorebinator/* must be signed."
