description: Base layer of the NVIDIA variant: the standard base plus the NVIDIA driver (@ImageBuild#build-base-nvidia). Its stage builds FROM the borshevik-base stage of the same Containerfile run, not from the published tag. The kernel modules come prebuilt from @UBlueAkmodsNvidiaOpen and must match the kernel exactly — see @ImageBuild#install-kernel.
extends: @BorshevikBaseImage
registry: ghcr.io/komorebinator
tags:
  - "latest — pushed on every successful build-base.yml run"
  - "DD.MM.YYYY — same builds, dated tag"
