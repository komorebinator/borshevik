description: "Base layer of the standard variant, built by the borshevik-base stage of @ImageBuild#components#containerfile on @UniversalBlueGnome: @ImageBuild#components#build-base (kernel, curated RPMs, Chrome, Steam, patched packages, cleanup), plus the Borshevik signing key the whole lineage verifies with (@SystemConfig#components#cosign-key). Its kernel is not @UniversalBlueGnome's but the one @ImageBuild#components#install-kernel takes from @UBlueAkmods at @ImageBuild#components#containerfile#build_args#AKMODS_TAG."
extends: "@UniversalBlueGnome"
registry: ghcr.io/komorebinator
tags:
  - "latest — pushed on every successful build-base.yml run"
  - "DD.MM.YYYY — same builds, dated tag"
