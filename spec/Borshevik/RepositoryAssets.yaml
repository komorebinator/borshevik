description: Graphic assets stored in assets/ and used in README.md and project documentation. Not installed into the image.
extends: @Software
src: assets/
components:
  - id: readme-graphics
    type: @Graphic
    src:
      - assets/borshevik_logo.svg
      - assets/download.svg
      - assets/download-nvidia.svg
    format: SVG
    role: branding
    description: The logo and the two download buttons README.md shows, the buttons linking to the standard and NVIDIA ISOs.
