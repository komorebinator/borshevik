description: Graphic assets stored in assets/ and used in README.md and project documentation. Not installed into the image.
extends: "@Software"
src: assets/
components:
  - id: readme-graphics
    type: "@Graphic"
    src:
      - assets/borshevik_logo.svg
      - assets/download.svg
      - assets/download-nvidia.svg
    format: SVG
    role: branding
    description: The logo README.md shows, and the two download buttons it showed until 2026-10-31, linking to the standard and NVIDIA ISOs, when its installation section came to link the site's installation page instead (the author); the buttons are no longer shown anywhere.
