description: Graphic assets stored in assets/ and used in README.md and project documentation. Not installed into the image.
extends: "@Software"
src: assets/
components:
  - id: readme-graphics
    type: "@Graphic"
    src: assets/borshevik_logo.svg
    format: SVG
    role: branding
    description: The logo README.md shows. Its installation section links the site's installation page rather than showing download buttons (decisions#install-page-link).
    decisions:
      - id: install-page-link
        description: README.md's installation section links the site's installation page instead of the two download buttons — the ISOs' permanent links — it showed before.
        by: author
        date: 2026-10-31
