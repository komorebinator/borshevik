description: The OCI image build — one multi-stage Containerfile and the bash scripts its stages run. Which image each stage produces and what it builds on is described on @BorshevikBaseImage, @BorshevikBaseNvidiaImage, @BorshevikImage and @BorshevikNvidiaImage; when each is built, on @BorshevikWorkflow.
extends: "@Software"
platform: bash + Containerfile (buildah)
src: build_files/scripts/
components:
  - id: containerfile
    type: "@ContainerImage"
    src: Containerfile
    description: One stage per published image, plus `ctx`, a scratch stage holding build_files/scripts that every build stage bind-mounts rather than copies, so no script ends up in an image. Every build stage ends with `ostree container commit`. CI builds one target at a time and applies the tags itself. Each stage labels the image with its name as both the OCI title and the OCI version.
    stages:
      - id: ctx
        from: scratch
        description: "Throwaway context stage. COPYs build_files/scripts/ to /build_scripts/ so later stages can bind-mount it via --mount=type=bind,from=ctx — the build scripts are never present in any of the published image layers."
      - id: borshevik-base
        description: Builds @BorshevikBaseImage — see that term for FROM lineage and steps.
      - id: borshevik-base-nvidia
        description: Builds @BorshevikBaseNvidiaImage — see that term for FROM lineage and steps.
      - id: borshevik
        description: Builds @BorshevikImage — see that term for FROM lineage and steps.
      - id: borshevik-nvidia
        description: Builds @BorshevikNvidiaImage — see that term for FROM lineage and steps.
    build_args:
      - id: FEDORA_MAJOR_VERSION
        default: 44
        description: The Fedora release of the whole lineage — the base image and both akmods images — and PLATFORM_ID and VERSION_ID in os-release (os-info).
      - id: AKMODS_TAG
        default: main-<FEDORA_MAJOR_VERSION>-7.1.13-200.fc44
        description: "The one tag both akmods images are taken at — @UBlueAkmods for the kernel @ImageBuild#install-kernel installs, @UBlueAkmodsNvidiaOpen for the NVIDIA modules — so the kernel the image ships is decided by it alone, and the modules always come from the same uBlue build as that kernel. `main-<FEDORA_MAJOR_VERSION>`, rolling, follows uBlue's newest build of Fedora's stock kernel; `main-<FEDORA_MAJOR_VERSION>-<kernel version>` holds one kernel. Never a coreos-stable tag: the hold once followed it, and when Fedora CoreOS moved to 7.2.5 the build quietly installed a 7.2 kernel with the very regression it was held for. Held on 7.1.13 since 2026-10-01 because of the amdgpu HDMI regression in Fedora's 7.2 kernels: upstream commit 7e5760f084d0 made YCbCr 4:2:0 conditional on the force_yuv_pixel_format debugfs override, so a sink whose 4K@50/60 exists only as 4:2:0 — a 4K TV with an HDMI 1.4-class input — is sent RGB at 594 MHz it cannot accept and shows nothing, with no error logged. Upstream fixed it in 7.3 by rewriting the selection; there is no 7.2.x backport — checked again on 2026-10-21 against the stable changelogs up to 7.2.12, whose amdgpu display changes do not touch the 4:2:0 selection — which is why the kernel is held back rather than patched. A held kernel gets no updates; Fedora builds no more 7.1 kernels for this release, so the hold costs none that the rolling tag would have brought. Goes back to `main-<FEDORA_MAJOR_VERSION>` once Fedora ships 7.3 for this release; verify the fix either way — set a 4:2:0-only 4K@60 mode on such a TV and see whether a picture appears, or read the drm_mode_is_420_only branch in drivers/gpu/drm/amd/display/ and check it no longer demands force_yuv_pixel_format."
      - id: IMAGE_NAME
        description: No default; CI sets it to the target's name. Becomes the OCI labels and VARIANT_ID in os-release (os-info), and decides whether MOK enrollment is enabled (@Services#enable-services).
      - id: IMAGE_TAG
        default: latest
        description: Declared, but nothing in the build reads it; CI applies the tags.
      - id: BUILD_DATE
        description: No default; CI sets it to the build's date, DD.MM.YYYY. Becomes VERSION in os-release (os-info).
  - id: build-base
    type: "@ShellScript"
    description: Orchestrates the base layer — RPM packages, Chrome, Steam, podman.socket.
    src: build_files/scripts/build-base.sh
    functions:
      - id: run
        description: "The base layer's steps, in order: configure-repos first, since every package transaction after it reads the repositories it leaves; then install-kernel, before anything is layered, so everything layered afterwards resolves against the kernel the image will actually ship; then install-ca-certificates, while it is in place; then install-rpm-packages, @GoogleChromeApp#installer, @SteamApp#installer and cleanup; finally enables podman.socket."
  - id: build-base-nvidia
    type: "@ShellScript"
    description: Installs the NVIDIA driver on the base layer.
    src: build_files/scripts/build-base-nvidia.sh
    functions:
      - id: run
        description: "Installs the NVIDIA driver entirely from the RPMs @UBlueAkmodsNvidiaOpen carries — the prebuilt kernel modules and, from the same build, the whole userspace set (64-bit, 32-bit and noarch: driver, libraries, CUDA, settings tool and the rest) — and only libva-nvidia-driver, which follows no driver version, from the negativo17 repository. Then refuses the build unless the installed nvidia-driver is the version the modules were built for, and unless the NVIDIA kernel module is there for the kernel the image ships — the one kernel installed, from @UBlueAkmods at the same tag — so a cache whose modules were built for another kernel fails the build instead of shipping an NVIDIA image without a working driver. The userspace was once taken from negativo17 by version, which works only while the repository still carries that version: it keeps the newest alone, so an akmods tag pinned to an older kernel (@ImageBuild#containerfile#AKMODS_TAG) found its driver gone from the repository and the build failed. The cache always holds the matching set, the way uBlue's own nvidia-install.sh installs it, whether the tag is pinned or rolling. Runs no cleanup of its own; the base layer already did."
  - id: build-addons
    type: "@ShellScript"
    description: Orchestrates the final layer — Hiddify, waydroid_script, GNOME extensions, shell customizations, services, initramfs.
    src: build_files/scripts/build-addons.sh
    functions:
      - id: run
        description: "The final layer's steps, in order: os-info, @HiddifyApp#installer, @WaydroidApp#waydroid-script, @GnomeExtensions#installer, @ShellCustomizations#apply-schemas and #apply-dconf — the latter after the extensions, since it enables whatever extensions are installed at that moment — @Services#enable-services, and finalize-image last."
  - id: configure-repos
    type: "@ShellScript"
    description: Sets which package repositories of the uBlue base stay enabled, before the base layer's first package transaction. What it changes is kept in the image, so the NVIDIA stage, the final layer and installed systems see the same repositories.
    src: build_files/scripts/configure-repos.sh
    functions:
      - id: run
        description: "Disables fedora-cisco-openh264, and does nothing when the base no longer ships it. The build installs nothing from it, and it broke builds: one server behind codecs.fedoraproject.org, 54.205.131.252, which GitHub's runners resolve to, answers 404 for its metadata for every Fedora release, and rpm-ostree refreshes every enabled repository on each call and fails the transaction on it, ignoring the repository's skip_if_unavailable, which dnf5 honours (tried 2026-10-21 against that server) — both base builds of 2026-10-21 failed this way. Disabled for good rather than for the build alone, by the author's choice: the openh264 packages the base ships stay installed, and a user who wants another one enables the repository on their machine."
  - id: install-kernel
    type: "@ShellScript"
    description: Replaces the base image's kernel with the one in @UBlueAkmods, at @ImageBuild#containerfile#AKMODS_TAG, in both variants. So the kernel is decided by that tag alone and comes from the same uBlue build as the NVIDIA modules @ImageBuild#build-base-nvidia installs from @UBlueAkmodsNvidiaOpen at the same tag, rather than from @UniversalBlueGnome, whose kernel and uBlue's rolling akmods tags are built apart and can for a while name different kernels — modules built for one kernel do not load on another. Permanent since 2026-10-21; before, it existed only to hold the kernel on 7.1, and the kernel otherwise came from the base image.
    src: build_files/scripts/install-kernel.sh
    functions:
      - id: run
        description: Replaces every installed kernel subpackage with the RPMs COPYed from @UBlueAkmods into /tmp/akmods-kernel, via `rpm-ostree override replace`. The set is read from what the base image actually has installed — kernel, kernel-core, kernel-modules, kernel-modules-core, kernel-modules-extra — rather than hardcoded, and the script exits non-zero when the cache lacks one of them instead of leaving a half-swapped kernel; uBlue's fetch-kernel.sh caches all five for the Fedora flavours. kernel-headers and kernel-tools are left at the base image's version, the akmods cache carrying neither. Runs first in build-base.sh so everything layered afterwards resolves against the kernel that ships.
  - id: install-ca-certificates
    type: "@ShellScript"
    description: "Temporary (added 2026-10-21): brings ca-certificates up to the build named in the script, one that was still in Fedora's updates-testing when added, ahead of its push to stable, because it is the first build to drop emSign ECC Root CA - G3 and Comodo AAA Services root, the roots through which eight compromised eMudhra intermediates chain — their private keys could be derived from the public certificates (https://emudhra.we-have-a-problem.com/, 2026-10-20). Browsers are covered by their own revocation lists, but everything that reads the system bundle — curl, rpm-ostree, flatpak, the GJS apps — accepted a certificate for any host signed with one of those keys. The base layer upgrades nothing @UniversalBlueGnome ships, so without this the fix would reach the image only after Fedora's stable push and the Silverblue and uBlue rebuilds that follow it. Meant to be removed: once the base image itself ships that build or a later one, the script does nothing, and then it and its call in build-base.sh go."
    src: build_files/scripts/install-ca-certificates.sh
    functions:
      - id: run
        description: "Unless the installed ca-certificates is already that build or a later one, downloads exactly that build's RPM from Fedora's Koji, refuses it unless its SHA-256 is the one the script names — the very file checked against the advisory — and installs it with `rpm-ostree override replace`, as @ImageBuild#install-kernel installs its kernel; never downgrading a newer one the base may bring. From Koji rather than updates-testing through dnf5, which was tried first: the testing mirrors lagged behind the master repository and served metadata without the build (2026-10-21), so a build would have failed at random, and once Fedora pushes the build to stable it leaves updates-testing while the base image still lacks it — a Koji build stays where it is. Then refuses the build while emSign ECC Root CA - G3 is still trusted, in p11-kit's trust source or in the extracted TLS bundle programs read, so the image cannot ship with the fix silently missing. Checked 2026-10-21 against the advisory's chains.zip: with the stable build of the day the six chains through emSign ECC Root CA - G3 verify for TLS, with this one none do. The six through AAA Certificate Services never did on Fedora, whose bundle already limited that root to e-mail and code signing, so only the emSign root is checked."
  - id: install-rpm-packages
    type: "@ShellScript"
    description: Layers the curated RPM package set via rpm-ostree.
    src: build_files/scripts/install-rpm-packages.sh
    functions:
      - id: run
        description: "Layers the curated RPM set in one transaction; the list is in the script. Some of it is used by other parts of the image rather than directly by users: the compiler toolchain by @GnomeExtensions#own-builds, patchelf by @HiddifyApp#installer, gh by @ImageManagerApp#promote-to-stable, translate-shell by the Borshevik Translate extension (one of @GnomeExtensions#extensions-list), which translates through it and ships no translator of its own, adw-gtk3-theme by the dark GTK3 default (@ShellCustomizations#defaults), waydroid by @WaydroidApp — shipped on every machine though only some install Android, since a package cannot be layered on demand without an image update — and gsound by GSConnect, which recommends it for its sounds. GSConnect itself is not among the RPMs — it is built from source by @GnomeExtensions#own-builds — so nothing else would bring gsound in. mutter-devkit is what `gnome-shell --devkit` needs to run a nested shell in a window, so a GNOME Shell extension can be tried without logging out — on Wayland the session shell cannot be restarted in place, and a layered package would slow every image update, so it ships in the image instead."
  - id: finalize-image
    type: "@ShellScript"
    description: The final layer's last step, which regenerates what is derived from the image once everything else is in place.
    src: build_files/scripts/finalize-image.sh
    functions:
      - id: run
        description: "Rebuilds the desktop entries' MIME cache (`update-desktop-database /usr/share/applications`), then regenerates the initramfs of the installed kernel — reproducibly, not host-only, with ostree support — so it matches what the final layer ships. The cache because the final layer's COPY replaces entries packages installed in the base layer — @WaydroidApp#launcher#hidden-package-entries drops their MimeType — while the cache, written when the packages were installed and kept in the image's /usr, still names them as handlers, and GNOME and xdg-mime read the cache rather than the entries: the waydroid package's market:// handler stayed the default after it lost its MimeType (2026-10-07)."
  - id: cleanup
    type: "@ShellScript"
    description: Removes preinstalled software the image is not meant to ship — despite the name, nothing here cleans caches.
    src: build_files/scripts/cleanup.sh
    functions:
      - id: run
        description: Removes Firefox, toolbox, GNOME Classic and nvtop; every GNOME Shell extension RPM the base image brings, the image's extensions coming from @GnomeExtensions instead; GNOME Software's DKMS helper and DNF5 plugin; and disables flatpak-add-fedora-repos.service, leaving Flathub as the only Flatpak remote.
  - id: os-info
    type: "@ShellScript"
    description: Appends per-build identity to /usr/lib/os-release; the branding itself comes from @SystemConfig#os-release.
    src: build_files/scripts/os-info.sh
    functions:
      - id: run
        description: "Appends four fields to /usr/lib/os-release: VERSION from BUILD_DATE, PLATFORM_ID and VERSION_ID from FEDORA_MAJOR_VERSION, and VARIANT_ID from IMAGE_NAME. Appends rather than rewrites, so the branding @SystemConfig#os-release ships — NAME, ID, ID_LIKE, PRETTY_NAME, LOGO and the URLs — survives untouched."
