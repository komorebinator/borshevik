description: The OCI image build — one multi-stage Containerfile and the bash scripts its stages run. Which image each stage produces and what it builds on is described on @BorshevikBaseImage, @BorshevikBaseNvidiaImage, @BorshevikImage and @BorshevikNvidiaImage; when each is built, on @BorshevikWorkflow.
extends: "@Software"
platform: bash + Containerfile (buildah)
src: build_files/scripts/
components:
  - id: containerfile
    type: "@ContainerImage"
    src: Containerfile
    description: One stage per published image, plus `ctx`, a scratch stage holding build_files/scripts that every build stage bind-mounts rather than copies, so no script ends up in an image. Every build stage ends with `ostree container commit`. CI builds one target at a time and applies the tags itself. Each stage labels the image with its name as both the OCI title and the OCI version.
    stages:
      - id: ctx
        from: scratch
        description: "Throwaway context stage. COPYs build_files/scripts/ to /build_scripts/ so later stages can bind-mount it via --mount=type=bind,from=ctx — the build scripts are never present in any of the published image layers."
      - id: borshevik-base
        description: Builds @BorshevikBaseImage — see that term for FROM lineage and steps.
      - id: borshevik-base-nvidia
        description: Builds @BorshevikBaseNvidiaImage — see that term for FROM lineage and steps.
      - id: borshevik
        description: Builds @BorshevikImage — see that term for FROM lineage and steps.
      - id: borshevik-nvidia
        description: Builds @BorshevikNvidiaImage — see that term for FROM lineage and steps.
    build_args:
      - id: FEDORA_MAJOR_VERSION
        default: 44
        description: The Fedora release of the whole lineage — the base image and both akmods images — and PLATFORM_ID and VERSION_ID in os-release (os-info).
      - id: AKMODS_TAG
        default: main-<FEDORA_MAJOR_VERSION>-7.1.13-200.fc44
        description: "The one tag both akmods images are taken at — @UBlueAkmods for the kernel @ImageBuild#install-kernel installs, @UBlueAkmodsNvidiaOpen for the NVIDIA modules — so the kernel the image ships is decided by it alone, and the modules always come from the same uBlue build as that kernel. `main-<FEDORA_MAJOR_VERSION>`, rolling, follows uBlue's newest build of Fedora's stock kernel; `main-<FEDORA_MAJOR_VERSION>-<kernel version>` holds one kernel. Never a coreos-stable tag: the hold once followed it, and when Fedora CoreOS moved to 7.2.5 the build quietly installed a 7.2 kernel with the very regression it was held for. Held on 7.1.13 since 2026-10-01 because of the amdgpu HDMI regression in Fedora's 7.2 kernels: upstream commit 7e5760f084d0 made YCbCr 4:2:0 conditional on the force_yuv_pixel_format debugfs override, so a sink whose 4K@50/60 exists only as 4:2:0 — a 4K TV with an HDMI 1.4-class input — is sent RGB at 594 MHz it cannot accept and shows nothing, with no error logged. Upstream fixed it in 7.3 by rewriting the selection; there is no 7.2.x backport — checked again on 2026-10-21 against the stable changelogs up to 7.2.12, whose amdgpu display changes do not touch the 4:2:0 selection — which is why the kernel is held back rather than patched. A held kernel gets no updates; Fedora builds no more 7.1 kernels for this release, so the hold costs none that the rolling tag would have brought. Goes back to `main-<FEDORA_MAJOR_VERSION>` once Fedora ships 7.3 for this release; verify the fix either way — set a 4:2:0-only 4K@60 mode on such a TV and see whether a picture appears, or read the drm_mode_is_420_only branch in drivers/gpu/drm/amd/display/ and check it no longer demands force_yuv_pixel_format."
      - id: IMAGE_NAME
        description: No default; CI sets it to the target's name. Becomes the OCI labels and VARIANT_ID in os-release (os-info), and decides whether MOK enrollment is enabled (@Services#enable-services).
      - id: IMAGE_TAG
        default: latest
        description: Declared, but nothing in the build reads it; CI applies the tags.
      - id: BUILD_DATE
        description: No default; CI sets it to the build's date, DD.MM.YYYY. Becomes VERSION in os-release (os-info).
  - id: build-base
    type: "@ShellScript"
    description: Orchestrates the base layer — RPM packages, Chrome, Steam, patched packages, podman.socket.
    src: build_files/scripts/build-base.sh
    functions:
      - id: run
        description: "The base layer's steps, in order: configure-repos first, since every package transaction after it reads the repositories it leaves; then install-kernel, before anything is layered, so everything layered afterwards resolves against the kernel the image will actually ship; then install-rpm-packages, @GoogleChromeApp#installer and @SteamApp#installer; then install-package-fixes, as the last package transaction, so that none after it can bring a distribution build of a patched package back, and after install-rpm-packages, which layers mutter-devkit, one of the subpackages it replaces; then cleanup; finally enables podman.socket."
  - id: build-base-nvidia
    type: "@ShellScript"
    description: Installs the NVIDIA driver on the base layer.
    src: build_files/scripts/build-base-nvidia.sh
    functions:
      - id: run
        description: "Installs the NVIDIA driver entirely from the RPMs @UBlueAkmodsNvidiaOpen carries — the prebuilt kernel modules and, from the same build, the whole userspace set (64-bit, 32-bit and noarch: driver, libraries, CUDA, settings tool and the rest) — and only libva-nvidia-driver, which follows no driver version, from the negativo17 repository. Then refuses the build unless the installed nvidia-driver is the version the modules were built for, and unless the NVIDIA kernel module is there for the kernel the image ships — the one kernel installed, from @UBlueAkmods at the same tag — so a cache whose modules were built for another kernel fails the build instead of shipping an NVIDIA image without a working driver. The userspace was once taken from negativo17 by version, which works only while the repository still carries that version: it keeps the newest alone, so an akmods tag pinned to an older kernel (@ImageBuild#containerfile#AKMODS_TAG) found its driver gone from the repository and the build failed. The cache always holds the matching set, the way uBlue's own nvidia-install.sh installs it, whether the tag is pinned or rolling. Runs no cleanup of its own; the base layer already did."
  - id: build-addons
    type: "@ShellScript"
    description: Orchestrates the final layer — Hiddify, waydroid_script, GNOME extensions, shell customizations, services, initramfs.
    src: build_files/scripts/build-addons.sh
    functions:
      - id: run
        description: "The final layer's steps, in order: os-info, @HiddifyApp#installer, @WaydroidApp#waydroid-script, @GnomeExtensions#installer, @ShellCustomizations#apply-schemas and #apply-dconf — the latter after the extensions, since it enables whatever extensions are installed at that moment — @Services#enable-services, and finalize-image last."
  - id: configure-repos
    type: "@ShellScript"
    description: Sets which package repositories of the uBlue base stay enabled, before the base layer's first package transaction. What it changes is kept in the image, so the NVIDIA stage, the final layer and installed systems see the same repositories.
    src: build_files/scripts/configure-repos.sh
    functions:
      - id: run
        description: "Disables fedora-cisco-openh264, and does nothing when the base no longer ships it. The build installs nothing from it, and it broke builds: one server behind codecs.fedoraproject.org, 54.205.131.252, which GitHub's runners resolve to, answers 404 for its metadata for every Fedora release, and rpm-ostree refreshes every enabled repository on each call and fails the transaction on it, ignoring the repository's skip_if_unavailable, which dnf5 honours (tried 2026-10-21 against that server) — both base builds of 2026-10-21 failed this way. Disabled for good rather than for the build alone, by the author's choice: the openh264 packages the base ships stay installed, and a user who wants another one enables the repository on their machine."
  - id: install-kernel
    type: "@ShellScript"
    description: Replaces the base image's kernel with the one in @UBlueAkmods, at @ImageBuild#containerfile#AKMODS_TAG, in both variants. So the kernel is decided by that tag alone and comes from the same uBlue build as the NVIDIA modules @ImageBuild#build-base-nvidia installs from @UBlueAkmodsNvidiaOpen at the same tag, rather than from @UniversalBlueGnome, whose kernel and uBlue's rolling akmods tags are built apart and can for a while name different kernels — modules built for one kernel do not load on another. Permanent since 2026-10-21; before, it existed only to hold the kernel on 7.1, and the kernel otherwise came from the base image.
    src: build_files/scripts/install-kernel.sh
    functions:
      - id: run
        description: Replaces every installed kernel subpackage with the RPMs COPYed from @UBlueAkmods into /tmp/akmods-kernel, via `rpm-ostree override replace`. The set is read from what the base image actually has installed — kernel, kernel-core, kernel-modules, kernel-modules-core, kernel-modules-extra — rather than hardcoded, and the script exits non-zero when the cache lacks one of them instead of leaving a half-swapped kernel; uBlue's fetch-kernel.sh caches all five for the Fedora flavours. kernel-headers and kernel-tools are left at the base image's version, the akmods cache carrying neither. Runs first in build-base.sh so everything layered afterwards resolves against the kernel that ships.
  - id: install-rpm-packages
    type: "@ShellScript"
    description: Layers the curated RPM package set via rpm-ostree.
    src: build_files/scripts/install-rpm-packages.sh
    functions:
      - id: run
        description: "Layers the curated RPM set in one transaction; the list is in the script. Some of it is used by other parts of the image rather than directly by users: the compiler toolchain by @GnomeExtensions#own-builds, patchelf by @HiddifyApp#installer, gh by @ImageManagerApp#promote-to-stable, translate-shell by the Borshevik Translate extension (one of @GnomeExtensions#extensions-list), which translates through it and ships no translator of its own, adw-gtk3-theme by the dark GTK3 default (@ShellCustomizations#defaults), waydroid by @WaydroidApp — shipped on every machine though only some install Android, since a package cannot be layered on demand without an image update — and gsound by GSConnect, which recommends it for its sounds. GSConnect itself is not among the RPMs — it is built from source by @GnomeExtensions#own-builds — so nothing else would bring gsound in. mutter-devkit is what `gnome-shell --devkit` needs to run a nested shell in a window, so a GNOME Shell extension can be tried without logging out — on Wayland the session shell cannot be restarted in place, and a layered package would slow every image update, so it ships in the image instead."
  - id: install-package-fixes
    type: "@ShellScript"
    description: "Rebuilds the distribution packages Borshevik has to ship with a fix upstream has not released yet, and swaps them in for the base image's builds. Each fix is a patch in FIXES_DIR — build_files/scripts/package-fixes/ in the repository, under scripts/ because that is all the build's context stage (@ImageBuild#containerfile#ctx) brings into a build — applied to the source RPM of exactly the version the image already carries, so every base build patches whatever Fedora ships at the time: a new Fedora build of the package is patched by the next base build with no one tracking it, and the package keeps the version the rest of the image was built against — gnome-shell and mutter come from the same Fedora update. Patches are kept per major version because a major release is where the code they touch moves: when the image's package reaches a major version with no folder, the build stops until the patch is ported or dropped, rather than shipping the package unpatched. Built in the base layer's own RUN, not in a Containerfile stage of its own — the author's choice to leave the Containerfile alone (2026-11-05) — which is why the script has to leave the image as it found it but for the swapped packages; and not on COPR, whose builds do not follow Fedora's, so the base would wait on a COPR rebuild each time Fedora updates the package. The cost is the package's compile time on every base build."
    src: build_files/scripts/install-package-fixes.sh
    functions:
      - id: run
        description: "For each source package in FIXES_DIR: reads the version-release the image has of it and refuses to go on when there is no folder for its major version; downloads exactly that source RPM from the distribution's source repositories, refusing when it is not there or not signed by a key the image already trusts, since it is what gets patched and built; and checks each patch against the source as Fedora's spec prepares it — one that does not apply exactly, with no fuzz, fails the build, saying it is already upstream and to drop it when it applies in reverse, and that it conflicts and needs porting otherwise. Before installing the build dependencies it notes every installed package with its version, and /etc/passwd and /etc/group; builds the binary RPMs with the patches added to the spec and SUFFIX appended to the release (`50.6-2.fc44.borshevik`), without the package's own tests; then removes every package the build added, and refuses to go on unless the installed set is what it noted — apart from packages the dependencies upgraded, which it lists, being Fedora updates the next base would bring anyway — and no user or group was added: a package that creates one leaves it behind when removed, and every such package mutter's build needs is already in the image (checked 2026-11-05). Then replaces exactly the subpackages of that source the image has installed — for mutter: mutter, mutter-common, mutter-devkit — with `rpm-ostree override replace`, all of them or none, since they require each other's exact version and rpm-ostree refuses a partial replacement; and refuses the build unless each installed one is the very RPM just built, by its header digest, and `rpm -V` finds every file as packaged. Records each replaced package in install-package-fixes#manifest. Its work directory — source RPM, build tree, built RPMs — and the package cache it filled are removed on exit, failed or not, so nothing of the build stays in the layer."
    components:
      - id: manifest
        type: "@ConfigFile"
        path: /usr/share/borshevik/package-fixes
        format: "text, a line per replaced package: its NEVRA, `replaces`, the version-release it replaced, then `<patch name>=<sha256>` for each patch"
        scope: read by @BorshevikWorkflow#image-checks, and by anyone asking a machine what it was patched with
        description: What install-package-fixes#run replaced in the image and with which patches. Written in every image, empty when there is nothing to patch, so its absence means the step did not run.
      - id: mutter-implicit-grab
        type: "@Patch"
        target: mutter, Fedora's package — the compositor and its Clutter toolkit, which @GnomeShell runs in
        src: build_files/scripts/package-fixes/mutter/50/0001-clutter-sprite-Hold-the-implicit-grab-on-the-actor-its-chain-is-for.patch
        description: "Fixes gnome-shell aborting — the session lost, every window closed — at Clutter's assertion in clutter_sprite_notify_grab (clutter-sprite.c:717) when a grab on the whole stage follows a press that closed an app's menu (komorebinator/borshevik#87, GNOME mutter#5121). A press outside a Wayland popup's grab, on the app's own window — GTK and Qt menus close on the press itself — gets an event chain holding only the grab's helper actor, while the implicit grab was recorded on the window under the pointer; when the app dismisses the popup with the button still down, the helper actor is destroyed without leaving the chain, and a stage grab before the release — the overview, or any animated workspace switch since gnome-shell 50 added a stage grab to it (gnome-shell c336fb42), which is why the Workspace Manager extension hits it so often — finds every receiver gone and aborts. Reproduced on plain GNOME 50.6 with no extensions. The patch records the implicit grab on the actor the chain is built for and takes the target phase's actions from it too, which also stops a press made while a menu is open from reaching the top bar's window-drag gesture behind the grab; the assertion stays. Chosen over removing the assertion, which fixed the same crashes with the same results otherwise in the test machine (2026-11-04), because it removes the inconsistency rather than the check that catches it. Not in mutter as of 2026-11-05 — the assertion is unchanged in 50.x, 51 and main, and mutter#5121 is open — and expected to be needed for 51 too: once Fedora ships mutter 51 the build stops for want of a mutter/51 folder, and the patch is ported there (on main the code it changes is reshaped around `topmost`). Dropped once a mutter release Fedora ships carries a fix: the build then reports that it applies in reverse, or vm-scenario passes without it."
        components:
          - id: vm-scenario
            type: "@ShellScript"
            src:
              - tests/scenarios/menu-grab/guest.sh
              - tests/scenarios/menu-grab/paths
            description: "The menu-grab scenario of @BorshevikWorkflow#scenarios: the crash the patch fixes, brought about the way a user meets it — so that what passes is the fix itself, not merely a package with a new release. Nobody is at the test machine and its pointer is QEMU's, which nothing inside the guest can move, so the scenario makes its own input devices through uinput — an absolute pointer like QEMU's tablet, and a keyboard — which GNOME takes like any other. Nautilus because every image has it and its menus close on the press. Run whenever a change touches the mutter patches or the script that installs them. Tried before it went into the image, in a Borshevik test machine with Fedora's mutter 50.6-2 and the patched library swapped in by hand (2026-11-05): with Fedora's mutter the shell went down at clutter-sprite.c:717 every time (twice for a first version of it, once for this script); with the library of the package install-package-fixes builds, this script passed twice out of two, and the first version three times out of three with the library built by hand."
            functions:
              - id: run
                description: Opens a Nautilus window as tester under WAYLAND_DEBUG, keeping only the lines about its new surfaces and its popups, and maximizes it with Super+Up, so where to click follows from the screen size alone, read from Mutter's DisplayConfig. Right-clicks in the window and waits for Nautilus to ask for a popup grab (xdg_popup.grab), trying up to three times, since a click soon after the window appears is sometimes lost. Then presses the left button on Nautilus's own window outside the menu, keeps it down, presses Super, and releases. Fails unless the menu was opened with a grab and destroyed by Nautilus — without both, a surviving shell proves nothing — and unless the same gnome-shell process runs afterwards with no Clutter assertion in its journal since the press.
    fields:
      - id: FIXES_DIR
        type: path
        default: package-fixes/ beside the script — /build_scripts/package-fixes in the build
        description: "Where the patches are: one folder per source package, one under it per major version, the patches in it applied in name order."
      - id: SUFFIX
        type: string
        default: borshevik
        description: Appended to the distribution's release, so a rebuilt package says what it is wherever its version is shown — `rpm -q`, rpm-ostree, the manifest.
  - id: finalize-image
    type: "@ShellScript"
    description: The final layer's last step, which regenerates what is derived from the image once everything else is in place.
    src: build_files/scripts/finalize-image.sh
    functions:
      - id: run
        description: "Rebuilds the desktop entries' MIME cache (`update-desktop-database /usr/share/applications`), then regenerates the initramfs of the installed kernel — reproducibly, not host-only, with ostree support — so it matches what the final layer ships. Not host-only also keeps every console keymap in it: the LUKS prompt reads whatever `vconsole.keymap=` a machine boots with, and a system rebased onto Borshevik, or installed from an ISO older than @IsoInstaller#components#keyboard, may carry its own. The cache because the final layer's COPY replaces entries packages installed in the base layer — @WaydroidApp#launcher#hidden-package-entries drops their MimeType — while the cache, written when the packages were installed and kept in the image's /usr, still names them as handlers, and GNOME and xdg-mime read the cache rather than the entries: the waydroid package's market:// handler stayed the default after it lost its MimeType (2026-10-07)."
  - id: cleanup
    type: "@ShellScript"
    description: Removes preinstalled software the image is not meant to ship — despite the name, nothing here cleans caches.
    src: build_files/scripts/cleanup.sh
    functions:
      - id: run
        description: Removes Firefox, toolbox, GNOME Classic and nvtop; every GNOME Shell extension RPM the base image brings, the image's extensions coming from @GnomeExtensions instead; GNOME Software's DKMS helper and DNF5 plugin; and disables flatpak-add-fedora-repos.service, leaving Flathub as the only Flatpak remote.
  - id: os-info
    type: "@ShellScript"
    description: Appends per-build identity to /usr/lib/os-release; the branding itself comes from @SystemConfig#os-release.
    src: build_files/scripts/os-info.sh
    functions:
      - id: run
        description: "Appends four fields to /usr/lib/os-release: VERSION from BUILD_DATE, PLATFORM_ID and VERSION_ID from FEDORA_MAJOR_VERSION, and VARIANT_ID from IMAGE_NAME. Appends rather than rewrites, so the branding @SystemConfig#os-release ships — NAME, ID, ID_LIKE, PRETTY_NAME, LOGO and the URLs — survives untouched."
tests:
  - id: package-fixes
    description: "install-package-fixes#run on the base image it runs on in the build — locally, on a machine with podman, in minutes rather than through a base build of most of an hour — with configure-repos and mutter-devkit in place first, as the base layer has them by then. Four cases: the repository's patches, which it must install, each subpackage at the suffixed release, from a source RPM whose signature checks out; and three sets made from the first of them that it must refuse, each with its own message — the patches moved to the major version below the image's, as when the next major arrives; that patch turned around, so the source as shipped is what it would produce, as when upstream has taken it; and that patch with a line of context the source does not have, as when the code it touches has moved."
    command: bash tests/package-fixes.sh
    expect: exits 0 and prints 'all checks pass'
  - id: menu-grab-in-vm
    description: "install-package-fixes#mutter-implicit-grab#vm-scenario on a built image: the patched mutter is what the image ships, and it does not abort, selected by itself whenever a change touches its paths."
    command: tests/test-image-in-vm.sh run --scenarios menu-grab
    expect: the checks pass, package-fixes among them, and the report's `== scenario menu-grab` section ends with 'all checks pass'
