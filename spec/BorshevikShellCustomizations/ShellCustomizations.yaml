description: System-wide GNOME Shell customizations installed at image build time via dconf profiles and GSettings schema overrides.
extends: @Software
platform: bash + dconf + GSettings
src: build_files/scripts/
components:
  - id: apply-schemas
    type: @ShellScript
    description: Installs GSettings schema overrides and recompiles the schema cache.
    src: build_files/scripts/apply-schemas.sh
    functions:
      - id: run
        description: "Copies every file in build_files/scripts/schemas/ to /usr/share/glib-2.0/schemas/ — the whole directory, not a *.gschema.override filter — logging a warning and doing nothing when it is empty, then runs glib-compile-schemas over the destination. The overrides set system-wide GNOME defaults: pink accent colour, hot corners off, dock favorites, touchpad behaviour and window button layout."
  - id: apply-dconf
    type: @ShellScript
    description: Installs dconf profiles and system defaults, then runs dconf update.
    src: build_files/scripts/apply-dconf.sh
    functions:
      - id: run
        description: "Installs the GDM half first: copies dconf/gdm.d/gdm to /etc/dconf/db/gdm.d/00-borshevik and writes /etc/dconf/profile/gdm from scratch with user-db:user, system-db:gdm and file-db:/usr/share/gdm/greeter-dconf-defaults — the profile is generated here, not shipped as a file. Copies everything in dconf/local.d/ to /etc/dconf/db/local.d/. Then generates /etc/dconf/db/local.d/00-extensions by listing /usr/share/gnome-shell/extensions/* and writing every directory name it finds into enabled-extensions — this, not @GnomeExtensions#installer, is what actually turns the extensions on, and it enables whatever is present at that moment rather than a fixed list. Ends with `dconf update`."
  - id: gdm-dconf
    type: @ConfigFile
    format: dconf
    src: build_files/scripts/dconf/gdm.d/gdm
    description: "GDM login screen dconf overrides under [org/gnome/login-screen]: logo='/usr/share/pixmaps/borshevik_logo.svg'. Under [org/gnome/desktop/peripherals/touchpad]: tap-to-click=true, click-method='areas', two-finger-scrolling-enabled=true. Under [org/gnome/desktop/interface]: accent-color='pink'."
  - id: dark-by-default-dconf
    type: @ConfigFile
    format: dconf
    src: build_files/scripts/dconf/local.d/00-dark-by-default
    description: "System-wide dconf defaults under [org/gnome/desktop/interface]: color-scheme='prefer-dark', gtk-theme='adw-gtk3-dark'."
  - id: app-folders-dconf
    type: @ConfigFile
    format: dconf
    src: build_files/scripts/dconf/local.d/00-enable-app-folders
    description: "System-wide dconf defaults for GNOME app folders. Sets folder-children=['system','utilities','borshevik']. 'system' maps to System-Tools.directory (categories: System, Settings). 'utilities' maps to Utilities.directory (categories: Utility, Utilities). 'borshevik' is a non-translated folder containing org.borshevik.ImageManager.desktop and org.borshevik.AppManager.desktop."
  - id: hotkeys-dconf
    type: @ConfigFile
    format: dconf
    src: build_files/scripts/dconf/local.d/00-hotkeys
    description: "System-wide dconf keybinding defaults. Clears switch-to-application-1..10 (frees Super+1–9 from app switching). Sets switch-to-workspace-1..10 to Super+1..0. Sets move-to-workspace-1..10 to Shift+Super+1..0. Sets switch-input-source to [Super+Space, Shift+Super+F23]."
  - id: disable-hot-corners-schema
    type: @ConfigFile
    format: GSettings override
    src: build_files/scripts/schemas/90-disable-hot-corners.gschema.override
    description: "GSettings override for [org.gnome.desktop.interface]: enable-hot-corners=false."
  - id: favorites-schema
    type: @ConfigFile
    format: GSettings override
    src: build_files/scripts/schemas/90-favorites.gschema.override
    description: "GSettings override for [org.gnome.shell]: favorite-apps=['google-chrome.desktop','org.telegram.desktop.desktop','org.gnome.Nautilus.desktop','org.gnome.Calendar.desktop','org.gnome.World.Secrets.desktop','steam.desktop','org.gnome.Software.desktop']."
  - id: pink-by-default-schema
    type: @ConfigFile
    format: GSettings override
    src: build_files/scripts/schemas/90-pink-by-default.gschema.override
    description: "GSettings override for [org.gnome.desktop.interface]: accent-color='pink'."
  - id: touchpad-schema
    type: @ConfigFile
    format: GSettings override
    src: build_files/scripts/schemas/90-touchpad.gschema.override
    description: "GSettings override for [org.gnome.desktop.peripherals.touchpad]: tap-to-click=true, click-method='areas', two-finger-scrolling-enabled=true."
  - id: wm-button-layout-schema
    type: @ConfigFile
    format: GSettings override
    src: build_files/scripts/schemas/90-wm-button-layout.gschema.override
    description: "GSettings override for [org.gnome.desktop.wm.preferences]: button-layout='appmenu:minimize,maximize,close'."
  - id: gnome-initial-setup
    type: @ConfigFile
    src: build_files/root/etc/gnome-initial-setup/vendor.conf
    description: "Disables the GNOME Initial Setup 'Software' welcome page so that new users are not prompted to install apps via GNOME Software on first login (the App Manager replaces this flow)."
