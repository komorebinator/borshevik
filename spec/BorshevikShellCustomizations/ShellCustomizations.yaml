description: System-wide GNOME defaults set at image build time, so every account — and the login screen — starts from Borshevik's setup with nothing to configure. They are defaults only; a user's own changes take precedence.
extends: "@Software"
platform: bash + dconf + GSettings
src: build_files/scripts/
components:
  - id: apply-schemas
    type: "@ShellScript"
    description: Installs GSettings schema overrides and recompiles the schema cache.
    src: build_files/scripts/apply-schemas.sh
    functions:
      - id: run
        description: Installs the GSettings overrides among the defaults and recompiles the schema cache.
  - id: apply-dconf
    type: "@ShellScript"
    description: Installs dconf profiles and system defaults, then runs dconf update.
    src: build_files/scripts/apply-dconf.sh
    functions:
      - id: run
        description: Installs the login screen's dconf profile and gdm-dconf, and the dconf files among the defaults, then runs `dconf update`. It also writes the default list of enabled extensions from whatever @GnomeExtensions installed moments earlier — what switches extensions on for a fresh account; @Services#extension-autoenable covers accounts that already have a list of their own.
  - id: gdm-dconf
    type: "@ConfigFile"
    format: dconf
    src: build_files/scripts/dconf/gdm.d/gdm
    description: "The login screen: Borshevik's logo, and the same accent colour and touchpad behaviour as user sessions."
  - id: gnome-initial-setup
    type: "@ConfigFile"
    src: build_files/root/etc/gnome-initial-setup/vendor.conf
    description: "GNOME Initial Setup vendor config: `skip=software` drops the 'Software' welcome page, so new users are not prompted to install apps via GNOME Software on first login (the App Manager replaces this flow), and `existing_user_only=language;keyboard` shows the language and keyboard pages only in the per-user run, not in the system-level one."
  - id: defaults
    type: "@ConfigFile"
    src:
      - build_files/scripts/schemas/
      - build_files/scripts/dconf/local.d/
    description: "What a fresh account starts with: a dark style, extended to GTK3 apps through the adw-gtk3 theme; pink accent; hot corners off; minimize and maximize buttons; tap-to-click on the touchpad; a preset dock; app folders — most gathering apps by the categories their launchers declare, so an app installed later, a Flatpak from the App Manager included, lands in its folder by itself, one of them holding the two Borshevik apps by file name, and an Android one gathering @WaydroidApp#launcher#android-entry and #apps-entry by file name and every Android app's launcher by the category Waydroid gives each one it writes (X-WayDroid-App), so apps installed in Android later land there too — the System folder, which would claim those two by their System and Settings categories, excluding them; and workspace-first shortcuts — Super+number switches to that workspace and Shift+Super+number moves the window there (GNOME's Super+number app shortcuts are cleared to free the keys), and Super+Space switches keyboard layout. Split between GSettings overrides (apply-schemas) and dconf defaults (apply-dconf) as it happens to be; either works for a default. The folder list (folder-children) is a single key, so the image's reaches only accounts without one of their own: arranging icons into folders by hand writes the account's own list, which then hides every folder the image adds later — as it hid the Android folder on the author's machine — and GNOME Shell writes its own list (Utilities, YaST, Pardus) at a login that finds the key empty, as it did for accounts made before the image set any folders. Nothing merges the image's folders into such a list; whether it should is the author's call, not yet made."
    components:
      - id: vm-scenario
        type: "@ShellScript"
        src:
          - tests/scenarios/app-folders/guest.sh
          - tests/scenarios/app-folders/paths
        description: "The app-folders scenario of @BorshevikWorkflow#scenarios: whether the image's folders reach an account that has never had folders of its own — tester, whose first login the run is — the only kind of account they can reach (defaults). Run whenever a change touches the folders or how dconf defaults are installed."
        functions:
          - id: run
            description: "After the login and the checks: tester's folder-children is the image's, not replaced by GNOME Shell's own list at that first login; every folder it names has a definition; and for each, how many of the launchers installed in the VM fall into it, by file name or category, which says which folders GNOME shows there — it leaves an empty one out of the grid, and a fresh VM has no Flatpaks. Then it opens the app grid with Super+A, pressed on a virtual keyboard made through uinput, since GNOME Shell takes no such request over D-Bus from an ordinary client, so the scenario's screenshot shows the folders as tester sees them."
tests:
  - id: app-folders-in-vm
    description: "defaults#vm-scenario: the image's app folders for an account that has none of its own, selected by itself whenever a change touches its paths."
    command: tests/test-image-in-vm.sh run --scenarios app-folders
    expect: the checks pass, the report's `== scenario app-folders` section ends with 'all checks pass', and screen-app-folders.png shows the app grid with the folders that have apps in the VM
