description: How a fresh machine gets Borshevik: installer media that ask as little as possible, wipe the chosen disk, and end on the right signed image (@IsoInstaller).
extends: @DuckspecProject
terms_folder: Installer/
goals:
  - Produce a bootable ISO that installs Borshevik with as few questions as an install can be reduced to
  - End installation on the correct image and variant for the hardware, so no post-install rebase is needed
uses:
  - https://github.com/komorebinator/duckspec
settings:
  src: ..
software:
  - @IsoInstaller
