description: "Waydroid as integrated in Borshevik — LineageOS in an LXC container sharing the host kernel, its apps shown as windows of the GNOME session. Only the waydroid RPM ships in the image, layered in the base layer by @ImageBuild#install-rpm-packages; nothing else of Android exists on a machine until a user installs it — from the Image Manager's Android tab (@ImageManagerApp#main-window#android-page), or by checking Android applications support in the App Manager (@AppManagerApp#window#new-installation-tab#modules-group), or importing a configuration that names it there. Both run control#install and show its progress — the Image Manager directly, the App Manager through its module dispatcher (@AppManagerApp#modules); neither hands the user over to the other. Android apps themselves the user installs from Google Play; neither app installs any. Installing downloads Waydroid's GAPPS Android image, some 1.4 GB with its vendor image, into /var/lib/waydroid: LineageOS with Google Play Services and the Google Play Store, so apps install from Play and those relying on push, Google sign-in or Google's APIs work. Into it goes an ARM translation layer, because most apps on Google Play are built for ARM only. Neither is built into the Borshevik image: the GAPPS image comes from Waydroid's mirrors, and the translation layer is fetched on the user's machine by waydroid_script at install time — Google's libndk_translation from ChromeOS and Intel's libhoudini are proprietary and may not be redistributed. Google lets an Android build it has not certified into Play only once the user has registered the device's Google Services Framework ID under their own Google account — a step for each install, which no one can do for them (control#google). GAPPS rather than microG on a VANILLA image: Waydroid builds and ships GAPPS itself, its Google services keep themselves current, while microG reaches Waydroid only through third-party scripts and, with no signature spoofing in Waydroid's images, apps refuse it (tried 2026-10-02: push never registered, WhatsApp rejected the Play Store's signature). Which Android images a machine runs is decided by the Borshevik image it booted, not by Waydroid: each release carries the system and vendor images it approves (config), and the images themselves — too large to build in — are downloaded from Waydroid's mirrors and installed by Android's own timer apart from the OS update, so a new pair arrives with a Borshevik update and a rollback of Borshevik brings back the pair the older release approved. Nothing inside Android updates it (config's `properties`). Whether Android is installed is decided everywhere — the Image Manager's tab, the App Manager, the update service — by control#stamp, not by /var/lib/waydroid existing, so a half-finished install or a Waydroid initialised by hand is never taken for a working one."
src: build_files/root/usr/libexec/borshevik/borshevik-waydroid
platform: bash / systemd
extends: "@Software"
components:
  - id: control
    type: "@ShellScript"
    src: build_files/root/usr/libexec/borshevik/borshevik-waydroid
    description: "Everything that changes Android on the machine, as one script with a subcommand per action, which both apps and the update service call directly: one thing to authorise, and one place where installing, updating and removing are kept consistent with each other, so the Image Manager and the App Manager cannot install Android two different ways. Run under pkexec by @ImageManagerApp#waydroid, as root by @AppManagerApp#modules — the App Manager's single privileged entry point, which installs every module a run needs under one password — and by update#service. Every subcommand but `rendering` refuses to run unless root, and install, upgrade and remove run one at a time (control#busy). Prints what it is doing line by line, for whichever window shows its progress, and exits non-zero on any failure — but never with 126 or 127, the statuses pkexec returns when the password is refused, so a caller can tell a user who cancelled from an install that broke (@AppManagerApp#window#_runModules acts on the difference, through @AppManagerApp#modules, which keeps to the same rule)."
    fields:
      - id: stamp
        type: file /var/lib/borshevik/waydroid-installed, holding the Android version (e.g. 13) the translation layer was installed for
        description: The one meaning of 'Android is installed'. Written by install as its very last step and deleted by remove as its first, so its presence always means a finished install; readable by every user, which is how the Image Manager and the App Manager see it without privileges. The version inside is what upgrade compares against, because the translation layer is built for one Android version.
      - id: channel
        type: directory /var/lib/borshevik/waydroid-ota, holding system/lineage/waydroid_x86_64/<romtype>.json and vendor/waydroid_x86_64/MAINLINE.json
        description: "An OTA channel of Waydroid's own format listing only config's approved images, one entry each, which control writes from config before every init and upgrade and hands Waydroid as file:///var/lib/borshevik/waydroid-ota/system and …/vendor. Waydroid reads it exactly as it reads ota.waydro.id — its downloader is urllib, which opens file URLs, and init builds the files' paths from the channel itself — so `waydroid init` and `waydroid upgrade` can fetch nothing but the approved pair, verify it and install it the way they always do, and the zips still come from Waydroid's own mirrors. Written, not shipped, so config stays the one file to edit. Where the two files go inside it is Waydroid's own layout, written down in one place in control — the two URLs control writes the files at, the same ones upgrade points waydroid.cfg at — so the configuration cannot name a file that was not written."
      - id: busy
        type: file /run/borshevik/waydroid-busy, holding `<operation> <pid>` (install, upgrade or remove) under an flock that process holds, and once it has ended `done <operation> <nanoseconds since the epoch>`; empty when none has run since boot
        description: "That an operation is changing Android right now, and which. install, upgrade and remove take the lock before doing anything and refuse at once, exiting 4 with a message, when another holds it — so an install the App Manager started and one the Image Manager's button would start, or an upgrade the timer fires during a removal, can never run over each other. When the operation ends, successful or not, the file is rewritten, not removed — removing it would let a process that had just opened the old file lock it beside one creating a new file — with which operation ended and when, so a reader that last looked before the operation began can tell that one ran even when it began and ended unseen; a refused operation, which never held the lock, writes nothing. A reader that finds an operation in it checks that the pid is alive, so one left behind by a crash is not taken for an operation still running. In /run, so a reboot clears it. Readable by every user: the Image Manager's Android tab shows by it that Android is being installed, updated or removed, which control#stamp alone cannot tell — install deletes the stamp first and writes it last — and by the record of the last one that something changed since it last looked."
      - id: first-boot
        type: files /var/lib/waydroid/overlay/system/etc/init/borshevik.rc and /var/lib/waydroid/overlay/system/etc/borshevik-defaults.sh
        description: "Applies config's `android_settings` inside Android once, the first time it finishes booting: Android's own settings live in its user data, which exists only after a first boot, so they cannot be set from the host the way properties are. install writes both into Waydroid's system overlay, which Android sees as part of /system: an init service, run as root once sys.boot_completed is 1, runs the script, which puts each setting with `settings put <namespace> <key> <value>` unless persist.borshevik.defaults is already 1, and then sets it to 1. So the settings are defaults — one the user changes afterwards stays changed — and a new install, whose data starts empty, gets them again."
      - id: theme
        type: files /var/lib/waydroid/overlay/system/etc/init/borshevik-theme.rc and /var/lib/waydroid/overlay/system/etc/borshevik-theme.sh
        description: "Android's half of theme-sync: applies the colours persist.borshevik.theme names — `<rrggbb> <dark|light>` — inside Android. An init service, run as root, starts the script once Android has booted and again whenever the property changes; the script exits at once while sys.boot_completed is not 1, since a persistent property is loaded early in boot, before Android's settings can be written, and the boot trigger applies it then. The colour becomes Android 13's Material You seed through the secure setting theme_customization_overlay_packages — system palette and accent both that colour, colour source `preset` so the wallpaper no longer decides, style VIBRANT — from which Android derives its whole palette, as from wallpaper. VIBRANT because it keeps the colour about as saturated as GNOME shows it: tried on 2026-10-05, GNOME's red e62d42 became Android's accent ec0037 under VIBRANT but a dusty ac6161 under TONAL_SPOT, Material You's default, which mutes every seed so much that the author saw no accent at all, while EXPRESSIVE turns the hue round, red into blue; dark or light becomes `cmd uimode night yes|no`. The setting is written only when it differs, so a reboot does not make Android redo its overlays. Being a persistent property, the colours survive Android restarting, so an Android started while theme-sync is not running still comes up in the last colours it was given. Written by install and upgrade, so an install made before theme-sync gets it with its next upgrade."
      - id: keylayouts
        type: files /var/lib/waydroid/overlay/system/usr/keylayout/*.kl
        description: "Game controllers' key layouts, as Android would use them if it could see the kernel's configuration. A layout in Android's image may declare `requires_kernel_config CONFIG_…`: it is written for the codes one kernel driver sends, and Android loads it only when /proc/config.gz shows that driver built, falling back otherwise to a layout for the generic HID driver. In the container /proc/config.gz does not exist, so Android always falls back — and the host's driver sends other codes: a DualSense under hid-playstation came out with its face buttons shifted and its triggers and right stick swapped: a released trigger reads as the right stick held at its end, and in Genshin Impact the camera turned to the sky and stayed there (2026-10-03). For each such layout in the installed system image, control checks the required options in the running kernel's configuration (/usr/lib/modules/<release>/config), and when every one is built in or a module, writes a copy without the `requires_kernel_config` lines into the system overlay under the same name, where it takes the place of the image's. Read from the image without mounting it (debugfs). Every copy carries a first line saying control wrote it, and only files carrying it are deleted before the copies are written again, so a layout someone puts there by hand stays. Android 13's GAPPS image has one such layout, the DualSense's (Vendor_054c_Product_0ce6.kl, CONFIG_HID_PLAYSTATION)."
      - id: google-watch
        type: files /var/lib/waydroid/overlay/system/etc/init/borshevik-google.rc and /var/lib/waydroid/overlay/system/etc/borshevik-google.sh, and the flag /data/borshevik/google-signed-in inside Android
        description: "Notes once, from inside Android, that it has signed in to a Google account — the one sign that the device's registration went through — so any host user can tell it later without a password and without Android running. Reading it from the host needs Android's accounts database, which belongs to Android's system user, uid 1000, and so only the machine's first user, uid 1000 too, can read it without root; the flag needs nothing of the kind. An init service, run as root once sys.boot_completed is 1, exits at once when the flag exists; otherwise it looks at `dumpsys account` then and once an hour after until an account of type com.google appears — a line `Account {name=…, type=com.google}`, not just the type, which `dumpsys account` also prints for Google's account authenticator on every Android with Google's services, signed in or not, and which the first version took for a sign-in (caught by vm-scenario on 2026-10-07) — once an hour at most, by the author's choice, so a sign-in shows within the hour, or at Android's next start — writes the flag — a file, mode 0644, in a directory of its own, mode 0755 — and ends: the looking stops for good once it has seen one sign-in, and costs nothing between, the container being frozen while Android sleeps. Android's /data is the asking user's ~/.local/share/waydroid/data, which anyone may pass through (mode 0771), so the flag is readable as ~/.local/share/waydroid/data/borshevik/google-signed-in by the user it belongs to, whatever their uid. It names no account and holds nothing but itself. It lives in the user's Android data, so a removal, which deletes that, takes it too; signing out of Google later leaves it, as registration does not end with a sign-out. Written by install and upgrade, so an Android signed in before the flag existed gets it on its first boot after the next upgrade."
    functions:
      - id: rendering
        description: "`borshevik-waydroid rendering`, run by any user. Prints `software` when no GPU render node in /dev/dri belongs to a driver Android can render on — every one is the NVIDIA driver's or virtio's — and `hardware` otherwise. Waydroid gets no hardware acceleration from the proprietary NVIDIA driver; and on a virtual machine's virtio GPU without 3D, Android's hardware rendering crashes SurfaceFlinger in a loop and Android never finishes booting (seen in the test machine, @WaydroidApp#vm-scenario). On either, Android can only render in software, and is slow. A hybrid laptop has another render node beside NVIDIA's, which Waydroid takes, so it gets `hardware`. Treating every virtio GPU as unable is the quick answer: a virtual machine with virgl 3D could render in hardware but gets software too, which is slower but works, while telling the two apart reliably is left for later. The one test for this: install acts on it, and the Image Manager's Android tab warns by it (@ImageManagerApp#main-window#android-page), so what the tab says and what install does cannot disagree. The App Manager does not warn — it is where a user picks apps, not where they look after the system."
      - id: install
        description: "`borshevik-waydroid install`. Deletes what a previous install left that `waydroid init -f` keeps — Waydroid's overlays (/var/lib/waydroid/overlay, overlay_rw, overlay_work), where the translation layer was put, and waydroid.cfg, whose [properties] init carries over — then initialises Waydroid afresh (`waydroid init -f`) with the system type of config's approved system image (GAPPS), so running it again over a broken or hand-made install starts clean. The channels passed are control#channel, written from config just before, so init downloads the approved pair and nothing newer; Fedora's waydroid package ships with no default channel, and without one init refuses. init exits 0 even when it fails, so install then requires the system and vendor images to exist and stops otherwise, rather than carry on over an image that is not there. Writes config's `properties` into waydroid.cfg — with its `software_rendering` ones too when control#rendering says `software`, without which Android shows nothing there — and regenerates Android's properties from it (`waydroid upgrade -o`). Puts waydroid0 into firewalld's trusted zone, permanently: Android takes its address and DNS from the dnsmasq Waydroid runs on that bridge, and the default zone blocks DHCP and DNS, which leaves Android without network. Enables and starts waydroid-container.service, which the image disables (@Services#enable-services): Fedora's presets enable it, and it would otherwise run its daemon on every machine, Android or not. Through waydroid-script, for the Android version of the image just installed, installs the ARM translation chosen by the CPU's vendor in /proc/cpuinfo — read in one place, for both the choice and the line that reports it — with no question to the user — libhoudini, Intel's own, on GenuineIntel; libndk_translation, Google's from ChromeOS, on AuthenticAMD, where it is the one that works well, and on any other vendor — printing which it chose and why. Writes control#first-boot, control#theme, control#keylayouts and control#google-watch into the overlay. Enables update#timer — updates are on by default. Puts launcher#android-entry and launcher#apps-entry into /usr/local/share/applications, so Android appears in the app grid only once it is there to open, and launcher#apk-entry beside them, setting the one association that makes it what opens an APK (launcher#apk-association). Writes control#stamp last, then starts theme-sync in the user manager of the user who asked (PKEXEC_UID), if they have one running — their session began before the stamp existed, so its condition kept it from starting; a failure there fails nothing."
      - id: upgrade
        description: "`borshevik-waydroid upgrade`. Brings the installed images to config's approved pair with `waydroid upgrade`, which keeps Android's data and installed apps. First writes control#channel from config and points waydroid.cfg's system_ota and vendor_ota at it — an install made from another channel, ota.waydro.id's included, is moved onto it here — and, for each image whose recorded datetime differs from the approved entry's, resets that datetime to 0: `waydroid upgrade` only ever fetches a build newer than the installed one, and an approved build can be older, when a broken one is withdrawn. Writes config's `properties` into waydroid.cfg again, the `software_rendering` ones as control#rendering decides, so a default changed in a Borshevik update reaches machines installed before it; `waydroid upgrade` regenerates Android's properties from them. Puts launcher#android-entry, launcher#apps-entry and launcher#apk-entry in place again, so a machine installed before an entry existed gets it with its next upgrade, and writes control#first-boot, control#theme and control#google-watch again for the same reason. Writes control#keylayouts again after it, from the image now installed and for the kernel now running, since either may have changed since the last time. When the image's Android version then differs from control#stamp's, installs the translation layer again for the new version and rewrites the stamp — the old one would not load. Either change — the translation layer or the layouts — is followed by `waydroid upgrade -o`, which restarts a running Android once more: `waydroid upgrade` already restarted it, before the change, so without that a running Android would only see it at its next start. Does nothing, successfully, when control#stamp is absent."
      - id: remove
        description: "`borshevik-waydroid remove`. Deletes control#stamp first, so a removal that stops half-way is never taken for an install. Removes launcher#android-entry, launcher#apps-entry and launcher#apk-entry from /usr/local/share/applications and unsets launcher#apk-association, so an APK opens in the archive manager again. Disables update#timer and waydroid-container.service, stopping both, takes waydroid0 out of the trusted zone, and deletes /var/lib/waydroid — the images and everything installed into them — and control#channel. For the user who asked (PKEXEC_UID), also deletes their Android data, ~/.local/share/waydroid, and the app launchers Waydroid wrote for them, ~/.local/share/applications/waydroid.*.desktop; other users' homes are left alone. A theme-sync already running in someone's session keeps running until it ends, waiting for a Waydroid session that never comes; the next session does not start it, the stamp being gone."
      - id: google
        description: "`borshevik-waydroid google`, root, run under pkexec by the Image Manager. Where the asking user's Android (PKEXEC_UID) stands with Google, as two lines: `android_id=<decimal>`, the Google Services Framework ID that Google's registration page for uncertified devices (https://www.google.com/android/uncertified) asks for — the `android_id` row of the `main` table in ~/.local/share/waydroid/data/data/com.google.android.gsf/databases/gservices.db; and `google_account=yes|no`, whether Android holds a Google account — a row of type com.google in the `accounts` table of ~/.local/share/waydroid/data/system_ce/0/accounts_ce.db. Nothing says directly that a device is registered: Google answers no one but the account owner on its own page, and Play Store keeps calling the device uncertified after it, since registering lets it sign in without certifying it. A Google account in Android is the reliable sign — before registration Google refuses the sign-in. Both databases are read on the host through accounts: root because Android's app data belongs to Android's app UIDs, which no host user owns; on the host so Android need not be running or be woken. The ID exists only once Android has started at least once with network and checked in with Google; until then — no database or no row — prints why and exits 3, so the caller can tell 'start Android first' from a failure. The ID changes with every install, which is why registration is per install."
  - id: accounts
    type: "@Script"
    interpreter: python3
    src: build_files/root/usr/libexec/borshevik/borshevik-waydroid-accounts
    description: "Reads Android's Google state from Android's own databases on the host, for control#google, as root. Each database is read from a copy, with its -wal, -shm and -journal files, so one Android is writing to is read whole, and Android need not be running; a copy taken in the middle of a write can come out torn, or a journal vanish while it is copied, so a copy that cannot be read is taken again, up to three times, before the tool says it cannot read the database and exits 1. `android-id <gservices.db>` prints the Google Services Framework ID (the `android_id` row of the `main` table), or exits 3 when there is no database or no row yet. `google-account <accounts_ce.db>` prints `yes` or `no`, whether the `accounts` table holds a row of type com.google, or exits 2 when the file cannot be read. A database Android has created but not yet put its table in counts as holding nothing: no ID yet, no account. control#google takes exit 2 for no account — as root the file is unreadable only while it does not exist yet — and any other failure as its own, never as a `no`. Python, which the image has, using its sqlite3."
  - id: config
    type: "@ConfigFile"
    src: build_files/root/usr/share/borshevik/waydroid/config.json
    description: "Everything Borshevik decides about Android that does not depend on the machine, in one file, so changing it is an edit to data, not to control. `images`: the system and vendor images this release approves, tested together, each an entry copied verbatim from Waydroid's official OTA channel — datetime, filename, id (the zip's SHA-256, which Waydroid checks the download against), romtype, size, url, version; the system entry's romtype (GAPPS) is the system type control passes to init. Why not the official channel: it always serves the newest build, and a new build can be broken — vendor 20260927 brought a display hotplug loop that crashed SurfaceFlinger, in full-UI mode too (waydroid/waydroid#2436), while 20260428 does not. System and vendor are approved separately, since Waydroid ships them as separate images and either can break alone; a new pair reaches users with a Borshevik update, and the next control#upgrade installs it (the approve-images recipe). `properties`: Android properties control writes into the [properties] section of /var/lib/waydroid/waydroid.cfg, from which Waydroid builds waydroid.prop — `waydroid.updater.disabled=true`, which turns off the updater app inside Android (org.lineageos.waydroidupdater): it compares the official channel with the images actually running and would offer its newest builds behind the approved pair's back, ignoring a metered connection that update#service respects; Waydroid sets the same property itself when a distribution ships the images. `persist.waydroid.multi_windows=true`: each Android app in a window of its own in the GNOME session. `persist.waydroid.uevent=true` and `persist.waydroid.udev=true`: Android hears the kernel's device events and is given the host's input devices, without which a game controller never reaches it — Android sees only the keyboard, pointer and touch Waydroid forwards over Wayland. Off in Waydroid by default to keep Android sandboxed from the host's devices; on here, as in Bazzite, because games are among what Android is for. A controller is then read by Android directly, so it reaches Android even while no Android window has focus, and needs the right key layout (control#keylayouts). A controller connected before Android starts may go unseen; one connected after is. A persist property set this way is a default — a value the user sets with `waydroid prop set` is kept in Android's data and wins. `android_settings`: Android settings by namespace (secure, system, global), applied once on Android's first boot by control#first-boot — `secure show_ime_with_hard_keyboard=0`, so a physical keyboard is used without the on-screen one popping up over every text field, the setting Waydroid's own documentation advises (Settings › System › Languages & input › Physical keyboard › Use on-screen keyboard); turning the keyboard itself off instead would lose the spell checker (waydroid/waydroid#789). `software_rendering`: the properties control#rendering's `software` answer adds — `ro.hardware.gralloc=default`, `ro.hardware.egl=swiftshader`. Left at Waydroid's defaults on purpose, so absent here: the container freezing when Android sleeps (suspend_action, persist.waydroid.suspend), which saves battery at the cost of a sleeping Android not receiving messages; auto_adb, off."
  - id: waydroid-script
    type: "@ShellScript"
    src: build_files/scripts/install-waydroid-script.sh
    description: Puts casualsnek/waydroid_script into the image, which is what control#install and control#upgrade install the ARM translation layer with — nothing else of what it offers is used.
    functions:
      - id: run
        description: Fetches waydroid_script at the commit pinned in the script into /usr/lib/borshevik/waydroid_script, with its Python requirements in a virtual environment beside it, so nothing is cloned or pip-installed on a user's machine and the version users run is the one that was tested. Pinned rather than following its main branch because it patches files into the Android image as root. The script holds no Android binaries itself; what it installs it downloads when run. Run at image build time from @ImageBuild#build-addons.
  - id: update
    type: "@Singleton"
    description: Keeps the installed Android images on the pair the booted Borshevik approves (config) without anyone asking, as rpm-ostreed-automatic does for the OS image. Off in the image and switched on by control#install, since there is nothing to update before Android is installed; the Image Manager's Android tab turns it off and on again.
    components:
      - id: service
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/system/borshevik-waydroid-update.service
        unit_type: service
        scope: system
        triggers: update#timer
        executes: /usr/libexec/borshevik/borshevik-waydroid upgrade
        description: "Oneshot service, conditioned on control#stamp existing, so a timer left enabled without Android does nothing. Two ExecCondition checks keep it from running when it should not, so a skipped run is a condition, not a failure. The first is the one rpm-ostreed-automatic.service carries, word for word: NetworkManager's Metered property must be 2 or 4 (no, guessed no), so a metered or unknown connection never downloads images of some 1.4 GB. The second skips while any user has a Waydroid session running, since upgrading restarts the container under them; the next firing tries again. Exit status 4, control refusing because another operation holds control#busy, counts as success (SuccessExitStatus), for the same reason."
      - id: timer
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/system/borshevik-waydroid-update.timer
        unit_type: timer
        scope: system
        triggers: daily with a randomised delay; Persistent, so a day missed while the machine was off is made up at the next boot
        executes: ''
        description: Fires update#service. Not enabled by the image (see control#install).
  - id: launcher
    type: "@Singleton"
    description: "Android's place in the app grid. The waydroid package brings entries of its own that show from the moment the image is installed, and its main one, opened before Waydroid is set up, offers Waydroid's own setup — which would install no translation layer, write no control#stamp and enable no updates. So that entry is hidden, and Borshevik's Android entry exists only while Android is installed: a desktop entry cannot be shown conditionally, so control#install copies it into /usr/local/share/applications (/var/usrlocal on rpm-ostree, writable and on the default XDG data path) and control#remove deletes it. With no entry before installing, nothing in the grid leads anywhere but the two apps that install Android. The same holds for APK files: what opens them is apk-installer only while Android is installed, and the archive manager otherwise, as Fedora sets it."
    components:
      - id: android-entry
        type: "@ConfigFile"
        src: build_files/root/usr/share/borshevik/waydroid/borshevik-android.desktop
        description: The Android entry — named Android, opening Android's full interface with `waydroid show-full-ui`, which starts a session when none runs, with a Stop Android action (`waydroid session stop`) taken over from the package's hidden entry. Kept in the image only as the file control#install copies. Its categories are System and Emulator, and the System folder excludes it by file name, so it shows in the Android folder alone (@ShellCustomizations#defaults).
      - id: apps-entry
        type: "@ConfigFile"
        src:
          - build_files/root/usr/share/borshevik/waydroid/borshevik-android-apps.desktop
          - build_files/root/usr/share/borshevik/waydroid/android-settings.png
        description: "Android Apps — Android's own list of its apps (`waydroid app intent android.settings.MANAGE_APPLICATIONS_SETTINGS`, with the empty URI the command requires), where an app is opened, stopped, updated or uninstalled; the way to uninstall an Android app without a menu of Borshevik's own, since Waydroid writes its apps' launchers itself and they offer only App Settings. Starts a session when none runs. The first time Settings opens after Android starts, Android 13's two-pane Settings on a wide screen gives it two windows, its home beside the list; later ones open one, and the two-pane mode is left on. Its icon is Android's own Settings icon, as Waydroid renders it for its launchers (LineageOS, Apache 2.0), kept in the image and named by its absolute path, as Waydroid names its launchers' icons, so no icon theme is involved; it is in the image for good, the entry only while Android is installed. Category Settings, so the System folder excludes it by file name and the Android folder names it (@ShellCustomizations#defaults)."
      - id: apk-entry
        type: "@ConfigFile"
        src:
          - build_files/root/usr/share/borshevik/waydroid/borshevik-apk-install.desktop
        description: "'Install in Android', the entry that opens an APK with apk-installer — hidden from the grid, offered in Open With. Kept in the image only as the file control#install copies into /usr/local/share/applications."
      - id: apk-association
        type: "line `application/vnd.android.package-archive=borshevik-apk-install.desktop` under [Default Applications] in /usr/local/share/applications/mimeapps.list"
        description: "What makes apk-entry the default for APKs while Android is installed. /usr/local/share/applications comes before /usr/share on the XDG data path, so its mimeapps.list wins over the one in /usr/share/applications that gives APKs to the archive manager. control sets and unsets only this line and leaves everything else in the file as it found it — an administrator's own system-wide defaults included, and an APK default of their own under [Default Applications], which set then leaves in place — an APK line under [Added Associations] or [Removed Associations] only offers or hides an application and changes nothing here — so APKs keep opening the way the administrator chose; the file is created when missing, deleted when unsetting the line leaves nothing in it but its section header, a [Default Applications] section left empty by unsetting is taken out with its header, rewritten only when its content changes and then through a new file put in its place, so an interrupted write never leaves it half written, and read and written byte for byte whatever its encoding, the line it adds ending the way the file's lines end (CRLF included) and the file ending with or without a newline as it did, so setting and then unsetting the line gives back the file as it was. Failing to change it is reported and stops nothing: install and remove carry on, since a file someone else may have broken must not leave Android half installed or half removed. Until 2026-10-07 control copied a whole file there and deleted it on remove, which would have taken anyone else's defaults with it."
      - id: hidden-package-entries
        type: "@ConfigFile"
        src:
          - build_files/root/usr/share/applications/Waydroid.desktop
          - build_files/root/usr/share/applications/waydroid.app.install.desktop
        description: "The package's entries, replaced under the same names. Its one visible entry, Waydroid.desktop, gets NoDisplay, keeping it out of the grid; the market protocol handler is NoDisplay in the package already and left as it is. Its APK installer, 'Install in Waydroid', loses its MimeType, so Open With offers no installer before Android is installed and only apk-installer after: the package's runs `waydroid app install` at once, with no question, and does nothing at all when no session runs or Android is still starting. Copied over the package's files by the final layer's COPY, which runs after the base layer installed them."
  - id: apk-installer
    type: "@View"
    src:
      - build_files/root/usr/share/borshevik/waydroid/apk-installer/main.js
      - build_files/root/usr/share/borshevik/waydroid/apk-installer/install.js
      - build_files/root/usr/bin/borshevik-apk-install
    description: "What opens an APK once Android is installed (launcher#apk-entry): a small window of its own, one per file (GApplication NON_UNIQUE), that asks before anything happens. It reads the APK first and asks 'Install <package> in Android?' — or 'Update', when Android already has that package — with the file's name, size and version, Cancel and Install. Once confirmed it shows what it is doing — starting Android, waiting for it, installing — and then the outcome: installed, with the app's own icon — the one Waydroid writes for its launcher — and Open, which launches the app (`waydroid app launch`) and closes the window; or what went wrong. A session it started stays running, since the next thing a user does is open the app. Run as the user, without privileges, like the rest of Android's apps; refuses, saying so, when control#stamp is absent — a file opened from elsewhere — or the file is not an APK. Strings in en, ru, uk, ka, hy and be, held in main.js."
    functions:
      - id: readApk
        description: "The package name and version an APK declares, read from its AndroidManifest.xml — Android's binary XML, inside the zip — by a short Python program, Python being in the image and nothing that reads APKs being there. Throws when the file is not a zip or holds no manifest with a package, which is how a file that is not an APK is told apart."
      - id: installApk
        description: "Installs an APK into Android, reporting each stage to a callback. Starts a session when none runs and waits for it to report itself running, then — whether it started one or found one — for Android to finish booting (`sys.boot_completed` reading 1, up to three minutes): a session reports itself running while Android is still starting, and `waydroid app install` then does nothing and says nothing. Wakes Android when it sleeps — its container frozen — through the container service's Unfreeze, which any user may call: `waydroid app install` wakes a frozen Android only for its own call and freezes it again at once, while Android installs the package after the call returns, so on a sleeping Android the install never finished (seen 2026-10-04). Then `waydroid app install`, which returns at once and does not fail when Android refuses a package, so for a package Android did not have it waits up to three minutes for it to appear in `waydroid app list`, waking Android again should it fall asleep meanwhile, and fails, with that reason, when it does not — a wrong architecture or a signature clash. Three, because Google Play Protect may stop an app built for an old Android and ask in Android's own window whether to go on, and the user needs the time to answer; the waiting stage says Android may ask. For a new package the command's own result is not trusted either way: Android may take a package the command reported failing, so it waits for the list all the same, and fails with what the command said. An update cannot be seen in that list, so it counts as done when the command succeeded and fails at once, with what it said, when it did not. Android refusing an update — an older version, another signature — is not seen, since the command does not fail for it."
  - id: theme-sync
    type: "@ShellScript"
    src:
      - build_files/root/usr/libexec/borshevik/borshevik-android-theme
      - build_files/root/usr/lib/systemd/user/borshevik-android-theme.service
    description: "Keeps Android's colours those of GNOME: its accent colour (org.gnome.desktop.interface accent-color) as Android's Material You colour, and its style (color-scheme, prefer-dark or not) as Android's dark theme. A small GJS program, run as a user service in every GNOME session of a machine where Android is installed (the unit's condition is control#stamp), and also started by control#install for the user who installed it, whose session began before the stamp existed. It follows both settings and Waydroid's session — the session bus name id.waydro.Session, which `waydroid session start` owns — and whenever either changes while a session is there, hands Android `<rrggbb> <dark|light>` as persist.borshevik.theme with `waydroid prop set`, which any user may run and which waits by itself for Android to finish starting; control#theme applies it inside Android. Everything is by signal: nothing runs while neither changes. A newer value replaces a hand-over still waiting, so only the latest reaches Android. The colours are libadwaita's accent colours as GNOME shows them, kept in the program. Android's colours follow GNOME's and are not merged with a choice made inside Android: one made there lasts until the next change in GNOME or Android's next start. Needs no password: neither the property nor the init service asks the host for anything."
  - id: vm-scenario
    type: "@ShellScript"
    src:
      - tests/scenarios/android/guest.sh
      - tests/scenarios/android/paths
    description: "The android scenario of @BorshevikWorkflow#scenarios: everything about Android a machine with no one at it can show, run in the test machine whenever a change touches a file in its `paths` — this term's files, and the files of the two apps' Android parts. It exercises control as both apps call it, the App Manager's way (@AppManagerApp#modules) and the Image Manager's (control directly), through a whole install, remove, install cycle, and runs the apps' own Android modules rather than copies of their logic. What it cannot show is how Android looks and responds on real graphics, and the apps' windows are not clicked through. The machine's GPU is virtio without 3D, on which Android's hardware rendering — what control#rendering picks for it, the GPU not being NVIDIA's — crashes SurfaceFlinger in a loop, so Android never finishes booting (found 2026-10-02: surfaceflinger `restarting`, system_server restarting every 30 seconds; switched to software rendering, it booted in 12 seconds). That is why control#rendering counts a virtio GPU as unable to render: install itself switches Android to software rendering in this machine, as it would for a user running Borshevik in a virtual machine, so the scenario exercises the software path as it ships, and checks that install set it."
    functions:
      - id: run
        description: "In order, each a check of its own: (1) a machine without Android — no control#stamp, update#timer and waydroid-container.service disabled and inactive, no Android entry in /usr/local/share/applications, the package's Waydroid entry hidden, waydroid-script's venv importing its requirements, control#rendering answering — after which the scenario puts a default of someone else's into /usr/local/share/applications/mimeapps.list, which every later step must leave there; (2) @AppManagerApp#modules#run refusing an unknown module with nothing done; (3) `borshevik-modules prepare android`, as the App Manager runs it after the password, printing `::module android` and `::result android ok` and exiting 0; (4) what install leaves — the stamp holding 11 or 13, the container service enabled and active, the timer enabled, waydroid0 in the trusted zone, the Android entry and launcher#apps-entry in place, launcher#apk-entry beside it and launcher#apk-association set, with apk-installer what tester's session opens an APK with and the other default in mimeapps.list kept, the translation layer the CPU's vendor calls for registered as Android's native bridge, nothing of microG in the overlay, waydroid.cfg's channels pointing at control#channel with both recorded datetimes equal to config's approved entries', config's `properties` in waydroid.cfg's [properties] — and, since control#rendering answers `software` on the machine's virtio GPU, its `software_rendering` ones too — control#first-boot and control#google-watch in the overlay, control#keylayouts holding the DualSense's layout with no `requires_kernel_config` line, the test machine's Fedora kernel building hid-playstation, and control#busy holding the record of an ended operation rather than one running; (5) the Image Manager's waydroid.js under gjs — isInstalled, readImage and checkForUpdate answering without error, checkForUpdate finding nothing to update right after install, and signedInLocally answering false before Android has ever started, with accounts answering for no database as it is meant to — 3 from `android-id`, 2 from `google-account`; (6) apk-installer's install.js under gjs as tester, with an APK the scenario downloads itself — F-Droid's client at a pinned version, checked against its SHA-256: readApk naming its package, installApk installing it, which starts the session itself, and the package then in `waydroid app list`, and refusing a file that is not an APK; the session stopped afterwards; (7) update#service skipped by its exec-condition while tester has a session running — and, in that session once Android has booted — the session restarted once, and the report saying so, when Android has not booted within three minutes: Waydroid's hwcomposer sometimes aborts at start ('Binder threadpool cannot be shrunk after starting', waydroid/waydroid#2085, in every recent vendor image) and, on the test machine, came back without registering, leaving SurfaceFlinger waiting for good (seen 2026-10-02, three sessions started within a minute); a second failure is a FAIL — config's `properties` among Android's running properties, its `android_settings` applied by control#first-boot, theme-sync — started by hand, tester's session having begun before Android was installed — making Android blue and dark for GNOME's blue and prefer-dark, then teal and light when the two change while Android runs (the Material You setting and `cmd uimode night`, read inside Android; tester's own two values put back after), Google Play Services and the Play Store among Android's packages, the GAPPS image's, and control#google printing a decimal ID and `google_account=no` or, Android not having checked in with Google within two minutes, exiting 3, and control#google-watch running inside Android with no flag written, the test machine having no Google account — and run or skipped by the metered condition, as the machine's connection decides, once none runs; (8) control#upgrade exiting 4, having changed nothing, while the scenario itself holds control#busy's lock; then exiting 0 with the stamp still valid — run once as it is, and once after the vendor datetime in waydroid.cfg is set to a build other than the approved one, as on a machine installed from another channel, after which it is the approved one again; (9) control#remove, as the Image Manager runs it for tester (PKEXEC_UID), leaving no stamp, no /var/lib/waydroid, no control#channel, no Android entry, no launcher#apps-entry, no launcher#apk-entry and launcher#apk-association unset, with the other default still in mimeapps.list and APKs back with the archive manager, the timer and container disabled, waydroid0 out of the trusted zone, and no ~/.local/share/waydroid for tester; (10) control#install run directly, as the Image Manager runs it, bringing everything in (4) back; (11) no failed system unit after all of it. Finally opens Android's full interface for tester, so the screenshot taken after the scenario shows what the virtual GPU made of it, which it can because @BorshevikWorkflow#test-image-in-vm keeps tester's screen on."
tests:
  - id: static-checks
    description: The scripts parse and the units and desktop entries are well-formed — what @BorshevikWorkflow#validate checks for the whole repository.
    command: bash tests/validate.sh
    expect: exits 0 and prints 'all checks pass'
  - id: in-vm
    description: vm-scenario, run in the test machine on an image that carries the change — selected by itself whenever the change touches its paths.
    command: tests/test-image-in-vm.sh run --scenarios android
    expect: the report's `== scenario android` section ends with 'all checks pass'
  - id: tried-by-the-author
    description: "Manual, on the author's own machine running an image that carries the change, for what in-vm cannot show: the Android tab clicked through — Install, the password prompt, the registration ID shown and the device registered with Google through it, Remove — Android drawing on real graphics, signing in to Google Play, an ARM-only app from Play opening, a push notification arriving while Android is awake, and a game controller connected after Android started working in a game that supports one."
    command: the author on their own machine (the `testing` step)
    expect: the author confirms Android installs, Play accepts the registered device, an ARM app runs, push arrives, a controller works in a game, and Android upgrades and removes cleanly; no failed units on a machine where Android is not installed
recipes:
  - id: approve-images
    description: Moves config's approved images to another system or vendor build — a newer one, or an older one when the approved build turns out broken.
    instructions:
      - Fetch Waydroid's official channel for the image in question — https://ota.waydro.id/system/lineage/waydroid_x86_64/GAPPS.json or https://ota.waydro.id/vendor/waydroid_x86_64/MAINLINE.json — and pick the build; check Waydroid's open issues for reports against it first
      - Replace that image's entry under config's `images` with the build's entry, copied verbatim, so its `id` stays the checksum Waydroid verifies the download against
      - "Carry it through @BorshevikWorkflow like any change: the files are in the android scenario's paths, so @WaydroidApp#tests#in-vm runs by itself, and the author tries it on their own machine (@WaydroidApp#tests#tried-by-the-author), where the next control#upgrade moves Android onto the new pair"
