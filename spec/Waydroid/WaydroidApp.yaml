description: "Waydroid as integrated in Borshevik — LineageOS in an LXC container sharing the host kernel, its apps shown as windows of the GNOME session. Only the waydroid RPM ships in the image, layered in the base layer by @ImageBuild#install-rpm-packages; nothing else of Android exists on a machine until a user installs it — from the Image Manager's Android tab (@ImageManagerApp#main-window#android-page), or by choosing an Android app in the App Manager (@AppManagerApp#android-service). Both run control#install and show its progress — the Image Manager directly, the App Manager through its module dispatcher (@AppManagerApp#modules); neither hands the user over to the other. Installing downloads Waydroid's GAPPS Android image, some 1.4 GB with its vendor image, into /var/lib/waydroid: LineageOS with Google Play Services and the Google Play Store, so apps install from Play and those relying on push, Google sign-in or Google's APIs work. Into it goes an ARM translation layer, because most apps on Google Play are built for ARM only. Neither is built into the Borshevik image: the GAPPS image comes from Waydroid's mirrors, and the translation layer is fetched on the user's machine by waydroid_script at install time — Google's libndk_translation from ChromeOS and Intel's libhoudini are proprietary and may not be redistributed. Google lets an Android build it has not certified into Play only once the user has registered the device's Google Services Framework ID under their own Google account — a step for each install, which no one can do for them (control#google). GAPPS rather than microG on a VANILLA image: Waydroid builds and ships GAPPS itself, its Google services keep themselves current, while microG reaches Waydroid only through third-party scripts and, with no signature spoofing in Waydroid's images, apps refuse it (tried 2026-10-02: push never registered, WhatsApp rejected the Play Store's signature). Which Android images a machine runs is decided by the Borshevik image it booted, not by Waydroid: each release carries the system and vendor images it approves (config), and the images themselves — too large to build in — are downloaded from Waydroid's mirrors and installed by Android's own timer apart from the OS update, so a new pair arrives with a Borshevik update and a rollback of Borshevik brings back the pair the older release approved. Nothing inside Android updates it (config's `properties`). Whether Android is installed is decided everywhere — the Image Manager's tab, the App Manager, the update service — by control#stamp, not by /var/lib/waydroid existing, so a half-finished install or a Waydroid initialised by hand is never taken for a working one."
src: build_files/root/usr/libexec/borshevik/borshevik-waydroid
platform: bash / systemd
extends: "@Software"
components:
  - id: control
    type: "@ShellScript"
    src: build_files/root/usr/libexec/borshevik/borshevik-waydroid
    description: "Everything that changes Android on the machine, as one script with a subcommand per action, which both apps and the update service call directly: one thing to authorise, and one place where installing, updating and removing are kept consistent with each other, so the Image Manager and the App Manager cannot install Android two different ways. Run under pkexec by @ImageManagerApp#waydroid, as root by @AppManagerApp#modules — the App Manager's single privileged entry point, which installs every module a run needs under one password — and by update#service. Every subcommand but `rendering` refuses to run unless root, and install, upgrade and remove run one at a time (control#busy). Prints what it is doing line by line, for whichever window shows its progress, and exits non-zero on any failure — but never with 126 or 127, the statuses pkexec returns when the password is refused, so a caller can tell a user who cancelled from an install that broke (@AppManagerApp#window#_prepareKinds acts on the difference, through @AppManagerApp#modules, which keeps to the same rule)."
    fields:
      - id: stamp
        type: file /var/lib/borshevik/waydroid-installed, holding the Android version (e.g. 13) the translation layer was installed for
        description: The one meaning of 'Android is installed'. Written by install as its very last step and deleted by remove as its first, so its presence always means a finished install; readable by every user, which is how the Image Manager and the App Manager see it without privileges. The version inside is what upgrade compares against, because the translation layer is built for one Android version.
      - id: channel
        type: directory /var/lib/borshevik/waydroid-ota, holding system/lineage/waydroid_x86_64/<romtype>.json and vendor/waydroid_x86_64/MAINLINE.json
        description: An OTA channel of Waydroid's own format listing only config's approved images, one entry each, which control writes from config before every init and upgrade and hands Waydroid as file:///var/lib/borshevik/waydroid-ota/system and …/vendor. Waydroid reads it exactly as it reads ota.waydro.id — its downloader is urllib, which opens file URLs, and init builds the files' paths from the channel itself — so `waydroid init` and `waydroid upgrade` can fetch nothing but the approved pair, verify it and install it the way they always do, and the zips still come from Waydroid's own mirrors. Written, not shipped, so config stays the one file to edit.
      - id: busy
        type: file /run/borshevik/waydroid-busy, holding `<operation> <pid>` (install, upgrade or remove) under an flock that process holds, empty otherwise
        description: "That an operation is changing Android right now, and which. install, upgrade and remove take the lock before doing anything and refuse at once, exiting 4 with a message, when another holds it — so an install the App Manager started and one the Image Manager's button would start, or an upgrade the timer fires during a removal, can never run over each other. The file is emptied, not removed, when the operation ends — removing it would let a process that had just opened the old file lock it beside one creating a new file — and a reader that finds an operation in it checks that the pid is alive, so one left behind by a crash is not taken for an operation still running. In /run, so a reboot clears it. Readable by every user: the Image Manager's Android tab shows by it that Android is being installed, updated or removed, which control#stamp alone cannot tell — install deletes the stamp first and writes it last."
      - id: first-boot
        type: files /var/lib/waydroid/overlay/system/etc/init/borshevik.rc and /var/lib/waydroid/overlay/system/etc/borshevik-defaults.sh
        description: "Applies config's `android_settings` inside Android once, the first time it finishes booting: Android's own settings live in its user data, which exists only after a first boot, so they cannot be set from the host the way properties are. install writes both into Waydroid's system overlay, which Android sees as part of /system: an init service, run as root once sys.boot_completed is 1, runs the script, which puts each setting with `settings put <namespace> <key> <value>` unless persist.borshevik.defaults is already 1, and then sets it to 1. So the settings are defaults — one the user changes afterwards stays changed — and a new install, whose data starts empty, gets them again."
    functions:
      - id: rendering
        description: "`borshevik-waydroid rendering`, run by any user. Prints `software` when no GPU render node in /dev/dri belongs to a driver Android can render on — every one is the NVIDIA driver's or virtio's — and `hardware` otherwise. Waydroid gets no hardware acceleration from the proprietary NVIDIA driver; and on a virtual machine's virtio GPU without 3D, Android's hardware rendering crashes SurfaceFlinger in a loop and Android never finishes booting (seen in the test machine, @WaydroidApp#vm-scenario). On either, Android can only render in software, and is slow. A hybrid laptop has another render node beside NVIDIA's, which Waydroid takes, so it gets `hardware`. Treating every virtio GPU as unable is the quick answer: a virtual machine with virgl 3D could render in hardware but gets software too, which is slower but works, while telling the two apart reliably is left for later. The one test for this: install acts on it, and the Image Manager's Android tab warns by it (@ImageManagerApp#main-window#android-page), so what the tab says and what install does cannot disagree. The App Manager does not warn — it is where a user picks apps, not where they look after the system."
      - id: install
        description: "`borshevik-waydroid install`. Deletes what a previous install left that `waydroid init -f` keeps — Waydroid's overlays (/var/lib/waydroid/overlay, overlay_rw, overlay_work), where the translation layer was put, and waydroid.cfg, whose [properties] init carries over — then initialises Waydroid afresh (`waydroid init -f`) with the system type of config's approved system image (GAPPS), so running it again over a broken or hand-made install starts clean. The channels passed are control#channel, written from config just before, so init downloads the approved pair and nothing newer; Fedora's waydroid package ships with no default channel, and without one init refuses. init exits 0 even when it fails, so install then requires the system and vendor images to exist and stops otherwise, rather than carry on over an image that is not there. Writes config's `properties` into waydroid.cfg — with its `software_rendering` ones too when control#rendering says `software`, without which Android shows nothing there — and regenerates Android's properties from it (`waydroid upgrade -o`). Puts waydroid0 into firewalld's trusted zone, permanently: Android takes its address and DNS from the dnsmasq Waydroid runs on that bridge, and the default zone blocks DHCP and DNS, which leaves Android without network. Enables and starts waydroid-container.service, which the image disables (@Services#enable-services): Fedora's presets enable it, and it would otherwise run its daemon on every machine, Android or not. Through waydroid-script, for the Android version of the image just installed, installs the ARM translation chosen by the CPU's vendor in /proc/cpuinfo, with no question to the user — libhoudini, Intel's own, on GenuineIntel; libndk_translation, Google's from ChromeOS, on AuthenticAMD, where it is the one that works well, and on any other vendor — printing which it chose and why. Writes control#first-boot into the overlay. Enables update#timer — updates are on by default. Puts launcher#android-entry into /usr/local/share/applications, so Android appears in the app grid only once it is there to open. Writes control#stamp last."
      - id: upgrade
        description: "`borshevik-waydroid upgrade`. Brings the installed images to config's approved pair with `waydroid upgrade`, which keeps Android's data and installed apps. First writes control#channel from config and points waydroid.cfg's system_ota and vendor_ota at it — an install made from another channel, ota.waydro.id's included, is moved onto it here — and, for each image whose recorded datetime differs from the approved entry's, resets that datetime to 0: `waydroid upgrade` only ever fetches a build newer than the installed one, and an approved build can be older, when a broken one is withdrawn. Writes config's `properties` into waydroid.cfg again, the `software_rendering` ones as control#rendering decides, so a default changed in a Borshevik update reaches machines installed before it; `waydroid upgrade` regenerates Android's properties from them. When the image's Android version then differs from control#stamp's, installs the translation layer again for the new version and rewrites the stamp — the old one would not load. Does nothing, successfully, when control#stamp is absent."
      - id: remove
        description: "`borshevik-waydroid remove`. Deletes control#stamp first, so a removal that stops half-way is never taken for an install. Removes launcher#android-entry from /usr/local/share/applications. Disables update#timer and waydroid-container.service, stopping both, takes waydroid0 out of the trusted zone, and deletes /var/lib/waydroid — the images and everything installed into them — and control#channel. For the user who asked (PKEXEC_UID), also deletes their Android data, ~/.local/share/waydroid, and the app launchers Waydroid wrote for them, ~/.local/share/applications/waydroid.*.desktop; other users' homes are left alone."
      - id: google
        description: "`borshevik-waydroid google`, root, run under pkexec by the Image Manager. Where the asking user's Android (PKEXEC_UID) stands with Google, as two lines: `android_id=<decimal>`, the Google Services Framework ID that Google's registration page for uncertified devices (https://www.google.com/android/uncertified) asks for — the `android_id` row of the `main` table in ~/.local/share/waydroid/data/data/com.google.android.gsf/databases/gservices.db; and `google_account=yes|no`, whether Android holds a Google account — a row of type com.google in the `accounts` table of ~/.local/share/waydroid/data/system_ce/0/accounts_ce.db. Nothing says directly that a device is registered: Google answers no one but the account owner on its own page, and Play Store keeps calling the device uncertified after it, since registering lets it sign in without certifying it. A Google account in Android is the reliable sign — before registration Google refuses the sign-in. Both databases are read on the host, from copies so a database Android is writing to is read whole: root because Android's app data belongs to Android's app UIDs, which no host user owns; on the host so Android need not be running or be woken. The ID exists only once Android has started at least once with network and checked in with Google; until then — no database or no row — prints why and exits 3, so the caller can tell 'start Android first' from a failure. The ID changes with every install, which is why registration is per install."
  - id: config
    type: "@ConfigFile"
    src: build_files/root/usr/share/borshevik/waydroid/config.json
    description: "Everything Borshevik decides about Android that does not depend on the machine, in one file, so changing it is an edit to data, not to control. `images`: the system and vendor images this release approves, tested together, each an entry copied verbatim from Waydroid's official OTA channel — datetime, filename, id (the zip's SHA-256, which Waydroid checks the download against), romtype, size, url, version; the system entry's romtype (GAPPS) is the system type control passes to init. Why not the official channel: it always serves the newest build, and a new build can be broken — vendor 20260927 brought a display hotplug loop that crashed SurfaceFlinger, in full-UI mode too (waydroid/waydroid#2436), while 20260428 does not. System and vendor are approved separately, since Waydroid ships them as separate images and either can break alone; a new pair reaches users with a Borshevik update, and the next control#upgrade installs it (the approve-images recipe). `properties`: Android properties control writes into the [properties] section of /var/lib/waydroid/waydroid.cfg, from which Waydroid builds waydroid.prop — `waydroid.updater.disabled=true`, which turns off the updater app inside Android (org.lineageos.waydroidupdater): it compares the official channel with the images actually running and would offer its newest builds behind the approved pair's back, ignoring a metered connection that update#service respects; Waydroid sets the same property itself when a distribution ships the images. `persist.waydroid.multi_windows=true`: each Android app in a window of its own in the GNOME session. A persist property set this way is a default — a value the user sets with `waydroid prop set` is kept in Android's data and wins. `android_settings`: Android settings by namespace (secure, system, global), applied once on Android's first boot by control#first-boot — `secure show_ime_with_hard_keyboard=0`, so a physical keyboard is used without the on-screen one popping up over every text field, the setting Waydroid's own documentation advises (Settings › System › Languages & input › Physical keyboard › Use on-screen keyboard); turning the keyboard itself off instead would lose the spell checker (waydroid/waydroid#789). `software_rendering`: the properties control#rendering's `software` answer adds — `ro.hardware.gralloc=default`, `ro.hardware.egl=swiftshader`. Left at Waydroid's defaults on purpose, so absent here: the container freezing when Android sleeps (suspend_action, persist.waydroid.suspend), which saves battery at the cost of a sleeping Android not receiving messages; auto_adb, off."
  - id: waydroid-script
    type: "@ShellScript"
    src: build_files/scripts/install-waydroid-script.sh
    description: Puts casualsnek/waydroid_script into the image, which is what control#install and control#upgrade install the ARM translation layer with — nothing else of what it offers is used.
    functions:
      - id: run
        description: Fetches waydroid_script at the commit pinned in the script into /usr/lib/borshevik/waydroid_script, with its Python requirements in a virtual environment beside it, so nothing is cloned or pip-installed on a user's machine and the version users run is the one that was tested. Pinned rather than following its main branch because it patches files into the Android image as root. The script holds no Android binaries itself; what it installs it downloads when run. Run at image build time from @ImageBuild#build-addons.
  - id: update
    type: "@Singleton"
    description: Keeps the installed Android images on the pair the booted Borshevik approves (config) without anyone asking, as rpm-ostreed-automatic does for the OS image. Off in the image and switched on by control#install, since there is nothing to update before Android is installed; the Image Manager's Android tab turns it off and on again.
    components:
      - id: service
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/system/borshevik-waydroid-update.service
        unit_type: service
        scope: system
        triggers: update#timer
        executes: /usr/libexec/borshevik/borshevik-waydroid upgrade
        description: "Oneshot service, conditioned on control#stamp existing, so a timer left enabled without Android does nothing. Two ExecCondition checks keep it from running when it should not, so a skipped run is a condition, not a failure. The first is the one rpm-ostreed-automatic.service carries, word for word: NetworkManager's Metered property must be 2 or 4 (no, guessed no), so a metered or unknown connection never downloads images of some 1.4 GB. The second skips while any user has a Waydroid session running, since upgrading restarts the container under them; the next firing tries again. Exit status 4, control refusing because another operation holds control#busy, counts as success (SuccessExitStatus), for the same reason."
      - id: timer
        type: "@SystemdUnit"
        src: build_files/root/usr/lib/systemd/system/borshevik-waydroid-update.timer
        unit_type: timer
        scope: system
        triggers: daily with a randomised delay; Persistent, so a day missed while the machine was off is made up at the next boot
        executes: ''
        description: Fires update#service. Not enabled by the image (see control#install).
  - id: launcher
    type: "@Singleton"
    description: "Android's place in the app grid. The waydroid package brings entries of its own that show from the moment the image is installed, and its main one, opened before Waydroid is set up, offers Waydroid's own setup — which would install no translation layer, write no control#stamp and enable no updates. So that entry is hidden, and Borshevik's Android entry exists only while Android is installed: a desktop entry cannot be shown conditionally, so control#install copies it into /usr/local/share/applications (/var/usrlocal on rpm-ostree, writable and on the default XDG data path) and control#remove deletes it. With no entry before installing, nothing in the grid leads anywhere but the two apps that install Android."
    components:
      - id: android-entry
        type: "@ConfigFile"
        src: build_files/root/usr/share/borshevik/waydroid/borshevik-android.desktop
        description: The Android entry — named Android, opening Android's full interface with `waydroid show-full-ui`, which starts a session when none runs, with a Stop Android action (`waydroid session stop`) taken over from the package's hidden entry. Kept in the image only as the file control#install copies. Its categories are System and Emulator, and the System folder excludes it by file name, so it shows in the Android folder alone (@ShellCustomizations#defaults).
      - id: hidden-package-entries
        type: "@ConfigFile"
        src: build_files/root/usr/share/applications/Waydroid.desktop
          - build_files/root/usr/share/applications/Waydroid.desktop
          - build_files/root/usr/share/applications/waydroid.market.desktop
        description: The package's one visible entry, Waydroid.desktop, replaced under the same name with NoDisplay, keeping it out of the grid; its other entries (the market protocol handler and the APK installer) are NoDisplay in the package already. Copied over the package's file by the final layer's COPY, which runs after the base layer installed it.
  - id: vm-scenario
    type: "@ShellScript"
    src:
      - tests/scenarios/android/guest.sh
      - tests/scenarios/android/paths
    description: "The android scenario of @BorshevikWorkflow#scenarios: everything about Android a machine with no one at it can show, run in the test machine whenever a change touches a file in its `paths` — this term's files, and the files of the two apps' Android parts. It exercises control as both apps call it, the App Manager's way (@AppManagerApp#modules, then @AppManagerApp#android-service under tester) and the Image Manager's (control directly), through a whole install, remove, install cycle, and runs the apps' own Android modules rather than copies of their logic. What it cannot show is how Android looks and responds on real graphics, and the apps' windows are not clicked through. The machine's GPU is virtio without 3D, on which Android's hardware rendering — what control#rendering picks for it, the GPU not being NVIDIA's — crashes SurfaceFlinger in a loop, so Android never finishes booting (found 2026-10-02: surfaceflinger `restarting`, system_server restarting every 30 seconds; switched to software rendering, it booted in 12 seconds). That is why control#rendering counts a virtio GPU as unable to render: install itself switches Android to software rendering in this machine, as it would for a user running Borshevik in a virtual machine, so the scenario exercises the software path as it ships, and checks that install set it."
    functions:
      - id: run
        description: "In order, each a check of its own: (1) a machine without Android — no control#stamp, update#timer and waydroid-container.service disabled and inactive, no Android entry in /usr/local/share/applications, the package's Waydroid entry hidden, waydroid-script's venv importing its requirements, control#rendering answering; (2) @AppManagerApp#modules#run refusing an unknown module with nothing done; (3) `borshevik-modules prepare android`, as the App Manager runs it after the password, printing `::module android` and `::result android ok` and exiting 0; (4) what install leaves — the stamp holding 11 or 13, the container service enabled and active, the timer enabled, waydroid0 in the trusted zone, the Android entry in place, the translation layer the CPU's vendor calls for registered as Android's native bridge, nothing of microG in the overlay, waydroid.cfg's channels pointing at control#channel with both recorded datetimes equal to config's approved entries', config's `properties` in waydroid.cfg's [properties] — and, since control#rendering answers `software` on the machine's virtio GPU, its `software_rendering` ones too — control#first-boot in the overlay, and no control#busy left; (5) the Image Manager's waydroid.js under gjs — isInstalled, readImage and checkForUpdate answering without error, and checkForUpdate finding nothing to update right after install; (6) the App Manager's android.js under gjs as tester — an entry the scenario carries itself, F-Droid's client APK at a pinned version with its SHA-256, since the live applications-v2.json may list no Android app, installed with installApps, which starts and stops the session itself, and a second call finding it already installed; (7) update#service skipped by its exec-condition while tester has a session running — and, in that session once Android has booted, config's `properties` among Android's running properties, its `android_settings` applied by control#first-boot, Google Play Services and the Play Store among Android's packages, the GAPPS image's, and control#google printing a decimal ID and `google_account=no` or, Android not having checked in with Google within two minutes, exiting 3 — and run or skipped by the metered condition, as the machine's connection decides, once none runs; (8) control#upgrade exiting 4, having changed nothing, while the scenario itself holds control#busy's lock; then exiting 0 with the stamp still valid — run once as it is, and once after the vendor datetime in waydroid.cfg is set to a build other than the approved one, as on a machine installed from another channel, after which it is the approved one again; (9) control#remove, as the Image Manager runs it for tester (PKEXEC_UID), leaving no stamp, no /var/lib/waydroid, no control#channel, no Android entry, the timer and container disabled, waydroid0 out of the trusted zone, and no ~/.local/share/waydroid for tester; (10) control#install run directly, as the Image Manager runs it, bringing everything in (4) back; (11) no failed system unit after all of it. Finally opens Android's full interface for tester, so the screenshot taken after the scenario shows what the virtual GPU made of it, which it can because @BorshevikWorkflow#test-image-in-vm keeps tester's screen on."
tests:
  - id: static-checks
    description: The scripts parse and the units and desktop entries are well-formed — what @BorshevikWorkflow#validate checks for the whole repository.
    command: bash tests/validate.sh
    expect: exits 0 and prints 'all checks pass'
  - id: in-vm
    description: vm-scenario, run in the test machine on an image that carries the change — selected by itself whenever the change touches its paths.
    command: tests/test-image-in-vm.sh run --scenarios android
    expect: the report's `== scenario android` section ends with 'all checks pass'
  - id: tried-by-the-author
    description: "Manual, on the author's own machine running an image that carries the change, for what in-vm cannot show: the Android tab clicked through — Install, the password prompt, the registration ID shown and the device registered with Google through it, Remove — Android drawing on real graphics, signing in to Google Play, an ARM-only app from Play opening, and a push notification arriving while Android is awake."
    command: the author on their own machine (the `testing` step)
    expect: the author confirms Android installs, Play accepts the registered device, an ARM app runs, push arrives, and Android upgrades and removes cleanly; no failed units on a machine where Android is not installed
recipes:
  - id: approve-images
    description: Moves config's approved images to another system or vendor build — a newer one, or an older one when the approved build turns out broken.
    instructions:
      - Fetch Waydroid's official channel for the image in question — https://ota.waydro.id/system/lineage/waydroid_x86_64/GAPPS.json or https://ota.waydro.id/vendor/waydroid_x86_64/MAINLINE.json — and pick the build; check Waydroid's open issues for reports against it first
      - Replace that image's entry under config's `images` with the build's entry, copied verbatim, so its `id` stays the checksum Waydroid verifies the download against
      - "Carry it through @BorshevikWorkflow like any change: the files are in the android scenario's paths, so @WaydroidApp#tests#in-vm runs by itself, and the author tries it on their own machine (@WaydroidApp#tests#tried-by-the-author), where the next control#upgrade moves Android onto the new pair"
