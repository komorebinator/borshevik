description: "GJS/GTK4+libadwaita application for installing curated Flatpak apps from Flathub. It replaces GNOME Software's first-login app suggestions: it opens once on a user's first login (first-run) and is also available from the app grid. The curated list is not part of this repository — it is fetched at run time from https://borshevik.org/share/applications.json, which is maintained in the Borshevik website's repository (https://github.com/komorebinator/borshevik-landing), so changing what is offered needs no image build. One process per session through its GApplication id, org.borshevik.AppManager, but every activation opens a new window in it, so launching it again while it is open gives a second window."
extends: "@Application"
platform: GJS
src: build_files/root/usr/share/borshevik-app-manager/main.js
components:
  - id: window
    type: "@View"
    src: build_files/root/usr/share/borshevik-app-manager/window.js
    description: "Main window: a stack of pages — loading, load-error, main, installing, results — through which one install run passes. The title carries the build number."
    fields:
      - id: BUILD
        type: string
        description: Build number shown in the title as "(vN)"; bumped by hand for each release of the app.
      - id: this._categories
        type: Array<{name, applications, default}>
        default: "[]"
        description: The categories from the fetched list, as the main page offers them.
      - id: this._categoryRows
        type: Array<{row, sw, cat}>
        default: "[]"
        description: Each rendered category with its switch — what _collectSelectedApps reads to know what the user chose.
      - id: this._cancelCtl
        type: "{cancelled: boolean, currentProc: Gio.Subprocess|null}"
        description: Cancellation handle shared with flatpak-service#installApps — the window sets `cancelled` and kills `currentProc`; the service checks `cancelled` between apps.
      - id: this._mode
        type: "'loading' | 'load_error' | 'main' | 'installing' | 'results'"
        description: The page shown. While it is 'installing' the window cannot be closed and its title buttons are hidden, so an install run cannot be abandoned half-way by closing the window.
    components:
      - id: loading-page
        type: "@View"
        description: Spinner and message while the list is fetched.
      - id: load-error-page
        type: "@View"
        description: The fetch failed or returned no usable category — the message, the raw error (selectable) and Retry, which goes back to loading-page.
        visible: false
        states:
          - id: fetch-failed
            when: the category fetch failed
            property_changes:
              visible: true
      - id: main-page
        type: "@View"
        description: One row per category — its name, a strip of its apps' icons and a switch, on by default when the list marks the category `default` — followed by the Custom section, and Install below.
        components:
          - id: custom-toggle
            type: "@Toggle"
            label: Custom
            description: "Shows the Custom section's other rows when on and hides them when off: a text box for Flatpak app IDs (flatpak-service#parseCustomList), the command that lists a machine's Flathub apps in that format, and a button copying this machine's installed Flathub apps — together a way to carry one's app set to another machine."
          - id: install-button
            type: "@Button"
            label: Install
            description: Starts _onInstallClicked; with nothing selected it only says so.
      - id: installing-page
        type: "@View"
        description: Which app is being installed or skipped, 'N of M', a progress bar, and Cancel — which stops after killing the app being installed, leaving the ones already done in place.
        visible: false
        states:
          - id: installing
            when: an install run is in progress
            property_changes:
              visible: true
      - id: results-page
        type: "@View"
        description: "The report of the run, cancelled or not: already installed, installed, and failed with each failure's message; Copy report, and OK back to the main page."
    functions:
      - id: _loadCategories
        description: Fetches the curated list. Accepts only an array; each category's name is taken in the UI language, then English, then its plain `name`, and a category with no name or no apps is dropped. Anything else — a network error, bad JSON, nothing left — is shown on load-error-page.
      - id: _fetchAppIcon
        description: An app's icon from Flathub's appstream API, cached under the user's cache directory so later runs fetch it only once.
      - id: _collectSelectedApps
        description: The apps of every category switched on, plus the custom list when Custom is on, without duplicates and in the order first met.
      - id: _onInstallClicked
        description: "Runs one install: reads what is already installed first (and carries on without that knowledge if it cannot), then flatpak-service#installApps, updating the installing page for each app. The progress callback drains the GLib main loop so the page repaints between apps. Ends on results-page."
  - id: flatpak-service
    type: "@Singleton"
    description: Flatpak operations — parsing a pasted app-ID list, listing what is installed, and installing a selection.
    src: build_files/root/usr/share/borshevik-app-manager/flatpak.js
    functions:
      - id: parseCustomList
        description: One app ID per line; blank lines and lines starting with '#' are skipped, and only the first word of a line counts, so the output of the hinted command can be pasted as is.
      - id: listInstalledFlathubApps
        description: The installed apps whose origin is the flathub remote — what the copy button puts on the clipboard.
      - id: installApps
        description: Installs the apps one at a time from flathub, non-interactively, skipping the ones already installed. Cancellation is checked before each app and again after the running install ends, so a cancel never starts another install. Returns what was installed, already installed and failed (with the error), and whether the run was cancelled.
  - id: net-service
    type: "@Singleton"
    description: HTTP GET over libsoup with a timeout — JSON or raw bytes; any non-2xx status is an error.
    src: build_files/root/usr/share/borshevik-app-manager/net.js
  - id: launcher
    type: "@ShellScript"
    description: On-PATH entry point; starts the app with `gjs -m`, passing its arguments through.
    src: build_files/root/usr/bin/borshevik-app-manager
  - id: first-run
    type: "@ShellScript"
    description: "Runs the App Manager once per user: started at login by @Services#app-manager-first-run, it does nothing when the user's stamp file exists, and otherwise runs the app and writes the stamp only if the app exits successfully. Closing the window is a successful exit — even when the list failed to load and nothing was offered — so a user who closes it is not asked again; only a crash brings it back at the next login."
    src: build_files/root/usr/bin/borshevik-app-manager-first-run
  - id: i18n
    type: "@Singleton"
    description: Translations for en, ru, uk, ka, hy and be, held in the code itself rather than in files. The language is `--lang` when it names a supported one; otherwise it comes from the first non-empty of LC_ALL, LANG, LANGUAGE, and is English when that one names no supported language — a different order from @ImageManagerApp#i18n's; a missing key falls back to English and then to the key itself.
    src: build_files/root/usr/share/borshevik-app-manager/i18n.js
    fields:
      - id: TRANSLATIONS
        type: "{ [lang: 'en'|'ru'|'uk'|'ka'|'hy'|'be']: { [key: string]: string } }"
        description: The dictionaries, one per language; @BorshevikWorkflow#validate checks that every language has exactly the keys of en.
