description: "The App Manager — how a fresh install gets its applications: a curated selection — Flatpak apps and Android apps, with room for other kinds — offered once, on first login. The app is @AppManagerApp."
extends: "@DuckspecProject"
terms_folder: AppManager/
goals:
  - Get a curated set of useful applications onto a fresh install without the user hunting through Flathub
  - Run once, on first login, and then stay out of the way
uses:
  - https://github.com/komorebinator/duckspec
settings:
  src: ..
  readme: ../README.md
software:
  - "@AppManagerApp"
