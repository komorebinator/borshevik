description: GJS/GTK4+libadwaita application for installing curated Flatpak apps from Flathub. Opens automatically on first login via a systemd user service.
extends: @DuckspecProject
terms_folder: AppManager/
goals:
  - Get a curated set of useful applications onto a fresh install without the user hunting through Flathub
  - Run once, on first login, and then stay out of the way
uses:
  - https://github.com/komorebinator/duckspec
settings:
  src: ..
  readme: ../README.md
software:
  - @AppManagerApp
