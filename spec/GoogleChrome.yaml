description: Google Chrome as Borshevik's default browser, shipped in the image with a system-wide policy (@GoogleChromeApp).
extends: @DuckspecProject
terms_folder: GoogleChrome/
goals:
  - Ship a working browser on first login instead of leaving the user to install one
  - Enforce the intended browser policy system-wide, so defaults do not depend on when the profile was created
uses:
  - https://github.com/komorebinator/duckspec
settings:
  src: ..
software:
  - @GoogleChromeApp
