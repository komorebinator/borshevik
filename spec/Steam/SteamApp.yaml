description: Steam gaming client as integrated in Borshevik — installed with dnf5 at image build time from the negativo17 fedora-multimedia repository the @UniversalBlueGnome base already provides.
extends: "@Software"
platform: RPM
src: build_files/scripts/install-steam.sh
components:
  - id: installer
    type: "@ShellScript"
    description: Installs steam and steam-devices. Enables no repository of its own — fedora-multimedia comes with the base image.
    src: build_files/scripts/install-steam.sh
    functions:
      - id: run
        description: "A single `dnf5 -y --setopt=allow_vendor_change=False install steam steam-devices -x gamescope -x mangohud` under `set -ouex pipefail` — steam-devices supplying the udev rules for controllers. gamescope and mangohud are excluded by name, not by turning weak dependencies off: fedora-multimedia's steam recommends them since 1.0.0.87-4 (2026-10-25) for the performance overlay of a gamescope session, which Borshevik does not ship — the controller is meant to drive GNOME itself — and in a GNOME session Steam uses neither, its own overlay having its own performance monitor; both are only of use when a user wraps a game in them by hand, and Fedora's mangohud is stuck on a release candidate. Its other recommendations — gamemode, ntsync-autoload, dbus-x11, the GNOME portal — are what Steam runs with, so weak dependencies as such stay on. dnf5, not rpm-ostree: Steam's 32-bit libraries must be the exact version of their 64-bit twins in the base, and @UniversalBlueGnome can lag Fedora's updates repository, which keeps only the newest build — in 2026-10 openssl-libs, SDL3 and others were behind, and every nightly base build failed. rpm-ostree never upgrades a package of the base, so it cannot resolve that, and replacing them by name (as @ImageBuild#install-kernel does the kernel) would need a list that changes with every lag; dnf5 upgrades the 64-bit ones it needs to the updates' version by itself. Without vendor changes, so a package of the base is upgraded only by its own vendor's build: left free, dnf5 took fedora-multimedia's libheif, of a higher epoch than Fedora's, which bundles an ffmpeg plugin, and with it dozens of 32-bit codecs and openh264, replacing the base's libheif-ffmpeg and noopenh264 (the first image built with dnf5, 2026-10-08). Without vendor changes the 32-bit packages Steam brings are the set rpm-ostree installed — a rule rather than a list of packages, so it holds whichever packages lag next time."
