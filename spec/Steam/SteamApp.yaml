description: Steam gaming client as integrated in Borshevik — layered via rpm-ostree at image build time from the RPM Fusion nonfree repository the @UniversalBlueGnome base already provides.
extends: @Software
platform: RPM
src: build_files/scripts/install-steam.sh
components:
  - id: installer
    type: @ShellScript
    description: Layers steam and steam-devices. Enables no repository of its own — RPM Fusion nonfree comes with the base image.
    src: build_files/scripts/install-steam.sh
    functions:
      - id: run
        description: "A single `rpm-ostree -y install steam steam-devices` — steam-devices supplying the udev rules for controllers. The whole script is that one command under `set -ouex pipefail`; RPM Fusion nonfree is already configured by @UniversalBlueGnome, so nothing here adds a repository."
