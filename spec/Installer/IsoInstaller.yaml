description: "Configuration and lorax templates for building the Anaconda-based ISO installer; produces a minimal-UI install experience that ends with a bootc switch to the correct Borshevik image on GHCR. Two paths coexist: @BorshevikWorkflow#build-iso, which is what actually ships ISOs, and the image-builder TOML files, which only serve manual local builds."
extends: "@Software"
platform: TOML (image-builder config) + lorax templates (Anaconda)
src: installer/
components:
  - id: partitioning
    type: "@Script"
    description: Lorax template setting the installer's default disk partitioning.
    src: installer/lorax_templates/partitioning.tmpl
    interpreter: lorax template
    functions:
      - id: run
        description: Appends `clearpart --all --initlabel` and `autopart --type=lvm --fstype=ext4` to usr/share/anaconda/interactive-defaults.ks, so the installer wipes the chosen disk and lays out LVM on ext4 without asking. Passed to the build action alongside keyboard and one of the bootc-switch templates.
  - id: keyboard
    type: "@Script"
    interpreter: lorax template
    src: installer/lorax_templates/keyboard.tmpl
    description: "Makes the installer and the LUKS passphrase prompt at boot read one keyboard layout, US English, whatever language is chosen, and gives the installed desktop the layouts Anaconda would have chosen for that language. The passphrase is typed in Anaconda but asked for at boot by Plymouth in the initramfs, which is the image's own and generic (@ImageBuild#finalize-image) and so knows only the console keymap given as `vconsole.keymap=` on the kernel command line. Left to itself, Anaconda gives a Russian install the layouts `us,ru` and the console keymap `ru`; Plymouth 24 then reads keys through the console with kbd's `ru` map — Latin by default, Cyrillic locked on by Ctrl+Shift with nothing on screen changing — and labels the prompt `ru`, the keymap's name rather than the active layer. A user who believed the label and pressed a switch, or who had typed the passphrase in Anaconda's `ru` layout, could not unlock the disk (reproduced in a VM on 2026-10-25; a tester's laptop refused a Latin passphrase typed without switching, a case not explained). Letting the prompt switch layouts was considered and dropped: it needs the user's layouts carried into the generic initramfs (a kernel argument and a dracut hook of our own) and a Plymouth that shows the active layout, which only upstream main has (Plymouth.GetKeyboardLayout, 2026-10-19, for script themes), so the switch would work unseen. With one layout in the installer and the same one at boot, the passphrase can only be typed in what the prompt reads, without patching Anaconda."
    functions:
      - id: run
        description: "Appends three things to the installer image. A `keyboard` command in interactive-defaults.ks setting the layouts to `us` alone and the console keymap to `us`: layouts set by kickstart are kept when a language is chosen (Anaconda's set_x_keyboard_defaults returns early), so the installer has nothing to switch to, and Anaconda writes `vconsole.keymap=us` to the kernel command line itself. An Anaconda configuration file in etc/anaconda/conf.d hiding the keyboard spoke, so a layout cannot be added back by hand; `hidden_spokes` replaces the list the active profile sets, and the installer's profile hides nothing (its user spoke is shown). And a `%post --nochroot` running a Python script the template writes beside interactive-defaults.ks, because the `keyboard` command also left the installed system with `us` alone: the script writes the installed system's /etc/X11/xorg.conf.d/00-keyboard.conf with what Anaconda would have chosen — the first of langtable's keyboards for the system's LANG, behind `us` when it cannot type ASCII, switched with Alt+Shift when there are two. GNOME and GDM take a new account's layouts from systemd-localed, which reads that file when /etc/vconsole.conf names no XKB layout, and Anaconda's vconsole.conf names none. The script runs outside the installed system because langtable is in the installer and not in the image, and finds the system through ANA_INSTALL_PATH, which Anaconda keeps only for compatibility and marks for removal — once it is gone, installs end up with `us` alone on the desktop. Tried on 2026-10-25 in a VM installed in Russian: `us` in the installer and at the LUKS prompt, `vconsole.keymap=us`, `us,ru` switching on the desktop. Only installs from this ISO are affected: a system rebased onto Borshevik keeps its own kernel arguments, and one installed from an earlier ISO keeps `vconsole.keymap=ru` until it is changed by hand."
  - id: bootc-switch
    type: "@Script"
    interpreter: lorax template
    src:
      - installer/lorax_templates/bootc-switch.tmpl
      - installer/lorax_templates/bootc-switch-stable.tmpl
      - installer/lorax_templates/bootc-switch-nvidia.tmpl
      - installer/lorax_templates/bootc-switch-nvidia-stable.tmpl
    description: One template per variant and channel, each ending the installation on that image.
    functions:
      - id: run
        description: Adds a post-install step that switches the installed system to the template's image with the container signature policy enforced, so from its first boot it follows ghcr.io and accepts only Borshevik-signed updates (@SystemConfig#container-policy). @BorshevikWorkflow#build-iso uses only the two :stable ones; the :latest ones are not used by any workflow.
  - id: image-builder-configs
    type: "@ConfigFile"
    src:
      - borshevik.toml
      - borshevik-nvidia.toml
      - image.toml
    description: For building installer media by hand. borshevik.toml and borshevik-nvidia.toml are image-builder configs, one per variant, installing that variant's :latest with disk selection as the only step; image.toml gives bootc-image-builder a 20 GiB minimum root filesystem. No workflow reads them — @BorshevikWorkflow#build-iso builds the published media from the lorax templates instead.
