description: Hiddify VPN client as integrated in Borshevik — an RPM of Borshevik's own made from Hiddify's Debian package and installed in the base layer, launched via a wrapper script that prevents duplicate instances, with a polkit rule for DNS configuration.
extends: "@Software"
platform: Linux (binary)
src: build_files/scripts/borshevik-packages/hiddify/hiddify.spec
components:
  - id: package
    type: "@ConfigFile"
    src: build_files/scripts/borshevik-packages/hiddify/hiddify.spec
    description: "The spec of the hiddify RPM, an own package of @ImageBuild#borshevik-packages-lib#PATCHES_DIR: built by @BorshevikWorkflow#build-borshevik-packages, installed in the base layer by @ImageBuild#install-borshevik-packages. Its Version: is the Hiddify release it packages, pinned rather than the latest so that a new release reaches the image only by a commit, and through the vm-scenario before users (the author, 2026-11-06, after 5.5.5 broke VPN mode with no commit of ours); a new release is a change to Version: and to the checksum of its Debian package. The .deb rather than the AppImage because it has a plain system layout without bundled system libraries. %prep checks the downloaded package against that checksum and unpacks it; the app goes to /usr/libexec/hiddify, taken from the package's /opt/hiddify — /usr/libexec rather than /usr/lib because SELinux labels files there bin_t: in VPN mode the app installs a system service of its own, HiddifyAdminBG, running HiddifyCli from where the app is, and a service started from a lib_t file stays in init_t, which may not open /dev/net/tun, while from a bin_t one it runs as unconfined_service_t, which may (seen 2026-11-06: with /usr/lib/hiddify, where Hiddify had been since 2026-05-17, VPN mode failed with `open /dev/net/tun: permission denied` once 5.x moved the tunnel into that service) — and its two icons to hicolor — the package's own desktop entry and metainfo are not shipped, desktop-entry replaces the one. Prebuilt binaries, so no debug package, no build-id links and none of rpm's post-install processing, which would strip or alter Flutter's libraries; AutoReqProv off, the libraries it needs from the system being in the image already, as they were when the package was unpacked by hand. No file capabilities, and both binaries keep their own RUNPATH, `$ORIGIN/lib`: since 5.x the VPN tunnel is HiddifyAdminBG's, which runs as root, and the proxy modes need no privilege, so the capabilities the image used to set (cap_net_admin, cap_net_raw, cap_net_bind_service, since 2026-05-17, for 4.x's tunnel in the app's own process) would only hand cap_net_admin to any user running either binary — tried 2026-11-06 in the test machine, all three modes connecting through the app without them; they also put the binaries in the loader's secure mode, which needed the absolute RUNPATH and kept the app from following the desktop's dark style. Temporarily (#90), until a Hiddify release fixes it (hiddify/hiddify-app#2411 and #2423, still in 5.5.5): HiddifyCli names its core as `./lib/hiddify-core.so`, a path the loader takes relative to the working directory and never looks up in RUNPATH, so it starts only from its own folder, and the app, which runs it through pkexec from its data folder to connect in VPN mode, fails with exit status 127; the dependency is rewritten to the plain name `hiddify-core.so`, which its RUNPATH then finds, and which on a release without the bug changes nothing."
  - id: wrapper
    type: "@ShellScript"
    description: Launcher that refuses to start a second instance and otherwise execs the real binary.
    src: build_files/root/usr/bin/hiddify
    functions:
      - id: run
        description: "Checks if hiddify is already running via 'pgrep -x hiddify'. If not running, exec /usr/libexec/hiddify/hiddify with all arguments. Prevents duplicate Hiddify instances."
  - id: polkit-rule
    type: "@ConfigFile"
    src: build_files/root/etc/polkit-1/rules.d/50-hiddify.rules
    description: "Polkit rule granting org.freedesktop.resolve1.set-dns-servers, set-domains and set-default-route without authentication, so Hiddify can point systemd-resolved at its own DNS while a tunnel is up. The rule is scoped by session, not by application: it returns YES for any subject whose session is active, and checks `subject.active` alone rather than `subject.local` as well, so every user with an active session gains these three resolved privileges, not Hiddify alone."
  - id: desktop-entry
    type: "@ConfigFile"
    src: build_files/root/usr/share/applications/Hiddify.desktop
    description: "XDG desktop entry replacing the one from the Debian package. Name 'Hiddify (VPN)' with a Russian translation, Icon=hiddify, StartupWMClass=app.hiddify.com, Categories=Network, and MimeType handlers for the hiddify, v2ray, clash and sing-box URI schemes. Exec is `/usr/libexec/hiddify/hiddify %U` — the binary directly, bypassing @HiddifyApp#wrapper, so the single-instance guard does not apply to launches from the application grid."
  - id: vm-scenario
    type: "@ShellScript"
    src:
      - tests/scenarios/vpn/guest.sh
      - tests/scenarios/vpn/paths
    description: "The vpn scenario of @BorshevikWorkflow#scenarios: whether Hiddify's core, as the image installs it, brings a tunnel up in VPN (TUN) mode and carries traffic through it. Run whenever a change touches Hiddify's package, how it is launched or how it is allowed to set DNS, and — package being a Borshevik package — whenever the image's build of it is not :stable's (@BorshevikWorkflow#scenarios)."
    functions:
      - id: run
        description: "After the login and the checks, with nothing leaving the machine: a test server and the client each in a network namespace of their own, joined by a veth pair, since the tunnel's routes take all of a namespace's traffic and in the guest's own would take the ssh session the scenario runs over. The server is a SOCKS5 proxy that answers a connection to 198.51.100.1:80 (TEST-NET-2) itself with a token made for the run; the client namespace's default route leads to it, and the address reaches nothing there with no tunnel, which is checked first. HiddifyCli parses a socks:// profile for the server as tester, from the app's data folder (~/.local/share/app.hiddify.com) — where the app runs it from, so a library HiddifyCli reaches only from its own folder fails here. Then a tunnel is brought up with --tun as a system service started by systemd, with a folder of its own in /var/lib, as the app's HiddifyAdminBG runs it in VPN mode, where the SELinux domain the file's label leads to decides whether /dev/net/tun may be opened (package). Passes when a tun device comes up in the client namespace, the address answers with the token through it, and once HiddifyCli is stopped the device is gone and the address reaches nothing again; a failure names the domain the service ran in and the SELinux denial the journal holds. Tried 2026-11-06 on the service's file label: with bin_t it passes, with lib_t the tunnel fails as the app did, `open /dev/net/tun: permission denied` from init_t. It does not drive the app's window or its pkexec prompt, nor any real provider's protocol."
