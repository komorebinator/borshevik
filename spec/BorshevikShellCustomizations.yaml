description: How the GNOME desktop and the login screen look and behave out of the box — the system-wide defaults every account starts from (@ShellCustomizations).
extends: @DuckspecProject
terms_folder: BorshevikShellCustomizations/
goals:
  - Make the desktop look and behave the intended way on first login, with no per-user setup step
  - Apply appearance and behaviour system-wide at image build time, so the settings survive a rebase and apply to every account including GDM
uses:
  - https://github.com/komorebinator/duckspec
settings:
  src: ..
software:
  - @ShellCustomizations
