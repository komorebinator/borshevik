description: Prebuilt kernel RPMs and kmod content, published by uBlue. Not an OS base image: its filesystem is copied into the base layer's build, where @ImageBuild#install-kernel takes the kernel from it. Borshevik uses the `coreos-stable` flavour — the stock Fedora kernel as Fedora CoreOS ships it, a few releases behind Fedora's newest. Needed only while @ImageBuild#install-kernel exists. External dependency — not built by this project.
registry: ghcr.io/ublue-os
repository: https://github.com/ublue-os/akmods
platform: OCI container image, published to ghcr.io/ublue-os
extends: @ContainerImage
tags:
  - "coreos-stable-<FEDORA_MAJOR_VERSION> — e.g. coreos-stable-44; rolling, follows whatever kernel Fedora CoreOS currently ships"
