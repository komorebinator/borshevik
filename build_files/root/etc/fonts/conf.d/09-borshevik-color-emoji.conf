<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Fedora 43 rebuilt google-noto-color-emoji-fonts as COLRv1 (Noto-COLRv1.ttf,
    COLR/CPAL tables only). Renderers without COLRv1 support draw nothing at all
    for it. install-emoji-font.sh installs the upstream build instead, which
    carries CBDT/CBLC colour bitmaps under the same "Noto Color Emoji" family
    name - so this hides the Fedora file, leaving exactly one font answering to
    that family. Everything else about emoji selection stays stock: the "emoji"
    generic family and the und-zsye rule in 60-generic.conf resolve to the
    replacement on their own.
  -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/google-noto-color-emoji-fonts/*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
