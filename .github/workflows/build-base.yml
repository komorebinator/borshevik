name: Build Base Images

on:
  schedule:
    - cron: '00 10 * * *'
  workflow_dispatch:

env:
  IMAGE_DESC: "Borshevik is a custom Universal Blue image"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  ARTIFACTHUB_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"

jobs:
  # A scheduled run builds nothing when another run of this branch started in the last 20 hours
  # succeeded or is still going: a build made by hand is not made again, and a run in progress
  # is not cancelled by this one's concurrency group. A run by hand always builds.
  recent:
    name: Look for a recent build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for a recent build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != schedule ]]; then
            echo "Run by hand: building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          recent="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/build-base.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f created=">=$since" -f per_page=100 \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID)
                  | select(.conclusion == \"success\" or .status != \"completed\")
                  | \"\(.html_url) \(.event), started \(.created_at), \(.conclusion // .status)\"")"
          if [[ -n "$recent" ]]; then
            echo "Built in the last 20 hours, nothing to do:"
            sed 's/^/  /' <<<"$recent"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No build since $since: building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  packages:
    name: Borshevik's package builds
    needs: recent
    if: needs.recent.outputs.skip != 'true'
    uses: ./.github/workflows/build-borshevik-packages.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  build_and_push:
    name: Build and push both base images
    needs: packages
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_TAGS: latest
    permissions:
      contents: read
      packages: write
      id-token: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: true

    strategy:
      matrix:
        include:
          - variant: borshevik-base
            target: borshevik-base
          - variant: borshevik-base-nvidia
            target: borshevik-base-nvidia

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +%d.%m.%Y)" >> "$GITHUB_ENV"

      - name: Create /mnt/xdg-data for container storage
        run: |
          sudo mkdir -p /mnt/xdg-data
          sudo chown -R runner:runner /mnt/xdg-data
          echo "XDG_DATA_HOME=/mnt/xdg-data" >> $GITHUB_ENV

      # before the build, which pulls the packages image
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.variant }} image
        id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          containerfiles: |
            ./Containerfile
          extra-args: |
            --target ${{ matrix.target }}
            --build-arg IMAGE_TAG=${{ env.BUILD_TAGS }}
            --build-arg BUILD_DATE=${{ env.BUILD_DATE }}
            --build-arg IMAGE_NAME=${{ matrix.target }}
            --build-arg PACKAGES_TAG=${{ needs.packages.outputs.tag }}
          image: ${{ matrix.variant }}
          tags: |
            ${{ env.BUILD_TAGS }}
            ${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.title=${{ matrix.variant }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/blob/main/Containerfile
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            io.artifacthub.package.logo-url=${{ env.ARTIFACTHUB_LOGO_URL }}
            io.artifacthub.package.keywords=bootc,ublue,universal-blue
            containers.bootc=1
            org.borshevik.packages=${{ needs.packages.outputs.label }}

      - name: Disk debug (on failure)
        if: failure()
        run: |
          df -h / /mnt || true
          du -sh /mnt/xdg-data/containers/storage 2>/dev/null || true
          du -sh /home/runner/.local/share/containers/storage 2>/dev/null || true
          podman system df -v || true

      - name: Normalize registry name
        id: registry_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Normalize image name
        id: image_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ matrix.variant }}

      - name: Push image
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          registry: ${{ steps.registry_case.outputs.lowercase }}
          image: ${{ steps.build.outputs.image }}
          tags: |
            ${{ env.BUILD_TAGS }}
            ${{ env.BUILD_DATE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Get image digest
        id: digest
        run: |
          IMAGE_FULL="${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}"
          DIGEST=$(skopeo inspect "docker://$IMAGE_FULL:$BUILD_TAGS" | jq -r '.Digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign image by digest
        run: |
          IMAGE_FULL="${{ steps.registry_case.outputs.lowercase }}/${{ steps.image_case.outputs.lowercase }}"
          echo "Signing $IMAGE_FULL@${{ steps.digest.outputs.digest }}"
          cosign sign -y --use-signing-config=false --new-bundle-format=false --key env://COSIGN_PRIVATE_KEY "$IMAGE_FULL@${{ steps.digest.outputs.digest }}"
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_EXPERIMENTAL: false

  build-borshevik:
    name: Build Borshevik Images
    needs: build_and_push
    uses: ./.github/workflows/build-borshevik.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
